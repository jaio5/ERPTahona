# Perfil de desarrollo usando H2 en memoria
spring.datasource.url=jdbc:h2:mem:erpdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=5

# Habilitar Flyway para pruebas con H2 (aplica migraciones en memoria)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# evitar que flyway intente migrar una base MySQL en dev
# ver archivo application-dev.properties para configuración de MySQL

