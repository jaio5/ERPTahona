# ===========================================
# CONFIGURACION DE PRODUCCION - ERP TAHONA
# GRUPO BABO, S.Coop.V.L.
# ===========================================

# Puerto de aplicacion
server.port=8080

# ===========================================
# BASE DE DATOS - MySQL Produccion
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/tahona?useSSL=false&serverTimezone=Europe/Madrid&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================================
# CONFIGURACION REGIONAL - ESPAÑA
# ===========================================
spring.web.locale=es_ES
spring.web.locale-resolver=fixed

# Zona horaria de España
spring.jackson.time-zone=Europe/Madrid
spring.jackson.date-format=dd/MM/yyyy

# ===========================================
# VERIFACTU - GRUPO BABO
# ===========================================
# Certificado digital (PKCS12)
verifactu.keystore.path=/certs/mi_certificado.p12
verifactu.keystore.password=changeit
verifactu.key.alias=mi_certificado
verifactu.key.password=changeit

# Empresa emisora (se obtiene de empresa_config en BD)
verifactu.empresa.cif=F54059985
verifactu.empresa.nombre=GRUPO BABO, S.Coop.V.L.

# Sistema informatico
verifactu.sistema.nombre=ERP Tahona
verifactu.sistema.version=1.0.0
verifactu.sistema.nif.desarrollador=F54059985

# Endpoint AEAT (PRODUCCION)
# IMPORTANTE: Cambiar cuando este en produccion real
verifactu.aeat.url=https://www.agenciatributaria.gob.es/verifactu
verifactu.aeat.enabled=false

# Modo de pruebas (true = no envia realmente a AEAT)
verifactu.test.mode=true

# ===========================================
# LOGGING
# ===========================================
logging.level.root=INFO
logging.level.alicanteweb.erp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Archivo de log
logging.file.name=logs/erp-tahona.log
logging.file.max-size=10MB
logging.file.max-history=30

# Pattern de log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================================
# CONFIGURACION DE IMPRESION
# ===========================================
print.temp.directory=${java.io.tmpdir}/erp-tahona
print.auto.open=true

# ===========================================
# SEGURIDAD
# ===========================================
# Activar en produccion
spring.security.enabled=false

# ===========================================
# BACKUP AUTOMATICO
# ===========================================
backup.enabled=true
backup.directory=C:/backups/erp-tahona
backup.schedule.cron=0 0 2 * * ?
backup.retention.days=30

# ===========================================
# CONFIGURACION FISCAL ESPAÑA
# ===========================================
# IVA por defecto
fiscal.iva.general=21
fiscal.iva.reducido=10
fiscal.iva.superreducido=4

# Retencion IRPF
fiscal.irpf.profesionales=15
fiscal.irpf.actividades=7

# Formato de facturas
fiscal.factura.serie.prefijo=FAC
fiscal.factura.numero.digitos=6

# ===========================================
# NOTIFICACIONES
# ===========================================
# Email (configurar SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email de notificaciones
notification.email.from=erp@grupobaelo.com
notification.email.to=administracion@grupobaelo.com

# ===========================================
# MANTENIMIENTO
# ===========================================
# Actuator endpoints (monitoreo)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Info de la aplicacion
info.app.name=ERP Tahona
info.app.description=Sistema de Gestion para GRUPO BABO
info.app.version=1.0.0
info.app.empresa=GRUPO BABO, S.Coop.V.L.
info.app.cif=F54059985

