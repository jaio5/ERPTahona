# Production profile - MySQL configuration.
# All sensitive and environment-specific values must be supplied externally.

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.leak-detection-threshold=${SPRING_DATASOURCE_HIKARI_LEAK_THRESHOLD:60000}
spring.datasource.hikari.auto-commit=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Detrás de un reverse proxy con TLS (nginx/Caddy/Traefik): "native" usa el
# RemoteIpValve de Tomcat, que solo procesa X-Forwarded-* de proxies internos de
# confianza; así getRemoteAddr() devuelve la IP real (rate limiting) y HSTS se emite.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
# Ponlo a true en cuanto la app se sirva por HTTPS: la cookie de sesión dejará
# de enviarse en peticiones HTTP planas.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

logging.level.org.springframework=warn
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
logging.level.alicanteweb=info
logging.file.name=${ERP_LOG_FILE:logs/erp-tahona.log}

backup.directory=${ERP_BACKUP_DIRECTORY:backups}
backup.retention.days=${ERP_BACKUP_RETENTION_DAYS:30}

cifrado.aes.key=${CIFRADO_AES_KEY}
cifrado.aes.use-pbkdf2=${CIFRADO_AES_USE_PBKDF2:false}
cifrado.aes.pbkdf2.salt=${CIFRADO_AES_PBKDF2_SALT:}
cifrado.aes.pbkdf2.iterations=${CIFRADO_AES_PBKDF2_ITERATIONS:185000}

security.pbkdf2.secret=${SECURITY_PBKDF2_SECRET}
security.pbkdf2.iterations=${SECURITY_PBKDF2_ITERATIONS:185000}
security.pbkdf2.hashWidth=${SECURITY_PBKDF2_HASH_WIDTH:256}

# Vacío = firma/remisión VeriFactu deshabilitadas hasta configurar el certificado (ver DatabaseStartupChecker)
verifactu.keystore.path=${VERIFACTU_CERT_PATH:}
verifactu.keystore.password=${VERIFACTU_CERT_PASSWORD:}
verifactu.key.alias=${VERIFACTU_KEY_ALIAS:mi_certificado}
verifactu.key.password=${VERIFACTU_KEY_PASSWORD:${VERIFACTU_CERT_PASSWORD:}}
verifactu.aeat.enabled=${VERIFACTU_AEAT_ENABLED:false}
verifactu.aeat.endpoint=${VERIFACTU_AEAT_ENDPOINT:https://prewww2.aeat.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu}

admin.default.password=${ADMIN_DEFAULT_PASSWORD}

clientes.autocompletar.enabled=${CLIENTES_AUTOCOMPLETAR_ENABLED:true}
clientes.autocompletar.endpoint=${CLIENTES_AUTOCOMPLETAR_ENDPOINT:https://apiempresas.es/api/v1/companies}
clientes.autocompletar.api-key=${CLIENTES_AUTOCOMPLETAR_API_KEY:}
clientes.autocompletar.timeout-seconds=${CLIENTES_AUTOCOMPLETAR_TIMEOUT_SECONDS:8}
clientes.autocompletar.cif-param=${CLIENTES_AUTOCOMPLETAR_CIF_PARAM:cif}
clientes.autocompletar.nombre-param=${CLIENTES_AUTOCOMPLETAR_NOMBRE_PARAM:q}
