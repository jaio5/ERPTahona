# Production profile - MySQL configuration (values set via environment in prod)
# WARNING: For security, avoid hardcoding passwords in repos. You can provide DB_PASSWORD env var.

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tahona?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Do NOT store passwords in the repo. Provide DB_PASSWORD as an environment variable in production.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=20
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# In production, prefer 'validate'. You can override to 'update' for non-production environments.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# Flyway: enable in prod if you manage migrations
spring.flyway.enabled=true
