# APLICACIÓN PROPERTIES - DEBUG MODE
# Este archivo temporal habilita logs de debug

# DATABASE (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tahona?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Iirne322*
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LOGGING - DEBUG MODE
logging.level.root=INFO
logging.level.alicanteweb.erp=DEBUG
logging.level.alicanteweb.erp.service.AutenticacionService=DEBUG
