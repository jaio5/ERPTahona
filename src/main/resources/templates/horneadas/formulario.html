<section>
    <div class="topbar"><h4 th:text="${titulo}">Registrar horneada</h4><a th:href="@{/web/horneadas}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <form th:action="@{/web/horneadas}" method="post" class="card p-3">
        <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Tipo</label><input name="tipo" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Temp. inicial</label><input name="tempIni" type="number" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Temp. final</label><input name="tempFin" type="number" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Cantidad</label><input name="cantidad" type="number" step="0.01" class="form-control"></div>
            <div class="col-md-5"><label class="form-label">Resultado</label><input name="resultado" class="form-control"></div>
            <div class="col-12"><label class="form-label">Observaciones</label><textarea name="observaciones" class="form-control"></textarea></div>
        </div>
        <div class="mt-4"><button class="btn btn-primary" type="submit">Guardar</button><a th:href="@{/web/horneadas}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
    </form>
</section>
