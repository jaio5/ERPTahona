<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Registrar horneada</h1>
            <p>Datos de la hornada y costes reales de producción</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/horneadas}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card form-card-narrow">
        <form th:action="@{/web/horneadas}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${horneada?.id}">

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-fire" aria-hidden="true"></i>Hornada</h2>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="tipo">Tipo</label>
                        <input type="text" id="tipo" name="tipo" class="form-control"
                               th:value="${horneada?.tipoHorneada}" placeholder="Pan, bollería…">
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="tempIni">Temp. inicial (°C)</label>
                        <input type="text" inputmode="decimal" id="tempIni" name="tempIni" class="form-control text-end"
                               th:value="${horneada?.temperaturaInicial}">
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="tempFin">Temp. final (°C)</label>
                        <input type="text" inputmode="decimal" id="tempFin" name="tempFin" class="form-control text-end"
                               th:value="${horneada?.temperaturaFinal}">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-clipboard-check" aria-hidden="true"></i>Resultado</h2>
                <div class="row g-3">
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="cantidad">Cantidad producida</label>
                        <input type="text" inputmode="decimal" id="cantidad" name="cantidad" class="form-control text-end"
                               th:value="${horneada?.cantidadProducida}" placeholder="0">
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="resultado">Resultado</label>
                        <select id="resultado" name="resultado" class="form-select">
                            <option value="">Sin registrar</option>
                            <option value="OK"  th:selected="${horneada?.resultado == 'OK'}">OK</option>
                            <option value="NOK" th:selected="${horneada?.resultado == 'NOK'}">NOK</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="observaciones">Observaciones</label>
                        <textarea id="observaciones" name="observaciones" class="form-control" rows="3"
                                  th:text="${horneada?.observaciones}"
                                  placeholder="Incidencias, ajustes realizados…"></textarea>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-calculator" aria-hidden="true"></i>Costes reales</h2>
                <p class="form-section-hint">Se usan para calcular el coste unitario de la horneada. Admite coma decimal.</p>
                <div class="row g-3">
                    <div class="col-sm-4">
                        <label class="form-label" for="costeManoObra">Mano de obra (€)</label>
                        <input type="text" inputmode="decimal" id="costeManoObra" name="costeManoObra" class="form-control text-end"
                               th:value="${horneada?.costeManoObra}" placeholder="0,00">
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label" for="costeEnergia">Energía (€)</label>
                        <input type="text" inputmode="decimal" id="costeEnergia" name="costeEnergia" class="form-control text-end"
                               th:value="${horneada?.costeEnergia}" placeholder="0,00">
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label" for="costeMateriales">Materiales (€)</label>
                        <input type="text" inputmode="decimal" id="costeMateriales" name="costeMateriales" class="form-control text-end"
                               th:value="${horneada?.costeMateriales}" placeholder="0,00">
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1" aria-hidden="true"></i>Guardar horneada
                </button>
                <a th:href="@{/web/horneadas}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
