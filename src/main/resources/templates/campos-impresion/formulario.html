<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Campo de impresión</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/campos-impresion}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card" style="max-width:720px;">
        <form th:action="@{/web/campos-impresion}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${campo?.id}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="ambito">Ámbito *</label>
                    <select id="ambito" name="ambito" class="form-select">
                        <option value="EMPRESA" th:selected="${campo == null or campo.ambito == 'EMPRESA'}">Global (todos)</option>
                        <option value="CLIENTE" th:selected="${campo != null and campo.ambito == 'CLIENTE'}">Cliente concreto</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="clienteId">Cliente (si ámbito = cliente)</label>
                    <select id="clienteId" name="clienteId" class="form-select" data-searchable>
                        <option value="">— Ninguno —</option>
                        <option th:each="cl : ${clientes}" th:value="${cl.id}"
                                th:text="${cl.nombre + (cl.cif != null ? ' (' + cl.cif + ')' : '')}"
                                th:selected="${campo != null and campo.clienteId == cl.id}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="etiqueta">Etiqueta *</label>
                    <input type="text" id="etiqueta" name="etiqueta" class="form-control"
                           th:value="${campo?.etiqueta}" placeholder="Ref. cliente" required>
                    <div class="invalid-feedback">La etiqueta es obligatoria.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="valor">Valor</label>
                    <input type="text" id="valor" name="valor" class="form-control"
                           th:value="${campo?.valor}" placeholder="Texto que se imprime">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="documento">Documento *</label>
                    <select id="documento" name="documento" class="form-select">
                        <option value="AMBOS"   th:selected="${campo == null or campo.documento == 'AMBOS'}">Factura y albarán</option>
                        <option value="FACTURA" th:selected="${campo != null and campo.documento == 'FACTURA'}">Solo factura</option>
                        <option value="ALBARAN" th:selected="${campo != null and campo.documento == 'ALBARAN'}">Solo albarán</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="ubicacion">Zona *</label>
                    <select id="ubicacion" name="ubicacion" class="form-select">
                        <option value="CABECERA"      th:selected="${campo != null and campo.ubicacion == 'CABECERA'}">Cabecera</option>
                        <option value="CLIENTE"       th:selected="${campo != null and campo.ubicacion == 'CLIENTE'}">Junto al cliente</option>
                        <option value="OBSERVACIONES" th:selected="${campo != null and campo.ubicacion == 'OBSERVACIONES'}">Observaciones</option>
                        <option value="PIE"           th:selected="${campo == null or campo.ubicacion == 'PIE'}">Pie</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="orden">Orden</label>
                    <input type="number" id="orden" name="orden" class="form-control"
                           th:value="${campo?.orden}" min="0" step="1">
                </div>
                <div class="col-12">
                    <div class="form-check mt-1">
                        <input class="form-check-input" type="checkbox" id="activo" name="activo" value="true"
                               th:checked="${campo == null or campo.activo == null or campo.activo}">
                        <label class="form-check-label" for="activo">Activo</label>
                    </div>
                </div>
            </div>
            <div class="form-actions mt-4">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1"></i>Guardar
                </button>
                <a th:href="@{/web/campos-impresion}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
