<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Usuario</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/usuarios}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

    <div class="row g-4">
        <div th:class="${usuario?.id != null ? 'col-lg-8' : 'col-12'}">
            <div class="form-card">
                <div class="form-section-title">
                    <i class="bi bi-person-gear"></i> Datos del usuario
                </div>
                <form th:action="${usuario?.id != null ? '/web/usuarios/' + usuario.id : '/web/usuarios'}"
                      method="post" class="needs-validation" novalidate>
                    <input type="hidden" name="id" th:value="${usuario?.id}">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label" for="username">Usuario *</label>
                            <input id="username" name="username" class="form-control" required autocomplete="off"
                                   th:value="${usuario?.username}"
                                   th:readonly="${usuario?.id != null}">
                            <div class="invalid-feedback">El nombre de usuario es obligatorio.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input id="nombre" name="nombre" class="form-control" th:value="${usuario?.nombre}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="email">Email</label>
                            <input id="email" name="email" type="email" class="form-control" th:value="${usuario?.email}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="role">Rol</label>
                            <select id="role" name="role" class="form-select">
                                <option value="">— Sin rol —</option>
                                <option value="USER" th:selected="${usuario?.role == 'USER'}">Usuario</option>
                                <option value="ADMIN" th:selected="${usuario?.role == 'ADMIN'}">Administrador</option>
                                <option value="MANAGER" th:selected="${usuario?.role == 'MANAGER'}">Gestor</option>
                                <option value="READONLY" th:selected="${usuario?.role == 'READONLY'}">Solo lectura</option>
                            </select>
                        </div>
                        <div th:if="${usuario?.id == null}" class="col-md-4">
                            <label class="form-label" for="password">Contraseña *</label>
                            <input id="password" name="password" type="password" class="form-control" required autocomplete="new-password">
                            <div class="invalid-feedback">La contraseña es obligatoria.</div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" data-no-double-click>
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="${usuario?.id != null ? 'Guardar cambios' : 'Crear usuario'}">Guardar</span>
                        </button>
                        <a th:href="@{/web/usuarios}" class="btn btn-ghost">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Panel de contraseña (solo en edición) -->
        <div class="col-lg-4" th:if="${usuario?.id != null}">
            <div class="form-card">
                <div class="form-section-title">
                    <i class="bi bi-shield-lock"></i> Contraseña
                </div>
                <form th:action="@{/web/usuarios/{id}/password(id=${usuario.id})}" method="post"
                      class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="newPassword">Nueva contraseña *</label>
                        <input id="newPassword" name="newPassword" type="password" class="form-control" required
                               autocomplete="new-password" minlength="6">
                        <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                    </div>
                    <button type="submit" class="btn btn-outline-warning btn-sm" data-no-double-click>
                        <i class="bi bi-key me-1"></i>Cambiar contraseña
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
