<section>
    <div class="topbar"><h4 th:text="${titulo}">Nuevo usuario</h4><a th:href="@{/web/usuarios}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <form th:action="@{/web/usuarios}" method="post" class="card p-3">
        <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Usuario</label><input name="username" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Nombre</label><input name="nombre" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control"></div>
        </div>
        <div class="mt-4"><button class="btn btn-primary" type="submit">Guardar</button><a th:href="@{/web/usuarios}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
    </form>
</section>
