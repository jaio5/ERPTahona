<section>
    <div class="topbar"><h4 th:text="${titulo}">Nueva ruta</h4><a th:href="@{/web/rutas}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <form th:action="@{/web/rutas}" method="post" class="card p-3">
        <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Codigo</label><input name="codigo" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Nombre</label><input name="nombre" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Conductor</label><input name="conductor" class="form-control"></div>
            <div class="col-12"><label class="form-label">Descripcion</label><textarea name="descripcion" class="form-control"></textarea></div>
        </div>
        <div class="mt-4"><button class="btn btn-primary" type="submit">Guardar</button><a th:href="@{/web/rutas}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
    </form>
</section>
