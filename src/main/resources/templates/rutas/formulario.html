<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Ruta</h1>
            <p>Ruta maestra de reparto: de aquí salen las hojas de ruta diarias</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/rutas}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card form-card-narrow">
        <form th:action="@{/web/rutas}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${ruta?.id}">

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-signpost-split" aria-hidden="true"></i>Datos de la ruta</h2>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="codigo">Código *</label>
                        <input type="text" id="codigo" name="codigo" class="form-control"
                               th:value="${ruta?.codigo}" required>
                        <div class="invalid-feedback">El código es obligatorio.</div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" class="form-control"
                               th:value="${ruta?.nombre}" required>
                        <div class="invalid-feedback">El nombre es obligatorio.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="conductor">Conductor habitual</label>
                        <input type="text" id="conductor" name="conductor" class="form-control"
                               th:value="${ruta?.conductor}">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" class="form-control" rows="3"
                                  th:text="${ruta?.descripcion}"
                                  placeholder="Zonas, paradas habituales…"></textarea>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1" aria-hidden="true"></i>Guardar ruta
                </button>
                <a th:href="@{/web/rutas}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
