<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>
@page { size: A4; margin: 15mm 12mm; }
* { box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #222; margin: 0; }
.header { width: 100%; border-bottom: 3px solid #1a3a5c; padding-bottom: 10px; margin-bottom: 14px; }
.empresa-nombre { font-size: 16px; font-weight: bold; color: #1a3a5c; }
.empresa-datos { font-size: 9px; color: #555; margin-top: 2px; }
.doc-titulo { font-size: 22px; font-weight: bold; text-align: right; color: #1a3a5c; }
.doc-numero { font-size: 13px; text-align: right; color: #444; }
.section-box { border: 1px solid #ddd; padding: 8px 10px; margin-bottom: 10px; font-size: 10px; }
.label-caption { font-size: 8px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
table.lineas { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 10px; }
table.lineas thead tr { background-color: #1a3a5c; color: white; }
table.lineas thead th { padding: 6px 8px; text-align: left; }
table.lineas tbody tr:nth-child(even) { background-color: #f7f9fb; }
table.lineas tbody td { padding: 5px 8px; border-bottom: 1px solid #eee; }
.firma-box { margin-top: 40px; border-top: 1px solid #999; padding-top: 6px; font-size: 9px; color: #666; width: 200px; text-align: center; }
.footer { margin-top: 20px; padding-top: 8px; border-top: 1px solid #ddd; font-size: 8px; color: #999; text-align: center; }
.two-col { width: 100%; border-collapse: collapse; }
.two-col td { vertical-align: top; }
</style>
</head>
<body>

<!-- Cabecera -->
<table class="two-col header">
  <tr>
    <td style="width:60%">
      <div class="empresa-nombre" th:text="${empresa.nombreEmpresa}">Empresa</div>
      <div class="empresa-datos">
        <span th:text="${empresa.cif}"></span> ·
        <span th:text="${empresa.direccion}"></span><br/>
        <span th:text="${empresa.codigoPostal}"></span>
        <span th:text="${empresa.ciudad}"></span>
        <span th:if="${empresa.telefono != null}"> · Tel: <span th:text="${empresa.telefono}"></span></span>
      </div>
    </td>
    <td style="text-align:right;">
      <div class="doc-titulo">ALBARÁN</div>
      <div class="doc-numero" th:text="${albaran.numero}"></div>
    </td>
  </tr>
</table>

<!-- Cliente + fecha -->
<table class="two-col" style="margin-bottom:12px;">
  <tr>
    <td style="width:55%">
      <div class="section-box" th:if="${albaran.cliente != null}">
        <div class="label-caption">Cliente</div>
        <strong th:text="${albaran.cliente.nombre}"></strong>
        <span th:if="${albaran.cliente.cif != null}"><br/><span th:text="${albaran.cliente.cif}"></span></span>
        <span th:if="${albaran.cliente.direccion != null}"><br/><span th:text="${albaran.cliente.direccion}"></span></span>
        <span th:if="${albaran.cliente.poblacion != null}">
          <br/><span th:text="${albaran.cliente.codigoPostal}"></span>
          <span th:text="${albaran.cliente.poblacion}"></span>
        </span>
      </div>
    </td>
    <td style="width:5%"></td>
    <td style="width:40%">
      <table style="width:100%;font-size:10px;border-collapse:collapse;">
        <tr>
          <td style="color:#666;width:80px;">Fecha</td>
          <td><strong th:text="${albaran.fecha != null ? #temporals.format(albaran.fecha, 'dd/MM/yyyy') : '-'}"></strong></td>
        </tr>
        <tr th:if="${albaran.almacen != null}">
          <td style="color:#666;">Almacén</td>
          <td th:text="${albaran.almacen.nombre}"></td>
        </tr>
        <tr>
          <td style="color:#666;">Estado</td>
          <td th:text="${albaran.estado}">PENDIENTE</td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<!-- Líneas -->
<table class="lineas">
  <thead>
    <tr>
      <th>Artículo / Descripción</th>
      <th style="text-align:right;width:80px;">Cantidad</th>
      <th style="text-align:right;width:80px;">Precio</th>
      <th style="text-align:right;width:80px;">Total</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="linea : ${albaran.albaranVentaLineas}">
      <td th:text="${linea.articulo != null ? linea.articulo.nombre : linea.descripcion}">-</td>
      <td style="text-align:right;" th:text="${linea.cantidad}">0</td>
      <td style="text-align:right;" th:text="${linea.precio != null ? #numbers.formatDecimal(linea.precio, 1, 'COMMA', 2, 'POINT') + ' €' : '-'}">-</td>
      <td style="text-align:right;font-weight:bold;"
          th:text="${linea.cantidad != null and linea.precio != null ? #numbers.formatDecimal(linea.cantidad.multiply(linea.precio), 1, 'COMMA', 2, 'POINT') + ' €' : '-'}">-</td>
    </tr>
  </tbody>
</table>

<!-- Total si existe -->
<div th:if="${albaran.total != null}" style="text-align:right;margin-top:8px;font-size:13px;">
  <strong>Total: <span th:text="${#numbers.formatDecimal(albaran.total, 1, 'COMMA', 2, 'POINT') + ' €'}"></span></strong>
</div>

<!-- Observaciones -->
<div th:if="${albaran.observaciones != null and !albaran.observaciones.isEmpty()}"
     style="margin-top:12px;font-size:10px;color:#555;">
  <strong>Observaciones:</strong> <span th:text="${albaran.observaciones}"></span>
</div>

<!-- Firma del receptor -->
<div style="margin-top:30px;">
  <div class="firma-box">
    Firma y sello del receptor
  </div>
</div>

<!-- Pie -->
<div class="footer">
  Albarán generado · Sistema ERP Tahona ·
  <span th:text="${#temporals.format(now, 'dd/MM/yyyy HH:mm')}"></span>
</div>

</body>
</html>
