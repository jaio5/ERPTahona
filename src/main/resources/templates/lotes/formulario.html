<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Lote</h1>
            <p>Trazabilidad: qué se produjo, cuándo y hasta cuándo se puede vender</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/lotes}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card form-card-narrow">
        <form th:action="@{/web/lotes}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${lote?.id}">

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-upc-scan" aria-hidden="true"></i>Identificación</h2>
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label" for="codigo">Código de lote *</label>
                        <input type="text" id="codigo" name="codigo" class="form-control"
                               th:value="${lote?.codigo}" required autocomplete="off">
                        <div class="invalid-feedback">El código es obligatorio.</div>
                    </div>
                    <div class="col-md-7">
                        <label class="form-label" for="articuloId">Artículo</label>
                        <select id="articuloId" name="articuloId" class="form-select" data-searchable>
                            <option value="">Selecciona un artículo…</option>
                            <option th:each="a : ${articulos}" th:value="${a.id}"
                                    th:text="${a.nombre}"
                                    th:selected="${lote?.articulo?.id == a.id}"></option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-calendar-event" aria-hidden="true"></i>Fechas y cantidad</h2>
                <div class="row g-3">
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="fechaProd">Fecha de producción *</label>
                        <input type="date" id="fechaProd" name="fechaProd" class="form-control" required
                               th:value="${lote?.fechaProduccion != null ? lote.fechaProduccion : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                        <div class="invalid-feedback">La fecha de producción es obligatoria.</div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="fechaCad">Fecha de caducidad *</label>
                        <input type="date" id="fechaCad" name="fechaCad" class="form-control" required
                               th:value="${lote?.fechaCaducidad}">
                        <div class="invalid-feedback">La fecha de caducidad es obligatoria.</div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="cantidad">Cantidad inicial</label>
                        <input type="text" inputmode="decimal" id="cantidad" name="cantidad" class="form-control text-end"
                               th:value="${lote?.cantidadInicial != null ? #numbers.formatDecimal(lote.cantidadInicial, 1, 'NONE', 2, 'COMMA') : ''}"
                               placeholder="0,00">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-shield-check" aria-hidden="true"></i>Origen y registro sanitario</h2>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="origen">Origen</label>
                        <input type="text" id="origen" name="origen" class="form-control"
                               th:value="${lote?.origen}" placeholder="Proveedor, producción propia…">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="registroSanitario">Registro sanitario</label>
                        <input type="text" id="registroSanitario" name="registroSanitario" class="form-control"
                               th:value="${lote?.numeroRegistroSanitario}" autocomplete="off">
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1" aria-hidden="true"></i>Guardar lote
                </button>
                <a th:href="@{/web/lotes}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
