<div th:fragment="content">
    <div class="topbar"><h4 th:text="${titulo}"></h4><a th:href="@{/web/lotes}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <div class="form-card" style="max-width:600px;">
        <form th:action="@{/web/lotes}" method="post"><input type="hidden" name="id" th:value="${lote?.id}">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Código *</label><input type="text" name="codigo" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Artículo</label><select name="articuloId" class="form-select"><option value="">Seleccionar...</option><option th:each="a : ${articulos}" th:value="${a.id}" th:text="${a.nombre}"></option></select></div>
                <div class="col-md-6"><label class="form-label">Fecha producción *</label><input type="date" name="fechaProd" class="form-control" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required></div>
                <div class="col-md-6"><label class="form-label">Fecha caducidad *</label><input type="date" name="fechaCad" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Cantidad</label><input type="number" step="0.01" name="cantidad" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Origen</label><input type="text" name="origen" class="form-control"></div>
                <div class="col-12"><label class="form-label">Registro Sanitario</label><input type="text" name="registroSanitario" class="form-control"></div>
            </div>
            <div class="mt-4"><button type="submit" class="btn btn-primary">Guardar</button><a th:href="@{/web/lotes}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
        </form>
    </div>
</div>
