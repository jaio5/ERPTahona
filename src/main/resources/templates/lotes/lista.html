<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Lotes</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/lotes/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nuevo lote
            </a>
        </div>
    </div>

    <form class="filter-bar mb-3" method="get" th:action="@{/web/lotes}">
        <div class="filter-bar-search">
            <label for="lotes-search" class="visually-hidden">Buscar lotes</label>
            <i class="bi bi-search"></i>
            <input id="lotes-search" type="search" name="q" class="form-control form-control-sm"
                   placeholder="Código de lote..." th:value="${q}" autocomplete="off">
        </div>
        <div class="filter-bar-filters">
            <select name="estado" class="form-select form-select-sm" style="width:150px;">
                <option value="">Todos los estados</option>
                <option value="ACTIVO"    th:selected="${estado == 'ACTIVO'}">Activo</option>
                <option value="CONSUMIDO" th:selected="${estado == 'CONSUMIDO'}">Consumido</option>
                <option value="CADUCADO"  th:selected="${estado == 'CADUCADO'}">Caducado</option>
            </select>
        </div>
        <div class="filter-bar-actions">
            <button class="btn btn-outline-primary btn-sm">
                <i class="bi bi-funnel me-1"></i>Filtrar
            </button>
            <a th:href="@{/web/lotes}" class="btn btn-ghost btn-sm">Limpiar</a>
        </div>
    </form>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Artículo</th>
                        <th>Producción</th>
                        <th>Caducidad</th>
                        <th class="text-end">Cantidad</th>
                        <th>Estado</th>
                        <th style="width:80px;"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(lotes)}">
                        <td colspan="7" class="empty-state">
                            <i class="bi bi-arrow-left-right"></i>
                            <div>No hay lotes registrados</div>
                            <small th:if="${q != null and !q.isEmpty()}">Prueba con otros términos de búsqueda</small>
                        </td>
                    </tr>
                    <tr th:each="l : ${lotes}">
                        <td class="fw-medium" th:text="${l.codigo}"></td>
                        <td th:text="${l.articulo?.nombre ?: '—'}"></td>
                        <td class="text-muted small"
                            th:text="${l.fechaProduccion != null ? #temporals.format(l.fechaProduccion, 'dd/MM/yyyy') : '—'}"></td>
                        <td class="small"
                            th:classappend="${l.fechaCaducidad != null and l.fechaCaducidad.isBefore(#temporals.createToday())} ? 'text-danger fw-semibold' : 'text-muted'"
                            th:text="${l.fechaCaducidad != null ? #temporals.format(l.fechaCaducidad, 'dd/MM/yyyy') : '—'}"></td>
                        <td class="text-end" th:text="${l.cantidadActual != null ? l.cantidadActual : '—'}"></td>
                        <td>
                            <span class="badge-status" th:attr="data-status=${l.estado?.toLowerCase()}"
                                  th:text="${l.estado ?: '—'}"></span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/web/lotes/{id}(id=${l.id})}"
                               class="btn btn-ghost btn-sm" title="Ver detalle">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/web/lotes/{id}/editar(id=${l.id})}"
                               class="btn btn-ghost btn-sm" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/lotes')}"></div>
</div>
