<div th:fragment="content">
    <div class="topbar"><h4 th:text="${titulo}"></h4><a th:href="@{/web/lotes/nuevo}" class="btn btn-success btn-sm">+ Nuevo</a></div>
    <div th:if="${exito}" class="alert alert-success py-2" th:text="${exito}"></div>
    <div class="table-card"><table class="table table-hover">
        <thead><tr><th>Código</th><th>Prod.</th><th>Caducidad</th><th class="text-end">Cant.</th><th>Estado</th></tr></thead>
        <tbody><tr th:each="l : ${lotes}"><td th:text="${l.codigo}"></td><td th:text="${l.fechaProduccion}"></td><td th:text="${l.fechaCaducidad}"></td><td class="text-end" th:text="${l.cantidadActual}"></td><td><span class="badge-status" th:classappend="${l.estado == 'ACTIVO' ? 'bg-emitted' : 'bg-cancelled'}" th:text="${l.estado}"></span></td></tr></tbody>
    </table></div>
</div>
