<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/400.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/500.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/600.css}" rel="stylesheet">
    <!-- Bootstrap como en error.html: el botón de cerrar sesión es un btn-ghost -->
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <!-- Tema claro/oscuro guardado en el panel (o el del sistema) -->
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/tema.js}"></script>
    <title>Cambiar contraseña | ERP Tahona</title>
</head>
<body>
    <main class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <i class="bi bi-shield-lock login-brand-icon" aria-hidden="true"></i>
                <h1>Cambiar contraseña</h1>
                <p class="text-muted text-center small mt-3 mb-0" th:if="${obligatorio}">Por seguridad, debes cambiar tu contraseña antes de continuar.</p>
                <p class="text-muted text-center small mt-3 mb-0" th:unless="${obligatorio}">Introduce tu contraseña actual y la nueva.</p>
            </div>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                <span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/web/cambiar-password}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label" for="oldPassword">Contraseña actual</label>
                    <input type="password" id="oldPassword" name="oldPassword" class="form-control" required autofocus autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">Nueva contraseña</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" required autocomplete="new-password"
                           aria-describedby="newPasswordHelp">
                    <div id="newPasswordHelp" class="form-text">Mínimo 8 caracteres, con al menos una mayúscula y un dígito.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
            </form>

            <form th:action="@{/web/logout}" method="post" class="login-foot">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-ghost w-100">
                    <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Cerrar sesión
                </button>
            </form>
        </div>
    </main>
</body>
</html>
