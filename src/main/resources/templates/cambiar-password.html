<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <title>Cambiar contraseña | ERP Tahona</title>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h3>Cambiar contraseña</h3>
            <p th:if="${obligatorio}">Por seguridad, debes cambiar tu contraseña antes de continuar.</p>
            <p th:unless="${obligatorio}">Introduce tu contraseña actual y la nueva.</p>

            <div th:if="${error}" class="alert alert-danger">
                <strong>⚠ </strong><span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/web/cambiar-password}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label" for="oldPassword">Contraseña actual</label>
                    <input type="password" id="oldPassword" name="oldPassword" class="form-control" required autofocus autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">Nueva contraseña</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" required autocomplete="new-password">
                    <small class="text-muted">Mínimo 8 caracteres, con al menos una mayúscula y un dígito.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
            </form>

            <form th:action="@{/web/logout}" method="post" class="mt-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-link w-100">Cerrar sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
