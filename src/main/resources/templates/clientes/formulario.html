<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Cliente</h1>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/clientes}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card form-card-narrow">
        <form th:action="@{/web/clientes}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${cliente?.id}">

            <section class="form-section">
            <h2 class="form-section-title"><i class="bi bi-info-circle" aria-hidden="true"></i>Datos generales</h2>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="codigo">Código *</label>
                    <input type="text" id="codigo" name="codigo" class="form-control"
                           th:value="${cliente?.codigo}" required>
                    <div class="invalid-feedback">El código es obligatorio.</div>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="nombre">Razón social *</label>
                    <input type="text" id="nombre" name="nombre" class="form-control"
                           th:value="${cliente?.nombre}" required>
                    <div class="invalid-feedback">La razón social es obligatoria.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="cif">CIF / NIF</label>
                    <input type="text" id="cif" name="cif" class="form-control"
                           th:value="${cliente?.cif}" placeholder="B12345678">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" autocomplete="tel" name="telefono" class="form-control"
                           th:value="${cliente?.telefono}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form-control"
                           th:value="${cliente?.email}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="representante">Representante / comercial</label>
                    <input type="text" id="representante" name="representante" class="form-control"
                           th:value="${cliente?.representante}" placeholder="Casilla «Repres.» de la factura">
                </div>
            </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-geo-alt" aria-hidden="true"></i>Dirección</h2>
                <p class="form-section-hint">Se imprime en facturas y albaranes.</p>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label" for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion" class="form-control"
                               th:value="${cliente?.direccion}" placeholder="Calle, número, piso…">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="poblacion">Población</label>
                        <input type="text" id="poblacion" name="poblacion" class="form-control"
                               th:value="${cliente?.poblacion}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="codigoPostal">Código postal</label>
                        <input type="text" inputmode="numeric" id="codigoPostal" name="codigoPostal" class="form-control"
                               th:value="${cliente?.codigoPostal}" placeholder="03001">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-bank" aria-hidden="true"></i>Domiciliación SEPA</h2>
                <p class="form-section-hint">Con IBAN y mandato configurados, las facturas del cliente pueden incluirse en remesas SEPA.</p>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="iban">IBAN</label>
                        <input type="text" autocapitalize="characters" spellcheck="false" id="iban" name="iban" class="form-control"
                               th:value="${cliente?.iban}" placeholder="ES00 0000 0000 0000 0000 0000" maxlength="34">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="mandatoSepaReferencia">Ref. mandato</label>
                        <input type="text" id="mandatoSepaReferencia" name="mandatoSepaReferencia" class="form-control"
                               th:value="${cliente?.mandatoSepaReferencia}" maxlength="35">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="mandatoSepaFecha">Fecha firma mandato</label>
                        <input type="date" id="mandatoSepaFecha" name="mandatoSepaFecha" class="form-control"
                               th:value="${cliente?.mandatoSepaFecha}">
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1" aria-hidden="true"></i>Guardar cliente
                </button>
                <a th:href="@{/web/clientes}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
