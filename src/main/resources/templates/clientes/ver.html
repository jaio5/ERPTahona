<div th:fragment="content">
    <div class="topbar">
        <h4 th:text="${cliente.nombre}"></h4>
        <div class="d-flex gap-2">
            <a th:href="@{/web/clientes/{id}/export.json(id=${cliente.id})}" class="btn btn-outline-primary btn-sm">Exportar RGPD</a>
            <a th:href="@{/web/clientes}" class="btn btn-outline-secondary btn-sm">Volver</a>
        </div>
    </div>
    <div class="form-card" style="max-width:600px;">
        <div class="row g-3">
            <div class="col-md-4"><small class="text-muted">Codigo</small><h6 th:text="${cliente.codigo}"></h6></div>
            <div class="col-md-4"><small class="text-muted">CIF/NIF</small><h6 th:text="${cliente.cif} ?: '-'"></h6></div>
            <div class="col-md-4"><small class="text-muted">Telefono</small><h6 th:text="${cliente.telefono} ?: '-'"></h6></div>
            <div class="col-md-6"><small class="text-muted">Email</small><h6 th:text="${cliente.email} ?: '-'"></h6></div>
            <div class="col-md-6"><small class="text-muted">Direccion</small><h6 th:text="${cliente.direccion} ?: '-'"></h6></div>
            <div class="col-md-4"><small class="text-muted">Poblacion</small><h6 th:text="${cliente.poblacion} ?: '-'"></h6></div>
            <div class="col-md-4"><small class="text-muted">Codigo Postal</small><h6 th:text="${cliente.codigoPostal} ?: '-'"></h6></div>
            <div class="col-md-4"><small class="text-muted">Activo</small><h6 th:text="${cliente.activo ? 'Si' : 'No'}"></h6></div>
        </div>
    </div>
</div>
