<div th:fragment="content">
    <div class="topbar">
        <h4 th:text="${titulo}">Clientes</h4>
        <div class="d-flex gap-2">
            <a th:href="@{/web/clientes/export.csv(q=${q})}" class="btn btn-outline-secondary btn-sm">Exportar CSV</a>
            <a th:href="@{/web/clientes/nuevo}" class="btn btn-success btn-sm">+ Nuevo</a>
        </div>
    </div>
    <div th:if="${exito}" class="alert alert-success py-2" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
    <div class="row g-2 mb-3">
        <div class="col-md-5">
            <form class="d-flex gap-2">
                <input type="search" name="q" class="form-control form-control-sm" placeholder="Buscar..." th:value="${q}">
                <button class="btn btn-outline-primary btn-sm">Filtrar</button>
            </form>
        </div>
    </div>
    <div class="table-card">
        <table class="table table-hover">
            <thead><tr><th>Codigo</th><th>Nombre</th><th>CIF/NIF</th><th>Telefono</th><th>Email</th><th style="width:190px;"></th></tr></thead>
            <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.codigo}"></td><td th:text="${c.nombre}"></td>
                    <td th:text="${c.cif}"></td><td th:text="${c.telefono}"></td>
                    <td th:text="${c.email}"></td>
                    <td class="text-end">
                        <a th:href="@{/web/clientes/{id}/export.json(id=${c.id})}" class="btn btn-outline-primary btn-sm">RGPD</a>
                        <a th:href="@{/web/clientes/{id}(id=${c.id})}" class="btn btn-outline-secondary btn-sm">Ver</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
