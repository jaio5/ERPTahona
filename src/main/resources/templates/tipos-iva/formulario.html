<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Tipo de IVA</h1>
            <p>Aparece en el desplegable de IVA de facturas y albaranes</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/tipos-iva}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card form-card-narrow">
        <form th:action="@{/web/tipos-iva}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${tipo?.id}">

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-percent" aria-hidden="true"></i>Tipo impositivo</h2>
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label" for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" class="form-control"
                               th:value="${tipo?.nombre}" placeholder="General 21 %" required>
                        <div class="invalid-feedback">El nombre es obligatorio.</div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="orden">Orden</label>
                        <input type="number" id="orden" name="orden" class="form-control text-end"
                               th:value="${tipo?.orden}" min="0" step="1" aria-describedby="ordenAyuda">
                        <div class="form-text" id="ordenAyuda">Posición en el desplegable.</div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label" for="porcentaje">Porcentaje *</label>
                        <div class="input-group has-validation">
                            <input type="number" id="porcentaje" name="porcentaje" class="form-control text-end"
                                   th:value="${tipo?.porcentaje}" min="0" max="100" step="0.01" required>
                            <span class="input-group-text">%</span>
                            <div class="invalid-feedback">Introduce un porcentaje entre 0 y 100.</div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label" for="recargoEquivalencia">Recargo de equivalencia</label>
                        <div class="input-group">
                            <input type="number" id="recargoEquivalencia" name="recargoEquivalencia" class="form-control text-end"
                                   th:value="${tipo?.recargoEquivalencia}" min="0" max="100" step="0.01"
                                   placeholder="Opcional">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-toggles" aria-hidden="true"></i>Uso</h2>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="activo" name="activo" value="true"
                                   th:checked="${tipo == null or tipo.activo == null or tipo.activo}">
                            <label class="form-check-label" for="activo">Activo (aparece en los desplegables)</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="esDefecto" name="esDefecto" value="true"
                                   th:checked="${tipo != null and tipo.esDefecto}">
                            <label class="form-check-label" for="esDefecto">Propuesto por defecto en líneas nuevas</label>
                        </div>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1" aria-hidden="true"></i>Guardar tipo de IVA
                </button>
                <a th:href="@{/web/tipos-iva}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
