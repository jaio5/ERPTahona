<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Tipo de IVA</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/tipos-iva}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card" style="max-width:640px;">
        <form th:action="@{/web/tipos-iva}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${tipo?.id}">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" for="nombre">Nombre *</label>
                    <input type="text" id="nombre" name="nombre" class="form-control"
                           th:value="${tipo?.nombre}" placeholder="General 21%" required>
                    <div class="invalid-feedback">El nombre es obligatorio.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="orden">Orden</label>
                    <input type="number" id="orden" name="orden" class="form-control"
                           th:value="${tipo?.orden}" min="0" step="1">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="porcentaje">Porcentaje (%) *</label>
                    <input type="number" id="porcentaje" name="porcentaje" class="form-control"
                           th:value="${tipo?.porcentaje}" min="0" max="100" step="0.01" required>
                    <div class="invalid-feedback">Introduce un porcentaje entre 0 y 100.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="recargoEquivalencia">Recargo de equivalencia (%)</label>
                    <input type="number" id="recargoEquivalencia" name="recargoEquivalencia" class="form-control"
                           th:value="${tipo?.recargoEquivalencia}" min="0" max="100" step="0.01"
                           placeholder="Opcional">
                </div>
                <div class="col-md-6">
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" id="activo" name="activo" value="true"
                               th:checked="${tipo == null or tipo.activo == null or tipo.activo}">
                        <label class="form-check-label" for="activo">Activo (aparece en los desplegables)</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" id="esDefecto" name="esDefecto" value="true"
                               th:checked="${tipo != null and tipo.esDefecto}">
                        <label class="form-check-label" for="esDefecto">Propuesto por defecto en líneas nuevas</label>
                    </div>
                </div>
            </div>
            <div class="form-actions mt-4">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1"></i>Guardar
                </button>
                <a th:href="@{/web/tipos-iva}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
