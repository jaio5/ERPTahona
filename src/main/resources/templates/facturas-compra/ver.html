<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Factura de compra</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/facturas-compra}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="form-card" style="max-width:700px;">
        <div class="doc-fields">
            <table class="doc-table">
            <tr>
                <th scope="row">Número</th>
                <td th:text="${factura.numero}">—</td>
            </tr>
            <tr>
                <th scope="row">Proveedor</th>
                <td th:text="${factura.proveedor?.nombre} ?: '—'">—</td>
            </tr>
            <tr>
                <th scope="row">Fecha</th>
                <td th:text="${factura.fecha}">—</td>
            </tr>
            <tr>
                <th scope="row">Vencimiento</th>
                <td th:text="${factura.fechaVencimiento} ?: '—'">—</td>
            </tr>
            <tr>
                <th scope="row">Base imponible</th>
                <td th:text="${factura.baseImponible != null ? #numbers.formatDecimal(factura.baseImponible, 1, 2) + ' €' : '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">IVA (%)</th>
                <td th:text="${factura.tipoIva != null ? factura.tipoIva + '%' : '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Importe IVA</th>
                <td th:text="${factura.importeIva != null ? #numbers.formatDecimal(factura.importeIva, 1, 2) + ' €' : '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Total</th>
                <td class="fw-bold" style="font-size:1.25rem;color:var(--brand-color);"
                     th:text="${factura.total != null ? #numbers.formatDecimal(factura.total, 1, 2) + ' €' : '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Pagada</th>
                <td th:text="${factura.pagada ? 'Sí' : 'No'}">—</td>
            </tr>
            <tr th:if="${factura.observaciones != null and !factura.observaciones.isBlank()}">
                <th scope="row">Observaciones</th>
                <td class="text-muted" th:text="${factura.observaciones}">—</td>
            </tr>
            <tr>
                <th scope="row">Estado</th>
                <td>
                    <span class="badge-status" th:attr="data-status=${factura.estado?.toLowerCase()}"
                          th:text="${factura.estado}">—</span>
                </td>
            </tr>
            </table>
        </div>
    </div>
</div>
