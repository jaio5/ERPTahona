<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Factura de compra</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/facturas-compra}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="form-card" style="max-width:700px;">
        <div class="row g-3">
            <div class="col-md-6">
                <span class="doc-field-label">Número</span>
                <div class="doc-field-value" th:text="${factura.numero}">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Proveedor</span>
                <div class="doc-field-value" th:text="${factura.proveedor?.nombre} ?: '—'">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Fecha</span>
                <div class="doc-field-value" th:text="${factura.fecha}">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Vencimiento</span>
                <div class="doc-field-value" th:text="${factura.fechaVencimiento} ?: '—'">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Estado</span>
                <div class="doc-field-value">
                    <span class="badge-status" th:attr="data-status=${factura.estado?.toLowerCase()}"
                          th:text="${factura.estado}">—</span>
                </div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Base imponible</span>
                <div class="doc-field-value" th:text="${factura.baseImponible != null ? #numbers.formatDecimal(factura.baseImponible, 1, 2) + ' €' : '—'}">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">IVA (%)</span>
                <div class="doc-field-value" th:text="${factura.tipoIva != null ? factura.tipoIva + '%' : '—'}">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Importe IVA</span>
                <div class="doc-field-value" th:text="${factura.importeIva != null ? #numbers.formatDecimal(factura.importeIva, 1, 2) + ' €' : '—'}">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Total</span>
                <div class="doc-field-value fw-bold" style="font-size:1.25rem;color:var(--brand-color);"
                     th:text="${factura.total != null ? #numbers.formatDecimal(factura.total, 1, 2) + ' €' : '—'}">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Pagada</span>
                <div class="doc-field-value" th:text="${factura.pagada ? 'Sí' : 'No'}">—</div>
            </div>
            <div class="col-12" th:if="${factura.observaciones != null and !factura.observaciones.isBlank()}">
                <span class="doc-field-label">Observaciones</span>
                <div class="doc-field-value text-muted" th:text="${factura.observaciones}">—</div>
            </div>
        </div>
    </div>
</div>
