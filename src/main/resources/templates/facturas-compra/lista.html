<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Facturas de compra</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/facturas-compra/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nueva factura
            </a>
        </div>
    </div>

    <form class="filter-bar mb-3" method="get" th:action="@{/web/facturas-compra}">
        <div class="filter-bar-search">
            <label for="facturas-search" class="visually-hidden">Buscar facturas</label>
            <i class="bi bi-search"></i>
            <input id="facturas-search" type="search" name="q" class="form-control form-control-sm"
                   placeholder="Número o proveedor..." th:value="${q}" autocomplete="off">
        </div>
        <div class="filter-bar-filters">
            <select name="estado" class="form-select form-select-sm" style="width:150px;">
                <option value="">Todos los estados</option>
                <option value="BORRADOR"    th:selected="${estado == 'BORRADOR'}">Borrador</option>
                <option value="PENDIENTE"   th:selected="${estado == 'PENDIENTE'}">Pendiente</option>
                <option value="PAGADA"      th:selected="${estado == 'PAGADA'}">Pagada</option>
                <option value="ANULADA"     th:selected="${estado == 'ANULADA'}">Anulada</option>
            </select>
        </div>
        <div class="filter-bar-actions">
            <button class="btn btn-outline-primary btn-sm">
                <i class="bi bi-funnel me-1"></i>Filtrar
            </button>
            <a th:href="@{/web/facturas-compra}" class="btn btn-ghost btn-sm">Limpiar</a>
            <span class="text-muted small" th:if="${page != null}">
                <span th:text="${page.totalElements}">0</span> facturas
            </span>
        </div>
    </form>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Número</th>
                        <th>Fecha</th>
                        <th>Proveedor</th>
                        <th class="text-end">Total</th>
                        <th>Estado</th>
                        <th style="width:80px;"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(facturas)}">
                        <td colspan="6" class="empty-state">
                            <i class="bi bi-receipt"></i>
                            <div>No hay facturas de compra registradas</div>
                        </td>
                    </tr>
                    <tr th:each="f : ${facturas}">
                        <td class="fw-medium" th:text="${f.numero ?: '—'}"></td>
                        <td class="text-muted small"
                            th:text="${f.fecha != null ? #temporals.format(f.fecha, 'dd/MM/yyyy') : '—'}"></td>
                        <td th:text="${f.proveedor?.nombre ?: '—'}"></td>
                        <td class="text-end fw-semibold"
                            th:text="${f.total != null ? #numbers.formatDecimal(f.total, 1, 'COMMA', 2, 'POINT') + ' €' : '—'}"></td>
                        <td>
                            <span class="badge-status" th:attr="data-status=${f.estado?.toLowerCase()}"
                                  th:text="${f.estado ?: '—'}"></span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/web/facturas-compra/{id}(id=${f.id})}"
                               class="btn btn-ghost btn-sm" title="Ver">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/facturas-compra')}"></div>
</div>
