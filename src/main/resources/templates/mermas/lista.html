<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Mermas</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/mermas/nueva}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nueva merma
            </a>
        </div>
    </div>
    <div th:if="${exito}" class="alert alert-success py-2" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
    <form class="filter-bar mb-3" method="get">
        <select name="tipo" class="form-select form-select-sm" style="max-width:180px;" data-autosubmit aria-label="Filtrar por tipo">
            <option value="">Todos los tipos</option>
            <option value="PRODUCCION" th:selected="${tipo == 'PRODUCCION'}">Producción</option>
            <option value="REPARTO" th:selected="${tipo == 'REPARTO'}">Reparto</option>
            <option value="STOCK" th:selected="${tipo == 'STOCK'}">Stock</option>
            <option value="CADUCIDAD" th:selected="${tipo == 'CADUCIDAD'}">Caducidad</option>
        </select>
    </form>
    <div class="table-card">
        <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Artículo</th>
                    <th>Cantidad</th>
                    <th>Tipo</th>
                    <th>Motivo</th>
                    <th>Responsable</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(mermas)}">
                    <td colspan="7" class="empty-state"><i class="bi bi-trash3"></i><div>No hay mermas registradas</div></td>
                </tr>
                <tr th:each="m : ${mermas}">
                    <td th:text="${m.fecha}"></td>
                    <td th:text="${m.articulo?.nombre}"></td>
                    <td th:text="${m.cantidad}"></td>
                    <td><span class="badge-status" th:attr="data-status=${m.tipo?.toLowerCase()}" th:text="${m.tipo} ?: '-'"></span></td>
                    <td th:text="${m.motivo} ?: '-'"></td>
                    <td th:text="${m.responsable} ?: '-'"></td>
                    <td class="text-end"><a th:href="@{/web/mermas/{id}(id=${m.id})}" class="btn btn-ghost btn-sm" title="Ver detalle"><i class="bi bi-eye"></i></a></td>
                </tr>
            </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/mermas')}"></div>
</div>
