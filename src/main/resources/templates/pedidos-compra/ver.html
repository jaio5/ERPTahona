<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Pedido de compra</h4>
        </div>
        <div class="page-header-actions">
            <form th:if="${pedido.estado == 'BORRADOR'}"
                  th:action="@{/web/pedidos-compra/{id}/estado(id=${pedido.id})}" method="post" class="d-inline">
                <input type="hidden" name="estado" value="ENVIADO">
                <button class="btn btn-primary btn-sm" data-no-double-click>
                    <i class="bi bi-send me-1"></i>Enviar pedido
                </button>
            </form>
            <form th:if="${pedido.estado == 'ENVIADO'}"
                  th:action="@{/web/pedidos-compra/{id}/estado(id=${pedido.id})}" method="post" class="d-inline">
                <input type="hidden" name="estado" value="RECIBIDO">
                <button class="btn btn-success btn-sm" data-no-double-click>
                    <i class="bi bi-box-seam me-1"></i>Marcar recibido
                </button>
            </form>
            <a th:href="@{/web/pedidos-compra}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="form-card" style="max-width:640px;">
        <div class="row g-3">
            <div class="col-md-4">
                <span class="doc-field-label">Número</span>
                <div class="doc-field-value" th:text="${pedido.numero} ?: '—'">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Fecha</span>
                <div class="doc-field-value" th:text="${pedido.fecha}">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Estado</span>
                <div class="doc-field-value">
                    <span class="badge-status" th:attr="data-status=${pedido.estado?.toLowerCase()}"
                          th:text="${pedido.estado}">—</span>
                </div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Proveedor</span>
                <div class="doc-field-value" th:text="${pedido.proveedor?.nombre} ?: '—'">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Total</span>
                <div class="doc-field-value" th:text="${pedido.total != null ? #numbers.formatDecimal(pedido.total,1,2) + ' €' : '—'}">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Entrega esperada</span>
                <div class="doc-field-value" th:text="${pedido.fechaEsperadaEntrega} ?: '—'">—</div>
            </div>
            <div class="col-12" th:if="${pedido.observaciones}">
                <span class="doc-field-label">Observaciones</span>
                <div class="doc-field-value text-muted" th:text="${pedido.observaciones}">—</div>
            </div>
        </div>
        <div th:if="${!#lists.isEmpty(pedido.lineas)}" class="mt-3">
            <div class="form-section-title mb-2">
                <i class="bi bi-list-ul"></i> Líneas del pedido
            </div>
            <div class="table-responsive">
                <table class="table table-sm mb-0">
                    <thead><tr><th>Artículo</th><th>Cantidad</th><th>Precio</th></tr></thead>
                    <tbody>
                        <tr th:each="l : ${pedido.lineas}">
                            <td th:text="${l.articulo?.nombre} ?: '—'"></td>
                            <td th:text="${l.cantidad}"></td>
                            <td th:text="${l.precio != null ? #numbers.formatDecimal(l.precio,1,2) + ' €' : '—'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
