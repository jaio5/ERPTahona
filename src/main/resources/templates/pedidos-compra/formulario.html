<section>
    <div class="topbar"><h4 th:text="${titulo}">Nuevo pedido compra</h4><a th:href="@{/web/pedidos-compra}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <form th:action="@{/web/pedidos-compra}" method="post" class="card p-3">
        <label class="form-label">Proveedor</label>
        <select name="proveedorId" class="form-select" required>
            <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.nombre}"></option>
        </select>
        <label class="form-label mt-3">Observaciones</label>
        <textarea name="observaciones" class="form-control"></textarea>
        <div class="mt-4"><button class="btn btn-primary" type="submit">Guardar</button><a th:href="@{/web/pedidos-compra}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
    </form>
</section>
