<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Hoja de ruta</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/hojas-ruta}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="form-card">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="doc-header-icon">
                        <i class="bi bi-map"></i>
                    </div>
                    <div>
                        <div class="fw-bold fs-5" th:text="${hoja.fecha}">Fecha</div>
                        <div class="text-muted small" th:text="${hoja.conductor ?: 'Sin conductor'}"></div>
                    </div>
                </div>

                <div class="doc-fields">
                    <table class="doc-table">
                    <tr>
                        <th scope="row">Fecha</th>
                        <td th:text="${hoja.fecha}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Conductor</th>
                        <td th:text="${hoja.conductor ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Vehículo</th>
                        <td th:text="${hoja.vehiculo?.matricula ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Estado</th>
                        <td>
                            <span class="badge-status"
                                  th:attr="data-status=${hoja.estado?.toLowerCase()}"
                                  th:text="${hoja.estado ?: '—'}">—</span>
                        </td>
                    </tr>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="form-card">
                <div class="form-section-title mb-3">
                    <i class="bi bi-truck"></i> Entregas
                </div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Cliente</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${entregas}">
                                <td th:text="${e.orden}"></td>
                                <td th:text="${e.cliente?.nombre}"></td>
                                <td>
                                    <span class="badge-status"
                                          th:attr="data-status=${e.entregado ? 'entregado' : 'pendiente'}"
                                          th:text="${e.entregado ? 'ENTREGADO' : 'PENDIENTE'}"></span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(entregas)}">
                                <td colspan="3" class="empty-state">
                                    <i class="bi bi-truck"></i>
                                    <p>Sin entregas programadas</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
