<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Almacén</h1>
            <p>Cámara, obrador, tienda o cualquier lugar donde se guarda stock</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/almacenes}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card form-card-narrow">
        <form th:action="@{/web/almacenes}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${almacen?.id}">

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-building" aria-hidden="true"></i>Identificación</h2>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="codigo">Código *</label>
                        <input type="text" id="codigo" name="codigo" class="form-control"
                               th:value="${almacen?.codigo}" required autocomplete="off">
                        <div class="invalid-feedback">El código es obligatorio.</div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" class="form-control"
                               th:value="${almacen?.nombre}" required>
                        <div class="invalid-feedback">El nombre es obligatorio.</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" class="form-control" rows="2"
                                  th:text="${almacen?.descripcion}"></textarea>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-geo-alt" aria-hidden="true"></i>Ubicación y capacidad</h2>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="localidad">Localidad</label>
                        <input type="text" id="localidad" name="localidad" class="form-control"
                               th:value="${almacen?.localidad}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="responsable">Responsable</label>
                        <input type="text" id="responsable" name="responsable" class="form-control"
                               th:value="${almacen?.responsable}">
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="capacidad">Capacidad</label>
                        <!-- Sin separador de miles: el campo se enlaza directamente a BigDecimal -->
                        <input type="text" inputmode="decimal" id="capacidad" name="capacidad" class="form-control text-end"
                               th:value="${almacen?.capacidad != null ? #numbers.formatDecimal(almacen.capacidad, 1, 'NONE', 2, 'POINT') : ''}">
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1" aria-hidden="true"></i>Guardar almacén
                </button>
                <a th:href="@{/web/almacenes}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
