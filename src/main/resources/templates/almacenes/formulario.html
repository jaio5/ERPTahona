<div th:fragment="content">
    <div class="topbar"><h4 th:text="${titulo}"></h4><a th:href="@{/web/almacenes}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <div class="form-card" style="max-width:600px;">
        <form th:action="@{/web/almacenes}" method="post"><input type="hidden" name="id" th:value="${almacen?.id}">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Código *</label><input type="text" name="codigo" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Nombre *</label><input type="text" name="nombre" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Capacidad</label><input type="number" step="0.01" name="capacidad" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Localidad</label><input type="text" name="localidad" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Responsable</label><input type="text" name="responsable" class="form-control"></div>
                <div class="col-12"><label class="form-label">Descripción</label><textarea name="descripcion" class="form-control" rows="2"></textarea></div>
            </div>
            <div class="mt-4"><button type="submit" class="btn btn-primary">Guardar</button><a th:href="@{/web/almacenes}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
        </form>
    </div>
</div>
