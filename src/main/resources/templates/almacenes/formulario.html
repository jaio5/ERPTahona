<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Almacén</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/almacenes}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card" style="max-width:700px;">
        <form th:action="@{/web/almacenes}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${almacen?.id}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="codigo">Código <span class="text-danger">*</span></label>
                    <input type="text" id="codigo" name="codigo" class="form-control"
                           th:value="${almacen?.codigo}" required>
                    <div class="invalid-feedback">El código es obligatorio.</div>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="nombre">Nombre <span class="text-danger">*</span></label>
                    <input type="text" id="nombre" name="nombre" class="form-control"
                           th:value="${almacen?.nombre}" required>
                    <div class="invalid-feedback">El nombre es obligatorio.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="capacidad">Capacidad</label>
                    <input type="text" inputmode="decimal" id="capacidad" name="capacidad" class="form-control"
                           th:value="${almacen?.capacidad != null ? #numbers.formatDecimal(almacen.capacidad, 1, 'COMMA', 2, 'POINT') : ''}">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="localidad">Localidad</label>
                    <input type="text" id="localidad" name="localidad" class="form-control"
                           th:value="${almacen?.localidad}">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="responsable">Responsable</label>
                    <input type="text" id="responsable" name="responsable" class="form-control"
                           th:value="${almacen?.responsable}">
                </div>
                <div class="col-12">
                    <label class="form-label" for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" class="form-control" rows="2"
                              th:text="${almacen?.descripcion}"></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1"></i>Guardar almacén
                </button>
                <a th:href="@{/web/almacenes}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
