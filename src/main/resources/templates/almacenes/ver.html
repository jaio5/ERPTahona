<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Almacén</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/almacenes/{id}/editar(id=${almacen.id})}" class="btn btn-outline-primary btn-sm">Editar</a>
            <a th:href="@{/web/almacenes}" class="btn btn-ghost btn-sm">Volver</a>
        </div>
    </div>
    <div class="form-card">
        <div class="doc-fields">
            <table class="doc-table">
            <tr>
                <th scope="row">Código</th>
                <td th:text="${almacen.codigo}">—</td>
            </tr>
            <tr>
                <th scope="row">Nombre</th>
                <td th:text="${almacen.nombre ?: '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Capacidad</th>
                <td th:text="${almacen.capacidad ?: '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Disponible</th>
                <td th:text="${almacen.disponible ?: '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Localidad</th>
                <td th:text="${almacen.localidad ?: '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Responsable</th>
                <td th:text="${almacen.responsable ?: '—'}">—</td>
            </tr>
            <tr th:if="${almacen.descripcion}">
                <th scope="row">Descripción</th>
                <td class="text-muted" th:text="${almacen.descripcion}">—</td>
            </tr>
            <tr>
                <th scope="row">Estado</th>
                <td>
                    <span class="badge-status" th:attr="data-status=${almacen.activo ? 'activo' : 'anulada'}"
                          th:text="${almacen.activo ? 'Activo' : 'Inactivo'}">—</span>
                </td>
            </tr>
            </table>
        </div>
    </div>
</div>
