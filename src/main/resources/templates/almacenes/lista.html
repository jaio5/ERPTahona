<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Almacenes</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/almacenes/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nuevo almacén
            </a>
        </div>
    </div>

    <form class="filter-bar mb-3" method="get" th:action="@{/web/almacenes}">
        <div class="filter-bar-search">
            <label for="almacenes-search" class="visually-hidden">Buscar almacenes</label>
            <i class="bi bi-search"></i>
            <input id="almacenes-search" type="search" name="q" class="form-control form-control-sm"
                   placeholder="Nombre o código..." th:value="${q}" autocomplete="off">
        </div>
        <div class="filter-bar-actions">
            <button class="btn btn-outline-primary btn-sm">
                <i class="bi bi-funnel me-1"></i>Filtrar
            </button>
            <a th:href="@{/web/almacenes}" class="btn btn-ghost btn-sm">Limpiar</a>
        </div>
    </form>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Localidad</th>
                        <th>Capacidad</th>
                        <th>Responsable</th>
                        <th style="width:80px;"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(almacenes)}">
                        <td colspan="6" class="empty-state">
                            <i class="bi bi-building"></i>
                            <div>No hay almacenes registrados</div>
                            <small th:if="${q != null and !q.isEmpty()}">Prueba con otros términos de búsqueda</small>
                        </td>
                    </tr>
                    <tr th:each="a : ${almacenes}">
                        <td class="fw-medium" th:text="${a.codigo}"></td>
                        <td th:text="${a.nombre}"></td>
                        <td class="text-muted" th:text="${a.localidad ?: '—'}"></td>
                        <td class="text-muted" th:text="${a.capacidad != null ? a.capacidad : '—'}"></td>
                        <td class="text-muted" th:text="${a.responsable ?: '—'}"></td>
                        <td class="text-end">
                            <a th:href="@{/web/almacenes/{id}(id=${a.id})}" class="btn btn-ghost btn-sm" title="Ver"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/web/almacenes/{id}/editar(id=${a.id})}"
                               class="btn btn-ghost btn-sm" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/almacenes')}"></div>
</div>
