<section>
    <div class="topbar"><h4 th:text="${titulo}">Empresa</h4></div>
    <div th:if="${vatValidation}" th:class="${vatValidation.valido ? 'alert alert-success' : 'alert alert-warning'}">
        <div><strong th:text="${vatValidation.mensaje}">Resultado VIES</strong></div>
        <div th:if="${vatValidation.countryCode}">
            <span th:text="${vatValidation.countryCode + vatValidation.vatNumber}">ESB00000000</span>
            <span th:if="${vatValidation.requestDate}" th:text="' - Consulta: ' + ${vatValidation.requestDate}"></span>
        </div>
        <div th:if="${vatValidation.nombre}"><strong>Nombre VIES:</strong> <span th:text="${vatValidation.nombre}"></span></div>
        <div th:if="${vatValidation.direccion}"><strong>Direccion VIES:</strong> <span style="white-space: pre-line" th:text="${vatValidation.direccion}"></span></div>
    </div>
    <form th:action="@{/web/empresa}" method="post" class="card p-3">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Nombre empresa</label><input name="nombreEmpresa" th:value="${empresa?.nombreEmpresa}" class="form-control" required></div>
            <div class="col-md-3"><label class="form-label">VAT / NIF europeo</label><input name="cif" th:value="${empresa?.cif}" class="form-control" placeholder="ESB12345678" required></div>
            <div class="col-md-6"><label class="form-label">Direccion</label><input name="direccion" th:value="${empresa?.direccion}" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Codigo postal</label><input name="codigoPostal" th:value="${empresa?.codigoPostal}" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Ciudad</label><input name="ciudad" th:value="${empresa?.ciudad}" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Provincia</label><input name="provincia" th:value="${empresa?.provincia}" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Telefono</label><input name="telefono" th:value="${empresa?.telefono}" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Email</label><input name="email" th:value="${empresa?.email}" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Web</label><input name="web" th:value="${empresa?.web}" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Registro sanitario</label><input name="registroSanitario" th:value="${empresa?.registroSanitario}" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Registro mercantil</label><input name="registroMercantil" th:value="${empresa?.registroMercantil}" class="form-control"></div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <button class="btn btn-outline-primary" type="submit" formaction="/web/empresa/validar-vat">Validar VAT/NIF UE</button>
        </div>
    </form>
</section>
