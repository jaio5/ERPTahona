<section>
    <div class="topbar"><h4 th:text="${titulo}">Nueva devolucion</h4><a th:href="@{/web/devoluciones}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <form th:action="@{/web/devoluciones}" method="post" class="card p-3">
        <label class="form-label">Cliente</label>
        <select name="clienteId" class="form-select" required><option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option></select>
        <label class="form-label mt-3">Numero</label><input name="numero" class="form-control" required>
        <label class="form-label mt-3">Motivo</label><input name="motivo" class="form-control">
        <label class="form-label mt-3">Observaciones</label><textarea name="observaciones" class="form-control"></textarea>
        <div class="mt-4"><button class="btn btn-primary" type="submit">Guardar</button><a th:href="@{/web/devoluciones}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
    </form>
</section>
