<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Devoluciones</h1>
            <p>Género devuelto por clientes</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/devoluciones/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nueva devolución
            </a>
        </div>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Número</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th class="d-none d-lg-table-cell">Motivo</th>
                        <th>Estado</th>
                        <th><span class="visually-hidden">Acciones</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(devoluciones)}">
                        <td colspan="6" class="empty-state">
                            <i class="bi bi-arrow-return-left" aria-hidden="true"></i>
                            <div class="empty-state-title">No hay devoluciones</div>
                            <small class="empty-state-hint">Registra aquí el género que devuelve un cliente</small>
                            <a th:href="@{/web/devoluciones/nuevo}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nueva devolución
                            </a>
                        </td>
                    </tr>
                    <tr th:each="d : ${devoluciones}">
                        <td><a th:href="@{/web/devoluciones/{id}(id=${d.id})}" th:text="${d.numero} ?: '—'">D-1</a></td>
                        <td class="text-muted" th:text="${d.fecha != null ? #temporals.format(d.fecha, 'dd/MM/yyyy') : '—'}">01/10/2026</td>
                        <td th:text="${d.cliente?.nombre} ?: '—'">Cliente</td>
                        <td class="td-wrap d-none d-lg-table-cell" th:text="${d.motivo} ?: '—'">Motivo</td>
                        <td><span class="badge-status" th:attr="data-status=${d.estado?.toLowerCase()}" th:text="${d.estado}">PENDIENTE</span></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/web/devoluciones/{id}(id=${d.id})}" class="btn btn-ghost btn-sm btn-icon" title="Ver"
                                   th:attr="aria-label='Ver devolución ' + ${d.numero}">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/devoluciones')}"></div>
</div>
