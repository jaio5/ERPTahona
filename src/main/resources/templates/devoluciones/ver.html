<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Devolución</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/devoluciones}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="form-card" style="max-width:640px;">
        <div class="doc-fields">
            <table class="doc-table">
            <tr>
                <th scope="row">Número</th>
                <td th:text="${devolucion.numero} ?: '—'">—</td>
            </tr>
            <tr>
                <th scope="row">Fecha</th>
                <td th:text="${devolucion.fecha}">—</td>
            </tr>
            <tr>
                <th scope="row">Cliente</th>
                <td th:text="${devolucion.cliente?.nombre} ?: '—'">—</td>
            </tr>
            <tr>
                <th scope="row">Importe total</th>
                <td th:text="${devolucion.importeTotal != null ? #numbers.formatDecimal(devolucion.importeTotal,1,2) + ' €' : '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Albarán</th>
                <td th:text="${devolucion.albaran?.numero} ?: '—'">—</td>
            </tr>
            <tr>
                <th scope="row">Factura</th>
                <td th:text="${devolucion.factura?.numero} ?: '—'">—</td>
            </tr>
            <tr th:if="${devolucion.motivo}">
                <th scope="row">Motivo</th>
                <td class="text-muted" th:text="${devolucion.motivo}">—</td>
            </tr>
            <tr th:if="${devolucion.observaciones}">
                <th scope="row">Observaciones</th>
                <td class="text-muted" th:text="${devolucion.observaciones}">—</td>
            </tr>
            <tr>
                <th scope="row">Estado</th>
                <td>
                    <span class="badge-status" th:attr="data-status=${devolucion.estado?.toLowerCase()}"
                          th:text="${devolucion.estado}">—</span>
                </td>
            </tr>
            </table>
        </div>
    </div>
</div>
