<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Devolución</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/devoluciones}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="form-card" style="max-width:640px;">
        <div class="row g-3">
            <div class="col-md-4">
                <span class="doc-field-label">Número</span>
                <div class="doc-field-value" th:text="${devolucion.numero} ?: '—'">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Fecha</span>
                <div class="doc-field-value" th:text="${devolucion.fecha}">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Estado</span>
                <div class="doc-field-value">
                    <span class="badge-status" th:attr="data-status=${devolucion.estado?.toLowerCase()}"
                          th:text="${devolucion.estado}">—</span>
                </div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Cliente</span>
                <div class="doc-field-value" th:text="${devolucion.cliente?.nombre} ?: '—'">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Importe total</span>
                <div class="doc-field-value" th:text="${devolucion.importeTotal != null ? #numbers.formatDecimal(devolucion.importeTotal,1,2) + ' €' : '—'}">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Albarán</span>
                <div class="doc-field-value" th:text="${devolucion.albaran?.numero} ?: '—'">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Factura</span>
                <div class="doc-field-value" th:text="${devolucion.factura?.numero} ?: '—'">—</div>
            </div>
            <div class="col-12" th:if="${devolucion.motivo}">
                <span class="doc-field-label">Motivo</span>
                <div class="doc-field-value text-muted" th:text="${devolucion.motivo}">—</div>
            </div>
            <div class="col-12" th:if="${devolucion.observaciones}">
                <span class="doc-field-label">Observaciones</span>
                <div class="doc-field-value text-muted" th:text="${devolucion.observaciones}">—</div>
            </div>
        </div>
    </div>
</div>
