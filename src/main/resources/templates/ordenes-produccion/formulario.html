<div th:fragment="content">
    <div class="topbar"><h4 th:text="${titulo}"></h4><a th:href="@{/web/ordenes-produccion}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <div class="form-card" style="max-width:500px;">
        <form th:action="@{/web/ordenes-produccion}" method="post"><input type="hidden" name="id" th:value="${orden?.id}">
            <div class="row g-3">
                <div class="col-12"><label class="form-label">Cantidad planificada</label><input type="number" step="0.01" name="cantidad" class="form-control"></div>
                <div class="col-12"><label class="form-label">Observaciones</label><textarea name="observaciones" class="form-control" rows="3"></textarea></div>
            </div>
            <div class="mt-4"><button type="submit" class="btn btn-primary">Guardar</button><a th:href="@{/web/ordenes-produccion}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
        </form>
    </div>
</div>
