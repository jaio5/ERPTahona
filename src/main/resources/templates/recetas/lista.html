<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Recetas</h1>
            <p>Fichas de elaboración del obrador</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/recetas/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nueva receta
            </a>
        </div>
    </div>

    <form class="filter-bar mb-3" method="get" th:action="@{/web/recetas}">
        <div class="filter-bar-search">
            <label for="recetas-search" class="visually-hidden">Buscar recetas</label>
            <i class="bi bi-search" aria-hidden="true"></i>
            <input id="recetas-search" type="search" name="q" class="form-control form-control-sm"
                   placeholder="Nombre o código…" th:value="${q}" autocomplete="off">
        </div>
        <div class="filter-bar-actions">
            <button class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-funnel me-1" aria-hidden="true"></i>Filtrar
            </button>
            <a th:href="@{/web/recetas}" class="btn btn-ghost btn-sm">Limpiar</a>
        </div>
    </form>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th class="cifra d-none d-md-table-cell">Prep. (min)</th>
                        <th class="cifra">Horneado (min)</th>
                        <th class="cifra">Temp. (°C)</th>
                        <th class="d-none d-lg-table-cell">Alérgenos</th>
                        <th><span class="visually-hidden">Acciones</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(recetas)}">
                        <td colspan="7" class="empty-state">
                            <i class="bi bi-journal-text" aria-hidden="true"></i>
                            <div class="empty-state-title">No hay recetas</div>
                            <small class="empty-state-hint" th:if="${q != null and !q.isEmpty()}">Prueba con otros términos de búsqueda</small>
                            <small class="empty-state-hint" th:unless="${q != null and !q.isEmpty()}">Las recetas guardan tiempos, temperatura e ingredientes de cada elaboración.</small>
                            <a th:unless="${q != null and !q.isEmpty()}" th:href="@{/web/recetas/nuevo}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Crear la primera receta
                            </a>
                        </td>
                    </tr>
                    <tr th:each="r : ${recetas}">
                        <td class="fw-medium" th:text="${r.codigo}"></td>
                        <td>
                            <a th:href="@{/web/recetas/{id}(id=${r.id})}" th:text="${r.nombre}">Receta</a>
                        </td>
                        <td class="cifra text-muted d-none d-md-table-cell" th:text="${r.tiempoPreparacion != null ? r.tiempoPreparacion : '—'}"></td>
                        <td class="cifra text-muted" th:text="${r.tiempoHorneado != null ? r.tiempoHorneado : '—'}"></td>
                        <td class="cifra text-muted" th:text="${r.temperaturaHorneado != null ? r.temperaturaHorneado : '—'}"></td>
                        <td class="text-muted small td-wrap d-none d-lg-table-cell" th:text="${r.alergenos ?: '—'}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/web/recetas/{id}(id=${r.id})}"
                                   class="btn btn-ghost btn-sm btn-icon" title="Ver"
                                   th:attr="aria-label='Ver receta ' + ${r.nombre}">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </a>
                                <a th:href="@{/web/recetas/{id}/editar(id=${r.id})}"
                                   class="btn btn-ghost btn-sm btn-icon" title="Editar"
                                   th:attr="aria-label='Editar receta ' + ${r.nombre}">
                                    <i class="bi bi-pencil" aria-hidden="true"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/recetas')}"></div>
</div>
