<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Receta</h1>
            <p>Ficha técnica de elaboración y horneado</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/recetas}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card form-card-narrow">
        <form th:action="@{/web/recetas}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${receta?.id}">

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-journal-text" aria-hidden="true"></i>Datos generales</h2>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="codigo">Código *</label>
                        <input type="text" id="codigo" name="codigo" class="form-control"
                               th:value="${receta?.codigo}" required>
                        <div class="invalid-feedback">El código es obligatorio.</div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" class="form-control"
                               th:value="${receta?.nombre}" required>
                        <div class="invalid-feedback">El nombre es obligatorio.</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="alergenos">Alérgenos</label>
                        <input type="text" id="alergenos" name="alergenos" class="form-control"
                               th:value="${receta?.alergenos}"
                               placeholder="Gluten, leche, huevo…">
                        <div class="form-text">Sepáralos por comas. Se muestran en la ficha y en el etiquetado.</div>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-fire" aria-hidden="true"></i>Tiempos y horno</h2>
                <div class="row g-3">
                    <div class="col-sm-4">
                        <label class="form-label" for="tiempoPrep">Preparación (min)</label>
                        <input type="number" id="tiempoPrep" name="tiempoPrep" class="form-control text-end"
                               th:value="${receta?.tiempoPreparacion}" min="0" inputmode="numeric">
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label" for="tiempoHorneado">Horneado (min)</label>
                        <input type="number" id="tiempoHorneado" name="tiempoHorneado" class="form-control text-end"
                               th:value="${receta?.tiempoHorneado}" min="0" inputmode="numeric">
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label" for="temperatura">Temperatura (°C)</label>
                        <input type="number" id="temperatura" name="temperatura" class="form-control text-end"
                               th:value="${receta?.temperaturaHorneado}" min="0" inputmode="numeric">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-list-ol" aria-hidden="true"></i>Elaboración</h2>
                <label class="form-label" for="descripcion">Descripción e instrucciones</label>
                <textarea id="descripcion" name="descripcion" class="form-control" rows="5"
                          th:text="${receta?.descripcion}"
                          placeholder="Pasos de elaboración, reposos, notas…"></textarea>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1" aria-hidden="true"></i>Guardar receta
                </button>
                <a th:href="@{/web/recetas}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
