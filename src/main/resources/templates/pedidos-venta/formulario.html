<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Pedido de venta</h1>
            <p>Encargo del cliente; se sirve después con un albarán</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/pedidos-venta}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
        </div>
    </div>

    <div class="form-card form-card-wide">
        <form th:action="@{/web/pedidos-venta}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${pedido?.id}">

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-cart3" aria-hidden="true"></i>Datos del pedido</h2>
                <div class="row g-3">
                    <div class="col-md-4 col-lg-3">
                        <label class="form-label" for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha" class="form-control"
                               th:value="${pedido?.fecha != null ? pedido.fecha : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-md-8 col-lg-9">
                        <label class="form-label" for="clienteId">Cliente *</label>
                        <select id="clienteId" name="clienteId" class="form-select" required data-searchable>
                            <option value="">Seleccionar cliente…</option>
                            <option th:each="c : ${clientes}" th:value="${c.id}"
                                    th:text="${c.nombre}"
                                    th:selected="${pedido?.cliente?.id == c.id}"></option>
                        </select>
                        <div class="invalid-feedback">Selecciona un cliente.</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="observaciones">Observaciones</label>
                        <textarea id="observaciones" name="observaciones" class="form-control" rows="2"
                                  th:text="${pedido?.observaciones}"
                                  placeholder="Instrucciones especiales, dirección de entrega…"></textarea>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-list-ul" aria-hidden="true"></i>Líneas del pedido</h2>

                <div class="table-responsive">
                    <table class="lines-table">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th class="col-qty cifra">Cantidad</th>
                                <th class="col-price cifra">Precio unit.</th>
                                <th class="col-iva cifra">IVA %</th>
                                <th class="col-dto cifra">Dto. %</th>
                                <th class="col-sub cifra">Subtotal</th>
                                <th class="col-del"><span class="visually-hidden">Quitar</span></th>
                            </tr>
                        </thead>
                        <tbody id="pedidoLineasBody"></tbody>
                    </table>
                </div>
                <div class="form-section-tools">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="addLineBtn">
                        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Añadir producto
                    </button>
                </div>

                <div class="total-box">
                    <span class="total-box-label">
                        <i class="bi bi-calculator me-2" aria-hidden="true"></i>Resumen
                    </span>
                    <div class="total-breakdown" aria-live="polite">
                        <div class="total-breakdown-item">
                            <span class="tbl">Base</span>
                            <span class="tbv cifra" id="baseDisplay">0,00 €</span>
                        </div>
                        <div class="total-breakdown-item">
                            <span class="tbl">IVA</span>
                            <span class="tbv cifra" id="ivaDisplay">0,00 €</span>
                        </div>
                        <div class="total-breakdown-item highlight">
                            <span class="tbl">Total</span>
                            <span class="tbv cifra" id="totalDisplay">0,00 €</span>
                        </div>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1" aria-hidden="true"></i>Guardar pedido
                </button>
                <a th:href="@{/web/pedidos-venta}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>

    <!-- Datos para el JS de líneas (no se muestran) -->
    <div id="pedido-form-data" hidden
         th:attr="data-lineas=${lineasJson}">
        <span th:each="a : ${articulos}"
              th:attr="data-id=${a.id},data-texto=${(a.codigo ?: '') + ' — ' + (a.nombre ?: '')},data-pvp=${a.pvp != null ? a.pvp : 0},data-iva=${a.iva != null ? a.iva : 0}"></span>
    </div>
    <script th:attr="nonce=${cspNonce}">
        /* global TomSelect */
        (function() {
            const formData = document.getElementById('pedido-form-data');
            const _lineasExistentes = [];
            const _articulos = [];
            const _articulosData = {};
            try {
                const l = JSON.parse(formData ? formData.getAttribute('data-lineas') : '[]');
                if (Array.isArray(l)) _lineasExistentes.push(...l);
            } catch(e) {}
            document.querySelectorAll('#pedido-form-data span[data-id]').forEach(function(el) {
                const id = el.getAttribute('data-id');
                _articulos.push({id: id, texto: el.getAttribute('data-texto') || ''});
                _articulosData[id] = {
                    pvp: parseFloat(el.getAttribute('data-pvp') || '0'),
                    iva: parseFloat(el.getAttribute('data-iva') || '0')
                };
            });

            const tbody  = document.getElementById('pedidoLineasBody');
            const addBtn = document.getElementById('addLineBtn');
            const baseEl = document.getElementById('baseDisplay');
            const ivaEl  = document.getElementById('ivaDisplay');
            const totalEl = document.getElementById('totalDisplay');
            if (!tbody || !addBtn) return;
            const fmt = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });

            function parseNum(s) {
                if (!s && s !== 0) return 0;
                return parseFloat(String(s).replace(',', '.')) || 0;
            }
            function round2(n) { return Math.round(n * 100) / 100; }
            function fmtDec(val) {
                if (val === null || val === undefined || val === '') return '';
                return String(val).replace('.', ',');
            }

            function recalcTotal() {
                let base = 0, totalIva = 0;
                tbody.querySelectorAll('tr').forEach(function(row) {
                    const c  = parseNum(row.querySelector('.line-cantidad').value);
                    const p  = parseNum(row.querySelector('.line-precio').value);
                    const iv = parseNum(row.querySelector('.line-iva').value);
                    const dt = parseNum(row.querySelector('.line-dto').value);
                    const sub    = round2(c * p * (1 - dt / 100));
                    const ivaAmt = round2(sub * iv / 100);
                    row.querySelector('.line-subtotal').textContent = sub > 0 ? fmt.format(sub) : '—';
                    base     = round2(base + sub);
                    totalIva = round2(totalIva + ivaAmt);
                });
                if (baseEl)  baseEl.textContent  = fmt.format(base);
                if (ivaEl)   ivaEl.textContent   = fmt.format(totalIva);
                if (totalEl) totalEl.textContent = fmt.format(round2(base + totalIva));
            }

            function initTomSelect(sel) {
                if (typeof TomSelect !== 'undefined' && !sel.tomselect) {
                    try { new TomSelect(sel, { maxOptions: 500, searchField: ['text'],
                        render: { no_results: function() { return '<div class="no-results">Sin resultados</div>'; } }
                    }); } catch(e) {}
                }
            }

            function buildSelect(selectedId) {
                const sel = document.createElement('select');
                sel.name = 'lineaArticuloId'; sel.setAttribute('aria-label', 'Producto');
                sel.className = 'form-select form-select-sm line-producto';
                const empty = document.createElement('option');
                empty.value = ''; empty.textContent = 'Seleccionar producto...';
                sel.appendChild(empty);
                _articulos.forEach(function(a) {
                    const opt = document.createElement('option');
                    opt.value = a.id; opt.textContent = a.texto;
                    if (selectedId && String(a.id) === String(selectedId)) opt.selected = true;
                    sel.appendChild(opt);
                });
                return sel;
            }

            // Nombre accesible de cada campo de línea (la tabla no tiene <label>)

            const ARIA_LINEA = { lineaCantidad: 'Cantidad', lineaPrecio: 'Precio unitario', lineaIva: 'IVA %', lineaDescuento: 'Descuento %' };


            function makeInput(name, cssClass, placeholder, value) {
                const inp = document.createElement('input');
                inp.type = 'text'; inp.inputMode = 'decimal';
                inp.name = name; inp.setAttribute('aria-label', ARIA_LINEA[name] || name);
                inp.className = 'form-control form-control-sm text-end ' + cssClass + ' line-input';
                inp.placeholder = placeholder;
                if (value !== undefined && value !== null) inp.value = value;
                return inp;
            }

            function addRow(data) {
                const tr = document.createElement('tr');
                const sel    = buildSelect(data && data.articuloId);
                const cant   = makeInput('lineaCantidad',  'line-cantidad', '0',    data && fmtDec(data.cantidad));
                const precio = makeInput('lineaPrecio',    'line-precio',   '0,00', data && fmtDec(data.precio));
                const iva    = makeInput('lineaIva',       'line-iva',      '21',   data && fmtDec(data.iva));
                const dto    = makeInput('lineaDescuento', 'line-dto',      '0',    data && fmtDec(data.descuento));

                const tdSel    = document.createElement('td'); tdSel.appendChild(sel);
                const tdCant   = document.createElement('td'); tdCant.appendChild(cant);
                const tdPrecio = document.createElement('td'); tdPrecio.appendChild(precio);
                const tdIva    = document.createElement('td'); tdIva.appendChild(iva);
                const tdDto    = document.createElement('td'); tdDto.appendChild(dto);
                const tdSub    = document.createElement('td');
                tdSub.className = 'line-subtotal'; tdSub.textContent = '—';
                const tdDel  = document.createElement('td');
                const btnDel = document.createElement('button');
                btnDel.type = 'button';
                btnDel.className = 'btn btn-ghost btn-sm btn-icon text-danger line-remove btn-remove-line';
                btnDel.title = 'Quitar línea';
                btnDel.setAttribute('aria-label', 'Quitar línea');
                btnDel.innerHTML = '<i class="bi bi-trash3" aria-hidden="true"></i>';
                tdDel.appendChild(btnDel);

                [tdSel, tdCant, tdPrecio, tdIva, tdDto, tdSub, tdDel].forEach(function(td) { tr.appendChild(td); });

                sel.addEventListener('change', function() {
                    const art = _articulosData[sel.value];
                    if (art) {
                        if (!precio.value) precio.value = (Number(art.pvp) || 0).toFixed(2).replace('.', ',');
                        if (!iva.value)    iva.value    = String(art.iva != null ? art.iva : 0).replace('.', ',');
                    }
                    recalcTotal();
                });
                [cant, precio, iva, dto].forEach(function(inp) { inp.addEventListener('input', recalcTotal); });

                tbody.appendChild(tr);
                initTomSelect(sel);

                btnDel.addEventListener('click', function() {
                    tr.remove();
                    if (!tbody.querySelectorAll('tr').length) addRow();
                    recalcTotal();
                });
                recalcTotal();
            }

            addBtn.addEventListener('click', function() { addRow(); });

            if (_lineasExistentes.length > 0) {
                _lineasExistentes.forEach(function(l) { addRow(l); });
            } else {
                addRow();
            }
        })();
    </script>
</div>
