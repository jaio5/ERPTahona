<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="'Pedido ' + ${pedido.numero}">Pedido de venta</h4>
            <p>
                <span class="badge-status"
                      th:attr="data-status=${pedido.estado?.toLowerCase()}"
                      th:text="${pedido.estado ?: 'Sin estado'}">-</span>
                <span class="text-muted small ms-2"
                      th:text="${pedido.fecha != null ? #temporals.format(pedido.fecha,'dd/MM/yyyy') : ''}"></span>
            </p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/pedidos-venta}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="form-card mb-4">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="doc-header-icon">
                        <i class="bi bi-cart"></i>
                    </div>
                    <div>
                        <div class="fw-bold fs-5" th:text="${pedido.cliente?.nombre ?: '—'}">Cliente</div>
                        <div class="text-muted small" th:text="${pedido.cliente?.cif ?: ''}"></div>
                    </div>
                </div>

                <div class="doc-fields">
                    <table class="doc-table">
                    <tr>
                        <th scope="row">Número</th>
                        <td th:text="${pedido.numero ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Fecha</th>
                        <td th:text="${pedido.fecha != null ? #temporals.format(pedido.fecha,'dd/MM/yyyy') : '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Cliente</th>
                        <td th:text="${pedido.cliente?.nombre ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Total</th>
                        <td style="font-size:1.3rem;color:var(--brand-color);"
                             th:text="${#numbers.formatCurrency(totalCalculado)}">—</td>
                    </tr>
                    <tr th:if="${pedido.observaciones != null and !pedido.observaciones.isEmpty()}">
                        <th scope="row">Observaciones</th>
                        <td class="text-muted" th:text="${pedido.observaciones}"></td>
                    </tr>
                    <tr>
                        <th scope="row">Estado</th>
                        <td>
                            <span class="badge-status"
                                  th:attr="data-status=${pedido.estado?.toLowerCase()}"
                                  th:text="${pedido.estado ?: '—'}">—</span>
                        </td>
                    </tr>
                    </table>
                </div>
            </div>

            <div class="table-card" th:if="${pedido.pedidoLineas != null and !pedido.pedidoLineas.isEmpty()}">
                <div class="d-flex align-items-center justify-content-between px-4 py-3 border-separator">
                    <span class="fw-semibold">Líneas del pedido</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Artículo</th>
                                <th class="text-center" style="width:90px;">Cantidad</th>
                                <th class="text-end" style="width:120px;">Precio unit.</th>
                                <th class="text-end" style="width:120px;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="l : ${pedido.pedidoLineas}">
                                <td th:text="${l.articulo?.nombre ?: '—'}">—</td>
                                <td class="text-center" th:text="${l.cantidad}">0</td>
                                <td class="text-end"
                                    th:text="${l.precio != null ? #numbers.formatCurrency(l.precio) : '—'}">—</td>
                                <td class="text-end fw-semibold"
                                    th:text="${l.precio != null and l.cantidad != null ? #numbers.formatCurrency(l.precio.multiply(l.cantidad)) : '—'}">—</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" class="text-end fw-semibold text-muted">Total pedido</td>
                                <td class="text-end fw-bold"
                                    style="font-size:1.05rem;color:var(--brand-color);"
                                    th:text="${#numbers.formatCurrency(totalCalculado)}">—</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="form-card total-card-big mb-3">
                <div class="label">Total pedido</div>
                <div class="amount"
                     th:text="${#numbers.formatCurrency(totalCalculado)}">0,00 €</div>
                <div>
                    <span class="badge-status"
                          th:attr="data-status=${pedido.estado?.toLowerCase()}"
                          th:text="${pedido.estado ?: '—'}">—</span>
                </div>
            </div>

            <div class="form-card">
                <div class="doc-field-label mb-3">Acciones</div>
                <div class="d-grid gap-2">
                    <form th:if="${pedido.estado == 'PENDIENTE'}"
                          th:action="@{/web/pedidos-venta/{id}/confirmar(id=${pedido.id})}" method="post">
                        <button class="btn btn-success w-100" data-no-double-click>
                            <i class="bi bi-check-lg me-2"></i>Confirmar pedido
                        </button>
                    </form>
                    <a th:if="${pedido.estado == 'PENDIENTE'}"
                       th:href="@{/web/pedidos-venta/{id}/editar(id=${pedido.id})}"
                        class="btn btn-ghost">
                        <i class="bi bi-pencil me-2"></i>Editar pedido
                    </a>
                    <a th:if="${pedido.estado == 'CONFIRMADO'}"
                       th:href="@{/web/albaranes/nuevo}"
                       class="btn btn-primary">
                        <i class="bi bi-truck me-2"></i>Crear albarán
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
