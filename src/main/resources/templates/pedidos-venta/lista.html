<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Pedidos de venta</h1>
            <p>Encargos de clientes pendientes de servir</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/pedidos-venta/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nuevo pedido
            </a>
        </div>
    </div>

    <form class="filter-bar mb-3" method="get" th:action="@{/web/pedidos-venta}">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="dir"  th:value="${dir}">
        <div class="filter-bar-search">
            <label for="pedidos-search" class="visually-hidden">Buscar pedidos</label>
            <i class="bi bi-search" aria-hidden="true"></i>
            <input id="pedidos-search" type="search" name="q" class="form-control form-control-sm"
                   placeholder="Número o cliente…" th:value="${q}" autocomplete="off">
        </div>
        <div class="filter-bar-filters">
            <select name="estado" class="form-select form-select-sm" aria-label="Estado" data-autosubmit>
                <option value="">Todos los estados</option>
                <option value="PENDIENTE"       th:selected="${estado == 'PENDIENTE'}">Pendiente</option>
                <option value="CONFIRMADO"      th:selected="${estado == 'CONFIRMADO'}">Confirmado</option>
                <option value="SERVIDO_PARCIAL" th:selected="${estado == 'SERVIDO_PARCIAL'}">Servido parcial</option>
                <option value="SERVIDO"         th:selected="${estado == 'SERVIDO'}">Servido</option>
                <option value="CANCELADO"       th:selected="${estado == 'CANCELADO'}">Cancelado</option>
            </select>
        </div>
        <div class="filter-bar-actions">
            <button class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-funnel me-1" aria-hidden="true"></i>Filtrar
            </button>
            <a th:href="@{/web/pedidos-venta}" class="btn btn-ghost btn-sm">Limpiar</a>
            <span class="filter-bar-count" th:if="${page != null}">
                <span th:text="${page.totalElements}">0</span> pedidos
            </span>
        </div>
    </form>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Número</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Estado</th>
                        <th><span class="visually-hidden">Acciones</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="5" class="empty-state">
                            <i class="bi bi-cart" aria-hidden="true"></i>
                            <div class="empty-state-title">No hay pedidos de venta</div>
                            <small class="empty-state-hint" th:if="${(q != null and !q.isEmpty()) or (estado != null and !estado.isEmpty())}">Prueba con otro estado u otros términos de búsqueda</small>
                            <small class="empty-state-hint" th:unless="${(q != null and !q.isEmpty()) or (estado != null and !estado.isEmpty())}">Registra aquí los encargos de tus clientes</small>
                            <a th:href="@{/web/pedidos-venta/nuevo}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nuevo pedido
                            </a>
                        </td>
                    </tr>
                    <tr th:each="p : ${pedidos}">
                        <td><a th:href="@{/web/pedidos-venta/{id}(id=${p.id})}" th:text="${p.numero ?: '—'}">PV-1</a></td>
                        <td class="text-muted"
                            th:text="${p.fecha != null ? #temporals.format(p.fecha, 'dd/MM/yyyy') : '—'}">01/10/2026</td>
                        <td th:text="${p.cliente?.nombre ?: '—'}">Cliente</td>
                        <td>
                            <span class="badge-status" th:attr="data-status=${p.estado?.toLowerCase()}"
                                  th:text="${p.estado ?: '—'}">PENDIENTE</span>
                        </td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/web/pedidos-venta/{id}(id=${p.id})}"
                                   class="btn btn-ghost btn-sm btn-icon" title="Ver"
                                   th:attr="aria-label='Ver pedido ' + ${p.numero}">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </a>
                                <a th:if="${p.estado == 'PENDIENTE'}"
                                   th:href="@{/web/pedidos-venta/{id}/editar(id=${p.id})}"
                                   class="btn btn-ghost btn-sm btn-icon" title="Editar"
                                   th:attr="aria-label='Editar pedido ' + ${p.numero}">
                                    <i class="bi bi-pencil" aria-hidden="true"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/pedidos-venta')}"></div>
</div>
