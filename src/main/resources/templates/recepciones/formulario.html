<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Recepción</h1>
            <p>Mercancía que entra al almacén; los productos se añaden después, en la ficha</p>
        </div>
        <div class="page-header-actions">
            <a th:href="${recepcion?.id != null ? '/web/recepciones/' + recepcion.id : '/web/recepciones'}"
               class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
        </div>
    </div>

    <!-- El mensaje de error del controlador sale como toast desde el layout -->
    <div class="form-card form-card-narrow">
        <form th:action="${recepcion?.id != null ? '/web/recepciones/' + recepcion.id : '/web/recepciones'}"
              method="post" class="needs-validation" novalidate>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-box-arrow-in-down" aria-hidden="true"></i>Datos de la recepción</h2>
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label" for="proveedorId">Proveedor *</label>
                        <select id="proveedorId" name="proveedorId" class="form-select" required>
                            <option value="">Selecciona un proveedor…</option>
                            <option th:each="p : ${proveedores}"
                                    th:value="${p.id}"
                                    th:text="${p.nombre}"
                                    th:selected="${recepcion?.proveedor?.id == p.id}"></option>
                        </select>
                        <div class="invalid-feedback">El proveedor es obligatorio.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="numero">Número</label>
                        <input id="numero" name="numero" class="form-control" placeholder="Automático"
                               th:value="${recepcion?.numero}" autocomplete="off" aria-describedby="numeroAyuda">
                        <div class="form-text" id="numeroAyuda">Albarán o referencia del proveedor. Opcional.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="almacenId">Almacén de destino</label>
                        <select id="almacenId" name="almacenId" class="form-select">
                            <option value="">Sin almacén específico</option>
                            <option th:each="a : ${almacenes}"
                                    th:value="${a.id}"
                                    th:text="${a.nombre}"
                                    th:selected="${recepcion?.almacen?.id == a.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="pedidoCompraId">Pedido de compra relacionado</label>
                        <select id="pedidoCompraId" name="pedidoCompraId" class="form-select">
                            <option value="">Ninguno</option>
                            <option th:each="pc : ${pedidosCompra}"
                                    th:value="${pc.id}"
                                    th:text="${pc.numero ?: '#' + pc.id}"
                                    th:selected="${recepcion?.pedidoCompra?.id == pc.id}"></option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="form-section-title"><i class="bi bi-chat-left-text" aria-hidden="true"></i>Notas</h2>
                <label class="form-label" for="observaciones">Observaciones</label>
                <textarea id="observaciones" name="observaciones" class="form-control" rows="2"
                          th:text="${recepcion?.observaciones}"
                          placeholder="Estado de la mercancía, temperatura de llegada…"></textarea>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1" aria-hidden="true"></i>
                    <span th:text="${recepcion?.id != null ? 'Guardar cambios' : 'Crear recepción'}">Guardar</span>
                </button>
                <a th:href="@{/web/recepciones}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
