<div th:fragment="content">
    <div class="topbar"><h4 th:text="${titulo}">Albaranes</h4><a th:href="@{/web/albaranes/nuevo}" class="btn btn-success btn-sm">+ Nuevo albarán</a></div>
    <div th:if="${exito}" class="alert alert-success py-2" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
    <div class="row g-2 mb-3"><div class="col-md-5"><form class="d-flex gap-2"><input type="search" name="q" class="form-control form-control-sm" placeholder="Buscar..." th:value="${q}"><button class="btn btn-outline-primary btn-sm">Filtrar</button></form></div></div>
    <div class="table-card"><table class="table table-hover">
        <thead><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th class="text-end">Total</th><th style="width:100px;"></th></tr></thead>
        <tbody><tr th:each="a : ${albaranes}">
            <td th:text="${a.numero}"></td><td th:text="${a.fecha != null ? #temporals.format(a.fecha, 'dd/MM/yyyy') : '-'}"></td>
            <td th:text="${a.cliente?.nombre}"></td><td class="text-end" th:text="${a.total != null ? #numbers.formatCurrency(a.total) : '-'}"></td>
            <td><a th:href="@{/web/albaranes/{id}(id=${a.id})}" class="btn btn-outline-secondary btn-sm">Ver</a></td>
        </tr></tbody>
    </table></div>
</div>
