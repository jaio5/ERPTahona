<div th:fragment="content">
    <div class="topbar">
        <h4 th:text="'Albaran ' + ${albaran.numero}"></h4>
        <div class="d-flex gap-2">
            <a th:href="@{/web/albaranes/{id}/pdf(id=${albaran.id})}" class="btn btn-outline-primary btn-sm">Descargar PDF</a>
            <a th:href="@{/web/albaranes}" class="btn btn-outline-secondary btn-sm">Volver</a>
        </div>
    </div>
    <div class="form-card"><div class="row g-3">
        <div class="col-md-4"><small class="text-muted">Cliente</small><h6 th:text="${albaran.cliente?.nombre}"></h6></div>
        <div class="col-md-4"><small class="text-muted">Fecha</small><h6 th:text="${albaran.fecha} ?: '-'"></h6></div>
        <div class="col-md-4"><small class="text-muted">Almacen</small><h6 th:text="${albaran.almacen?.nombre} ?: '-'"></h6></div>
        <div class="col-12"><small class="text-muted">Total</small><h5 th:text="${albaran.total != null ? #numbers.formatCurrency(albaran.total) : '0,00 EUR'}"></h5></div>
    </div></div>
</div>
