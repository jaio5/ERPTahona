<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Nuevo albarán</h4>
        </div>
        <div class="page-header-actions">
            <button type="button" class="btn btn-primary btn-sm"
                    th:if="${albaran != null and albaran.id != null and albaran.estado != 'FACTURADO' and albaran.estado != 'ANULADO'}"
                    data-bs-toggle="modal" data-bs-target="#modalFacturar"
                    th:attr="data-albaran-numero=${albaran.numero}, data-albaran-id=${albaran.id}, data-cliente=${albaran.cliente?.nombre}">
                <i class="bi bi-receipt me-1"></i>Convertir en factura
            </button>
            <a th:href="@{/web/albaranes}" class="btn btn-ghost btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

<div class="form-card form-card-wide">
        <form th:action="@{/web/albaranes}" method="post" class="needs-validation" novalidate>
            <input type="hidden" name="id" th:value="${albaran?.id}">

            <div class="form-section-title">
                <i class="bi bi-file-text"></i> Datos del albarán
            </div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label" for="fecha">Fecha *</label>
                <input type="date" id="fecha" name="fecha" class="form-control"
                           th:value="${albaran?.fecha != null ? albaran.fecha : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                           required>
                    <div class="invalid-feedback">La fecha es obligatoria.</div>
                </div>
                <div class="col-md-9">
                    <label class="form-label" for="clienteId">Cliente *</label>
                    <select id="clienteId" name="clienteId" class="form-select" required data-searchable>
                        <option value="">Seleccionar cliente...</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}"
                                th:text="${c.nombre}"
                                th:selected="${albaran?.cliente?.id == c.id}"></option>
                    </select>
                    <div class="invalid-feedback">Selecciona un cliente.</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="almacenId">Almacén</label>
                    <select id="almacenId" name="almacenId" class="form-select">
                        <option value="">Sin almacén</option>
                        <option th:each="a : ${almacenes}" th:value="${a.id}"
                                th:text="${a.nombre}"
                                th:selected="${albaran?.almacen?.id != null ? albaran.almacen.id == a.id : almacenPorDefectoId == a.id}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="numeroLote">Nº de lote</label>
                    <input type="text" id="numeroLote" name="numeroLote" class="form-control"
                           th:value="${albaran?.numeroLote}" placeholder="Nº lote del albarán">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="observaciones">Observaciones</label>
                    <textarea id="observaciones" name="observaciones" class="form-control" rows="2"
                              th:text="${albaran?.observaciones}"></textarea>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="descuentoGlobalValor">Descuento global</label>
                    <input type="number" step="0.01" min="0" id="descuentoGlobalValor" name="descuentoGlobalValor"
                           class="form-control" th:value="${albaran?.descuentoGlobalValor}"
                           placeholder="Sobre el total">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="descuentoGlobalTipo">Tipo de descuento</label>
                    <select id="descuentoGlobalTipo" name="descuentoGlobalTipo" class="form-select">
                        <option value="PORCENTAJE" th:selected="${albaran?.descuentoGlobalTipo == null or albaran?.descuentoGlobalTipo == 'PORCENTAJE'}">% Porcentaje</option>
                        <option value="IMPORTE" th:selected="${albaran?.descuentoGlobalTipo == 'IMPORTE'}">€ Importe fijo</option>
                    </select>
                </div>
            </div>

            <div class="form-section-divider">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <div class="form-section-title mb-0">
                        <i class="bi bi-list-ul"></i> Líneas del albarán
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-ghost btn-sm" id="addLineBtn">
                            <i class="bi bi-plus me-1"></i>Añadir producto
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm" id="copyPedidoBtn"
                                title="Cargar líneas del pedido anterior de este cliente"
                                style="display:none">
                            <i class="bi bi-clipboard-check me-1"></i>Copiar pedido anterior
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="lines-table">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th class="col-qty">Cantidad</th>
                                <th class="col-price">Precio unit.</th>
                                <th class="col-iva">IVA %</th>
                                <th class="col-dto">Dto %</th>
                                <th class="col-sub text-end">Subtotal</th>
                                <th class="col-del"></th>
                            </tr>
                        </thead>
                        <tbody id="albaranLineasBody"></tbody>
                    </table>
                </div>

                <div class="total-box mt-3">
                    <span class="total-box-label">
                        <i class="bi bi-calculator me-2"></i>Total del albarán
                    </span>
                    <span class="total-box-amount" id="totalDisplay">0,00 €</span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" data-no-double-click>
                    <i class="bi bi-floppy me-1"></i>Guardar albarán
                </button>
                <a th:href="@{/web/albaranes}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>

    <div id="albaran-form-data"
         th:attr="data-lineas=${lineasJson}"
         style="display:none">
        <span th:each="a : ${articulos}"
              th:attr="data-id=${a.id},data-texto=${(a.codigo ?: '') + ' — ' + (a.nombre ?: '')},data-pvp=${a.pvp != null ? a.pvp : 0},data-iva=${a.iva != null ? a.iva : 0}"
              style="display:none"></span>
        <span th:each="t : ${tiposIva}" class="tipo-iva-opt"
              th:attr="data-valor=${t.porcentaje},data-nombre=${t.nombre},data-defecto=${t.esDefecto}"
              style="display:none"></span>
    </div>
    <script th:attr="nonce=${cspNonce}">
        /* global TomSelect */
        (function() {
            const formData = document.getElementById('albaran-form-data');
            const _lineasExistentes = [];
            const _articulos = [];
            const _articulosData = {};
            try {
                const l = JSON.parse(formData ? formData.getAttribute('data-lineas') : '[]');
                if (Array.isArray(l)) _lineasExistentes.push(...l);
            } catch(e) {}
            document.querySelectorAll('#albaran-form-data span[data-id]').forEach(function(el) {
                const id = el.getAttribute('data-id');
                _articulos.push({id: id, texto: el.getAttribute('data-texto') || ''});
                _articulosData[id] = {
                    pvp: parseFloat(el.getAttribute('data-pvp') || '0'),
                    iva: parseFloat(el.getAttribute('data-iva') || '0')
                };
            });
            const _tiposIva = [];
            document.querySelectorAll('#albaran-form-data span.tipo-iva-opt').forEach(function(el) {
                _tiposIva.push({
                    valor: String(el.getAttribute('data-valor') || '').replace(',', '.'),
                    nombre: el.getAttribute('data-nombre') || '',
                    defecto: el.getAttribute('data-defecto') === 'true'
                });
            });

            const tbody    = document.getElementById('albaranLineasBody');
            const addBtn   = document.getElementById('addLineBtn');
            const totalEl  = document.getElementById('totalDisplay');
            if (!tbody || !addBtn || !totalEl) { console.warn('albaran form: elementos no encontrados'); return; }
            const fmt = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });

            function parseNum(s) {
                if (!s && s !== 0) return 0;
                return parseFloat(String(s).replace(',', '.')) || 0;
            }
            function round2(n) { return Math.round(n * 100) / 100; }
            function fmtDec(val) {
                if (val === null || val === undefined || val === '') return '';
                return String(val).replace('.', ',');
            }

            function ivaNum(v) { return parseFloat(String(v == null ? '' : v).replace(',', '.')); }

            function setIvaValue(field, val) {
                if (!field || field.tagName !== 'SELECT') { if (field) field.value = fmtDec(val); return; }
                const target = ivaNum(val);
                let found = false;
                Array.prototype.forEach.call(field.options, function(o) {
                    if (ivaNum(o.value) === target) { o.selected = true; found = true; }
                });
                if (!found && !isNaN(target)) {
                    const opt = document.createElement('option');
                    opt.value = String(target); opt.textContent = fmtDec(val) + ' %'; opt.selected = true;
                    field.appendChild(opt);
                }
            }

            // Campo de IVA de la línea: <select> del catálogo, o input libre si no hay catálogo.
            function buildIvaField(selectedVal) {
                if (_tiposIva.length === 0) {
                    const inp = document.createElement('input');
                    inp.type = 'text'; inp.inputMode = 'decimal';
                    inp.name = 'lineaIva';
                    inp.className = 'form-control form-control-sm line-iva line-input';
                    inp.placeholder = '21';
                    if (selectedVal != null) inp.value = fmtDec(selectedVal);
                    return inp;
                }
                const sel = document.createElement('select');
                sel.name = 'lineaIva';
                sel.className = 'form-select form-select-sm line-iva line-input';
                _tiposIva.forEach(function(t) {
                    const opt = document.createElement('option');
                    opt.value = t.valor; opt.textContent = t.nombre;
                    sel.appendChild(opt);
                });
                if (selectedVal != null && String(selectedVal).trim() !== '') {
                    setIvaValue(sel, selectedVal);
                } else {
                    const def = _tiposIva.find(function(t) { return t.defecto; });
                    if (def) setIvaValue(sel, def.valor);
                }
                return sel;
            }

            const gValEl  = document.getElementById('descuentoGlobalValor');
            const gTipoEl = document.getElementById('descuentoGlobalTipo');

            function recalcTotal() {
                let base = 0, totalIva = 0;
                tbody.querySelectorAll('tr').forEach(function(row) {
                    const c  = parseNum(row.querySelector('.line-cantidad').value);
                    const p  = parseNum(row.querySelector('.line-precio').value);
                    const iv = parseNum(row.querySelector('.line-iva').value);
                    const dtEl = row.querySelector('.line-dto');
                    const dt = dtEl ? parseNum(dtEl.value) : 0;
                    const sub = round2(c * p * (1 - dt / 100));
                    const ivaAmt = round2(sub * iv / 100);
                    row.querySelector('.line-subtotal').textContent = (sub + ivaAmt) > 0 ? fmt.format(round2(sub + ivaAmt)) : '—';
                    base = round2(base + sub);
                    totalIva = round2(totalIva + ivaAmt);
                });
                // Descuento global prorrateado (preview; cálculo exacto en servidor)
                const gVal = parseNum(gValEl ? gValEl.value : 0);
                const gTipo = gTipoEl ? gTipoEl.value : 'PORCENTAJE';
                let gAmt = 0;
                if (gVal > 0 && base > 0) {
                    gAmt = gTipo === 'IMPORTE' ? Math.min(gVal, base) : round2(base * gVal / 100);
                }
                const baseNeta = round2(base - gAmt);
                const ivaNeto  = base > 0 ? round2(totalIva * (baseNeta / base)) : 0;
                totalEl.textContent = fmt.format(round2(baseNeta + ivaNeto));
            }
            if (gValEl) gValEl.addEventListener('input', recalcTotal);
            if (gTipoEl) gTipoEl.addEventListener('change', recalcTotal);

            function initTomSelect(sel) {
                if (typeof TomSelect !== 'undefined' && !sel.tomselect) {
                    try {
                        new TomSelect(sel, {
                            maxOptions: 500,
                            searchField: ["text"],
                            render: { no_results: function() { return '<div class="no-results">Sin resultados</div>'; } }
                        });
                    } catch(e) { /* TomSelect no disponible aún */ }
                }
            }

            function buildSelect(selectedId) {
                const sel = document.createElement('select');
                sel.name = 'lineaArticuloId';
                sel.className = 'form-select form-select-sm line-producto';
                const empty = document.createElement('option');
                empty.value = ''; empty.textContent = 'Seleccionar producto...';
                sel.appendChild(empty);
                _articulos.forEach(function(a) {
                    const opt = document.createElement('option');
                    opt.value = a.id;
                    opt.textContent = a.texto;
                    if (selectedId && String(a.id) === String(selectedId)) opt.selected = true;
                    sel.appendChild(opt);
                });
                return sel;
            }

            function addRow(data) {
                const tr = document.createElement('tr');

                const tdSel = document.createElement('td');
                const sel = buildSelect(data && data.articuloId);
                tdSel.appendChild(sel);

                const tdCant = document.createElement('td');
                const cant = document.createElement('input');
                cant.type = 'text'; cant.inputMode = 'decimal';
                cant.name = 'lineaCantidad';
                cant.className = 'form-control form-control-sm line-cantidad line-input';
                cant.placeholder = '0';
                if (data && data.cantidad) cant.value = fmtDec(data.cantidad);
                tdCant.appendChild(cant);

                const tdPrecio = document.createElement('td');
                const precio = document.createElement('input');
                precio.type = 'text'; precio.inputMode = 'decimal';
                precio.name = 'lineaPrecio';
                precio.className = 'form-control form-control-sm line-precio line-input';
                precio.placeholder = '0,00';
                if (data && data.precio) precio.value = fmtDec(data.precio);
                tdPrecio.appendChild(precio);

                const tdIva = document.createElement('td');
                const iva = buildIvaField(data ? data.iva : null);
                tdIva.appendChild(iva);

                const tdDto = document.createElement('td');
                const dto = document.createElement('input');
                dto.type = 'text'; dto.inputMode = 'decimal';
                dto.name = 'lineaDescuento';
                dto.className = 'form-control form-control-sm line-dto line-input';
                dto.placeholder = '0';
                if (data && data.descuento) dto.value = fmtDec(data.descuento);
                tdDto.appendChild(dto);

                const tdSub = document.createElement('td');
                tdSub.className = 'line-subtotal';
                tdSub.textContent = '—';

                const tdDel = document.createElement('td');
                const btnDel = document.createElement('button');
                btnDel.type = 'button';
                btnDel.className = 'btn btn-ghost btn-sm text-danger line-remove btn-remove-line p-1';
                btnDel.title = 'Eliminar línea';
                btnDel.innerHTML = '<i class="bi bi-trash3"></i>';
                tdDel.appendChild(btnDel);

                tr.appendChild(tdSel);
                tr.appendChild(tdCant);
                tr.appendChild(tdPrecio);
                tr.appendChild(tdIva);
                tr.appendChild(tdDto);
                tr.appendChild(tdSub);
                tr.appendChild(tdDel);

                tbody.appendChild(tr);

                sel.addEventListener('change', function() {
                    const art = _articulosData[sel.value];
                    if (art) {
                        if (!precio.value) precio.value = (Number(art.pvp) || 0).toFixed(2).replace('.', ',');
                        setIvaValue(iva, art.iva != null ? art.iva : 0);
                    }
                    recalcTotal();
                });

                [cant, precio, iva, dto].forEach(function(inp) {
                    inp.addEventListener('input', recalcTotal);
                });

                btnDel.addEventListener('click', function() {
                    tr.remove();
                    if (!tbody.querySelectorAll('tr').length) addRow();
                    recalcTotal();
                });

                initTomSelect(sel);
                recalcTotal();
            }

            addBtn.addEventListener('click', function() { addRow(); });

            if (_lineasExistentes.length > 0) {
                _lineasExistentes.forEach(function(l) { addRow(l); });
            } else {
                addRow();
            }

            // Exponer para el módulo de copia de pedidos
            window._albaranForm = { addRow: addRow, tbody: tbody, recalcTotal: recalcTotal };
        })();
    </script>

    <script th:attr="nonce=${cspNonce}">
        (function() {
            const clienteSelect = document.getElementById('clienteId');
            const copyBtn      = document.getElementById('copyPedidoBtn');
            if (!clienteSelect || !copyBtn) return;

            function actualizarBoton() {
                copyBtn.style.display = clienteSelect.value ? '' : 'none';
            }
            clienteSelect.addEventListener('change', actualizarBoton);
            actualizarBoton();

            copyBtn.addEventListener('click', function() {
                const clienteId = clienteSelect.value;
                if (!clienteId) return;

                copyBtn.disabled = true;
                copyBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Cargando...';

                fetch('/api/web/clientes/' + clienteId + '/albaranes-recientes')
                    .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
                    .then(function(pedidos) {
                        copyBtn.disabled = false;
                        copyBtn.innerHTML = '<i class="bi bi-clipboard-check me-1"></i>Copiar pedido anterior';
                        mostrarModalPedidos(pedidos);
                    })
                    .catch(function() {
                        copyBtn.disabled = false;
                        copyBtn.innerHTML = '<i class="bi bi-clipboard-check me-1"></i>Copiar pedido anterior';
                        alert('No se pudieron cargar los pedidos del cliente.');
                    });
            });

            function mostrarModalPedidos(pedidos) {
                var existing = document.getElementById('modalCopiarPedido');
                if (existing) existing.remove();

                var fmt = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });

                var filas = '';
                if (!pedidos.length) {
                    filas = '<tr><td colspan="4" class="empty-state"><i class="bi bi-box"></i><div>Este cliente no tiene albaranes anteriores.</div></td></tr>';
                } else {
                    pedidos.forEach(function(p, idx) {
                        var nLineas = p.lineas ? p.lineas.length : 0;
                        filas += '<tr style="cursor:pointer" data-idx="' + idx + '">' +
                            '<td class="fw-semibold">' + (p.numero || '—') + '</td>' +
                            '<td>' + (p.fecha || '—') + '</td>' +
                            '<td>' + nLineas + ' producto' + (nLineas !== 1 ? 's' : '') + '</td>' +
                            '<td class="text-end">' + (p.total != null ? fmt.format(p.total) : '—') + '</td>' +
                            '</tr>';
                    });
                }

                var modal = document.createElement('div');
                modal.className = 'modal fade';
                modal.id = 'modalCopiarPedido';
                modal.tabIndex = -1;
                modal.innerHTML =
                    '<div class="modal-dialog modal-lg">' +
                      '<div class="modal-content">' +
                        '<div class="modal-header">' +
                          '<h5 class="modal-title"><i class="bi bi-clipboard-check me-2 text-primary"></i>Copiar albarán anterior</h5>' +
                          '<button type="button" class="btn-close" data-bs-dismiss="modal"></button>' +
                        '</div>' +
                        '<div class="modal-body p-0">' +
                          '<p class="text-muted small px-3 pt-3 mb-2">Haz clic en un albarán para copiar sus líneas. Las líneas actuales serán reemplazadas.</p>' +
                          '<table class="table table-hover mb-0">' +
                            '<thead class="table-light"><tr>' +
                              '<th>Número</th><th>Fecha</th><th>Productos</th><th class="text-end">Total</th>' +
                            '</tr></thead>' +
                            '<tbody>' + filas + '</tbody>' +
                          '</table>' +
                        '</div>' +
                        '<div class="modal-footer">' +
                          '<button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>' +
                        '</div>' +
                      '</div>' +
                    '</div>';

                document.body.appendChild(modal);

                var bsModal = new bootstrap.Modal(modal);
                bsModal.show();

                modal.querySelectorAll('tbody tr[data-idx]').forEach(function(tr) {
                    tr.addEventListener('click', function() {
                        var pedido = pedidos[parseInt(tr.getAttribute('data-idx'))];
                        if (!pedido || !pedido.lineas) return;

                        var form = window._albaranForm;
                        if (!form) return;

                        // Limpiar líneas actuales
                        form.tbody.innerHTML = '';

                        if (pedido.lineas.length > 0) {
                            pedido.lineas.forEach(function(l) {
                                form.addRow({
                                    articuloId: l.articuloId,
                                    cantidad:   l.cantidad,
                                    precio:     l.precio,
                                    iva:        l.iva
                                });
                            });
                        } else {
                            form.addRow();
                        }

                        bsModal.hide();
                    });
                });

                modal.addEventListener('hidden.bs.modal', function() { modal.remove(); });
            }
        })();
    </script>

    <!-- Modal: Convertir en factura (solo visible en edición de albarán existente) -->
    <div class="modal fade" id="modalFacturar" tabindex="-1" aria-labelledby="modalFacturarLabel" aria-hidden="true"
         th:if="${albaran != null and albaran.id != null}">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalFacturarLabel">
                        <i class="bi bi-receipt me-2 text-primary"></i>Convertir en factura
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form method="post" th:action="@{/web/albaranes/{id}/facturar(id=${albaran.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="modal-body">
                        <p class="text-muted small mb-4"
                           th:text="'Albarán ' + ${albaran.numero} + (${albaran.cliente?.nombre} != null ? '  ·  ' + ${albaran.cliente.nombre} : '')"></p>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="fFechaF">
                                Fecha de factura <span class="text-danger">*</span>
                            </label>
                            <input type="date" id="fFechaF" name="fecha" class="form-control" required
                                   th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="fMedioCobroF">Medio de cobro</label>
                            <select id="fMedioCobroF" name="medioCobro" class="form-select">
                                <option value="">— Sin especificar —</option>
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="TRANSFERENCIA">Transferencia bancaria</option>
                                <option value="TARJETA">Tarjeta</option>
                                <option value="CHEQUE">Cheque</option>
                                <option value="PAGARE">Pagaré</option>
                                <option value="BIZUM">Bizum</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="fFechaVencF">Fecha de vencimiento</label>
                            <input type="date" id="fFechaVencF" name="fechaVencimiento" class="form-control">
                            <div class="form-text">Déjala vacía si el pago es inmediato</div>
                        </div>
                        <div class="mb-1">
                            <label class="form-label fw-semibold" for="fObsF">Observaciones adicionales</label>
                            <textarea id="fObsF" name="observaciones" class="form-control" rows="2"
                                      placeholder="Opcional..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" data-no-double-click>
                            <i class="bi bi-receipt me-1"></i>Crear factura
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
