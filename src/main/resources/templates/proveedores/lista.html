<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Proveedores</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/proveedores/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nuevo proveedor
            </a>
        </div>
    </div>

    <form class="filter-bar mb-3" method="get" th:action="@{/web/proveedores}">
        <div class="filter-bar-search">
            <label for="prov-search" class="visually-hidden">Buscar proveedores</label>
            <i class="bi bi-search"></i>
            <input id="prov-search" type="search" name="q" class="form-control form-control-sm"
                   placeholder="Nombre, CIF o código..." th:value="${q}" autocomplete="off">
        </div>
        <div class="filter-bar-actions">
            <button class="btn btn-outline-primary btn-sm">
                <i class="bi bi-funnel me-1"></i>Filtrar
            </button>
            <a th:href="@{/web/proveedores}" class="btn btn-ghost btn-sm">Limpiar</a>
        </div>
    </form>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>CIF</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th style="width:130px;"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(proveedores)}">
                        <td colspan="6" class="empty-state">
                            <i class="bi bi-person-badge"></i>
                            <div>No hay proveedores registrados</div>
                            <small th:if="${q != null and !q.isEmpty()}">Prueba con otros términos de búsqueda</small>
                        </td>
                    </tr>
                    <tr th:each="p : ${proveedores}">
                        <td class="fw-medium" th:text="${p.codigo}"></td>
                        <td th:text="${p.nombre}"></td>
                        <td class="text-muted" th:text="${p.cif ?: '—'}"></td>
                        <td class="text-muted" th:text="${p.telefono ?: '—'}"></td>
                        <td class="text-muted small" th:text="${p.email ?: '—'}"></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/web/proveedores/{id}(id=${p.id})}"
                               class="btn btn-ghost btn-sm" title="Ver">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/web/proveedores/{id}/editar(id=${p.id})}"
                               class="btn btn-ghost btn-sm" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/web/proveedores/{id}/eliminar(id=${p.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-ghost btn-sm text-danger" title="Eliminar"
                                        data-confirm="¿Eliminar este proveedor? Si tiene documentos asociados no se podrá borrar.">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/proveedores')}"></div>
</div>
