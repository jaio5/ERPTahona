<div th:fragment="content">
    <div class="topbar">
        <h4 th:text="${titulo}">Proveedores</h4>
        <a th:href="@{/web/proveedores/nuevo}" class="btn btn-success btn-sm">+ Nuevo</a>
    </div>
    <div th:if="${exito}" class="alert alert-success py-2" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
    <div class="row g-2 mb-3"><div class="col-md-5"><form class="d-flex gap-2"><input type="search" name="q" class="form-control form-control-sm" placeholder="Buscar..." th:value="${q}"><button class="btn btn-outline-primary btn-sm">Filtrar</button></form></div></div>
    <div class="table-card">
        <table class="table table-hover">
            <thead><tr><th>Código</th><th>Nombre</th><th>CIF</th><th>Teléfono</th><th>Email</th><th style="width:100px;"></th></tr></thead>
            <tbody>
                <tr th:each="p : ${proveedores}">
                    <td th:text="${p.codigo}"></td><td th:text="${p.nombre}"></td>
                    <td th:text="${p.cif}"></td><td th:text="${p.telefono}"></td>
                    <td th:text="${p.email}"></td>
                    <td><a th:href="@{/web/proveedores/{id}(id=${p.id})}" class="btn btn-outline-secondary btn-sm">Ver</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
