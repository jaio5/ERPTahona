<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${proveedor.nombre}">Proveedor</h1>
            <p>
                <span class="badge-estado"
                      th:classappend="${proveedor.activo != false} ? 'badge-estado-ok' : 'badge-estado-neutro'"
                      th:text="${proveedor.activo != false ? 'Activo' : 'Inactivo'}">Activo</span>
                <span th:text="${proveedor.codigo}">P001</span>
            </p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/proveedores}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
            </a>
            <a th:href="@{/web/proveedores/{id}/editar(id=${proveedor.id})}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-pencil me-1" aria-hidden="true"></i>Editar proveedor
            </a>
        </div>
    </div>

    <div class="doc-card">
        <div class="doc-card-header">
            <div class="doc-header-icon" aria-hidden="true"><i class="bi bi-truck"></i></div>
            <div>
                <div class="doc-card-title" th:text="${proveedor.nombreComercial ?: proveedor.nombre}">Proveedor</div>
                <div class="doc-card-meta" th:text="${proveedor.cif ?: 'Sin CIF registrado'}">B03000000</div>
            </div>
        </div>

        <section class="form-section">
            <h2 class="form-section-title"><i class="bi bi-info-circle" aria-hidden="true"></i>Datos generales</h2>
            <div class="doc-fields">
                <table class="doc-table">
                    <tr>
                        <th scope="row">Código</th>
                        <td th:text="${proveedor.codigo ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">CIF / NIF</th>
                        <td th:text="${proveedor.cif ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Nombre comercial</th>
                        <td th:text="${proveedor.nombreComercial ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Persona de contacto</th>
                        <td th:text="${proveedor.personaContacto ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Teléfono</th>
                        <td th:text="${proveedor.telefono ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Email</th>
                        <td th:text="${proveedor.email ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Web</th>
                        <td th:text="${proveedor.web ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Estado</th>
                        <td>
                            <span class="badge-estado"
                                  th:classappend="${proveedor.activo != false} ? 'badge-estado-ok' : 'badge-estado-neutro'"
                                  th:text="${proveedor.activo != false ? 'Activo' : 'Inactivo'}">Activo</span>
                        </td>
                    </tr>
                </table>
            </div>
        </section>

        <section class="form-section">
            <h2 class="form-section-title"><i class="bi bi-geo-alt" aria-hidden="true"></i>Dirección y pagos</h2>
            <div class="doc-fields">
                <table class="doc-table">
                    <tr>
                        <th scope="row">Dirección</th>
                        <td th:text="${proveedor.direccion ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">C.P. / Población</th>
                        <td th:text="${proveedor.codigoPostal == null and proveedor.poblacion == null ? '—' : (proveedor.codigoPostal ?: '') + ' ' + (proveedor.poblacion ?: '')}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Forma de pago</th>
                        <td th:text="${proveedor.formaPago ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Días de pago</th>
                        <td th:text="${proveedor.diasPago != null ? proveedor.diasPago + ' días' : '—'}">30 días</td>
                    </tr>
                    <tr>
                        <th scope="row">IBAN</th>
                        <td th:text="${proveedor.iban ?: '—'}">—</td>
                    </tr>
                    <tr th:if="${proveedor.notas}">
                        <th scope="row">Notas</th>
                        <td class="text-muted" th:text="${proveedor.notas}"></td>
                    </tr>
                </table>
            </div>
        </section>
    </div>
</div>
