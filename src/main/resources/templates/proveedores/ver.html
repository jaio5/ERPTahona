<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${proveedor.nombre}">Proveedor</h4>
            <p>
                <span class="badge-status"
                      th:attr="data-status=${proveedor.activo ? 'activo' : 'anulada'}"
                      th:text="${proveedor.activo ? 'Activo' : 'Inactivo'}">Activo</span>
                <span class="text-muted small ms-2" th:text="${proveedor.codigo}"></span>
            </p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/proveedores/{id}/editar(id=${proveedor.id})}" class="btn btn-ghost btn-sm">
                <i class="bi bi-pencil me-1"></i>Editar
            </a>
            <a th:href="@{/web/proveedores}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="form-card">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="doc-header-icon">
                        <i class="bi bi-building-check"></i>
                    </div>
                    <div>
                        <div class="fw-bold fs-5" th:text="${proveedor.nombre}">Proveedor</div>
                        <div class="text-muted small" th:text="${proveedor.cif ?: ''}"></div>
                    </div>
                </div>

                <div class="form-section-title">
                    <i class="bi bi-info-circle"></i> Datos generales
                </div>
                <div class="doc-fields">
                    <table class="doc-table mb-4">
                    <tr>
                        <th scope="row">Código</th>
                        <td th:text="${proveedor.codigo ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">CIF / NIF</th>
                        <td th:text="${proveedor.cif ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Nombre comercial</th>
                        <td th:text="${proveedor.nombreComercial ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Persona de contacto</th>
                        <td th:text="${proveedor.personaContacto ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Teléfono</th>
                        <td th:text="${proveedor.telefono ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Email</th>
                        <td th:text="${proveedor.email ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Web</th>
                        <td th:text="${proveedor.web ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Estado</th>
                        <td>
                            <span class="badge-status"
                                  th:attr="data-status=${proveedor.activo ? 'activo' : 'anulada'}"
                                  th:text="${proveedor.activo ? 'Activo' : 'Inactivo'}">—</span>
                        </td>
                    </tr>
                    </table>
                </div>

                <div class="form-section-title">
                    <i class="bi bi-geo-alt"></i> Dirección y pagos
                </div>
                <div class="doc-fields">
                    <table class="doc-table">
                    <tr>
                        <th scope="row">Dirección</th>
                        <td th:text="${proveedor.direccion ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">C.P. / Población</th>
                        <td th:text="${(proveedor.codigoPostal ?: '') + ' ' + (proveedor.poblacion ?: '')}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Forma de pago</th>
                        <td th:text="${proveedor.formaPago ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">Días de pago</th>
                        <td th:text="${proveedor.diasPago ?: '—'}">—</td>
                    </tr>
                    <tr>
                        <th scope="row">IBAN</th>
                        <td th:text="${proveedor.iban ?: '—'}">—</td>
                    </tr>
                    <tr th:if="${proveedor.notas}">
                        <th scope="row">Notas</th>
                        <td class="text-muted" th:text="${proveedor.notas}"></td>
                    </tr>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="form-card">
                <div class="doc-field-label mb-3">Acciones</div>
                <div class="d-grid gap-2">
                    <a th:href="@{/web/proveedores/{id}/editar(id=${proveedor.id})}" class="btn btn-outline-primary">
                        <i class="bi bi-pencil me-2"></i>Editar proveedor
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
