<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/400.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/600.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/700.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/tema.js}"></script>
    <title th:text="${titulo != null ? titulo + ' | ERP Tahona' : (status != null ? status + ' | ERP Tahona' : 'Error | ERP Tahona')}">Error</title>
</head>
<body>
<main class="status-page">
    <div class="status-card">
        <div class="status-code" th:with="cod=${codigo} ?: ${status}"
             th:text="${cod} ?: '500'">500</div>
        <h1 class="status-title" th:with="msg=${mensaje} ?: ${error}"
            th:text="${msg} ?: 'Ha ocurrido un error inesperado'">Error interno</h1>
        <p class="status-path" th:with="ruta=${url} ?: ${path}" th:text="${ruta}"></p>
        <pre class="status-detail" th:if="${message != null and message != ''}" th:text="${message}"></pre>
        <div class="status-actions">
            <a th:href="@{/web/dashboard}" class="btn btn-primary">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver al panel
            </a>
            <!-- Sin href="javascript:…" (lo bloquea la CSP): app.js gestiona data-history-back -->
            <a th:href="@{/web/dashboard}" class="btn btn-outline-secondary" data-history-back>Volver atrás</a>
        </div>
    </div>
</main>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}"></script>
</body>
</html>
