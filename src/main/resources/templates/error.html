<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link href="/css/app.css" rel="stylesheet">
    <title th:text="${titulo != null ? titulo + ' | ERP Tahona' : (status != null ? status + ' | ERP Tahona' : 'Error | ERP Tahona')}">Error</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;font-family:system-ui,sans-serif;">
<div class="text-center" style="max-width:600px;padding:2rem;">
    <div th:with="cod=${codigo} ?: ${status}"
         style="font-size:5rem;font-weight:700;color:#dc2626;line-height:1;"
         th:text="${cod} ?: '500'">500</div>
    <h4 th:with="msg=${mensaje} ?: ${error}"
        style="margin:1rem 0 0.5rem;color:#1e293b;"
        th:text="${msg} ?: 'Ha ocurrido un error inesperado'">Error interno</h4>
    <p th:with="ruta=${url} ?: ${path}"
       style="color:#64748b;font-size:0.875rem;"
       th:text="${ruta}"></p>
    <div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;">
        <a th:href="@{/web/dashboard}" style="display:inline-block;padding:0.5rem 1.25rem;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;font-size:0.875rem;">← Volver al panel</a>
        <a href="javascript:history.back()" style="display:inline-block;padding:0.5rem 1.25rem;background:#f1f5f9;color:#374151;border-radius:6px;text-decoration:none;font-size:0.875rem;border:1px solid #e2e8f0;">Volver atrás</a>
    </div>
</div>
</body></html>
