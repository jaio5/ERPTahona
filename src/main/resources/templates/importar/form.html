<div th:fragment="content">
    <div class="topbar"><h4 th:text="${titulo}"></h4></div>
    <div class="row g-4">
        <div class="col-md-6"><div class="form-card">
            <h5 class="mb-3">Importar clientes</h5>
            <p class="text-muted small">Formato CSV con columnas: código;nombre;CIF;teléfono;email;dirección;población</p>
            <form th:action="@{/web/importar/clientes}" method="post" enctype="multipart/form-data">
                <input type="file" name="archivo" class="form-control mb-2" accept=".csv">
                <button class="btn btn-primary btn-sm">Importar clientes</button>
            </form></div>
        </div>
        <div class="col-md-6"><div class="form-card">
            <h5 class="mb-3">Importar artículos</h5>
            <p class="text-muted small">Formato CSV: código;nombre;PVP;IVA;categoría;alérgenos</p>
            <form th:action="@{/web/importar/articulos}" method="post" enctype="multipart/form-data">
                <input type="file" name="archivo" class="form-control mb-2" accept=".csv">
                <button class="btn btn-primary btn-sm">Importar artículos</button>
            </form></div>
        </div>
    </div>
    <div th:if="${resultado}" class="mt-4"><div class="form-card">
        <h5>Resultado de importación</h5>
        <p th:text="'Total: ' + ${resultado.total()} + ' | OK: ' + ${resultado.ok()} + ' | Errores: ' + ${resultado.errores()}"></p>
        <ul th:if="${!resultado.mensajes().isEmpty()}"><li th:each="msg : ${resultado.mensajes()}" th:text="${msg}" class="text-danger small"></li></ul>
    </div></div>
</div>
