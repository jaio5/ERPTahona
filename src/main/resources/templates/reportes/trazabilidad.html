<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Trazabilidad</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/reportes}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="stat-card"><div class="stat-label">Total lotes</div><div class="stat-value" th:text="${totalLotes}">0</div></div></div>
        <div class="col-md-4"><div class="stat-card"><div class="stat-label">Caducados</div><div class="stat-value" style="color:#dc2626;" th:text="${caducados}">0</div></div></div>
        <div class="col-md-4"><div class="stat-card"><div class="stat-label">Por caducar (7d)</div><div class="stat-value" style="color:#d97706;" th:text="${porCaducar}">0</div></div></div>
    </div>
</div>
