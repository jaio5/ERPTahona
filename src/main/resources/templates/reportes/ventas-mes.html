<div th:fragment="content">
    <div class="topbar"><h4 th:text="${titulo}"></h4><a th:href="@{/web/reportes}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="stat-card"><div class="stat-label">Total facturado</div><div class="stat-value" th:text="${#numbers.formatCurrency(totalVentas)}">0 €</div><div class="stat-sub" th:text="${mes}"></div></div></div>
        <div class="col-md-3"><div class="stat-card"><div class="stat-label">Nº facturas</div><div class="stat-value" th:text="${numFacturas}">0</div><div class="stat-sub">emitidas este mes</div></div></div>
        <div class="col-md-3"><div class="stat-card"><div class="stat-label">Ticket medio</div><div class="stat-value" th:text="${numFacturas > 0 ? #numbers.formatCurrency(totalVentas.divide(java.math.BigDecimal.valueOf(numFacturas), 2, java.math.RoundingMode.HALF_UP)) : '0 €'}"></div><div class="stat-sub">por factura</div></div></div>
        <div class="col-md-3"><div class="stat-card"><div class="stat-label">Media diaria</div><div class="stat-value" th:text="${#numbers.formatCurrency(totalVentas.divide(java.math.BigDecimal.valueOf(java.time.YearMonth.now().lengthOfMonth()), 2, java.math.RoundingMode.HALF_UP))}"></div><div class="stat-sub">facturación por día</div></div></div>
    </div>
    <div class="row g-3">
        <div class="col-md-8"><div class="table-card"><h6 class="p-3 mb-0">Top 10 clientes</h6><table class="table table-sm"><thead><tr><th>Cliente</th><th class="text-end">Facturado</th></tr></thead><tbody><tr th:each="e : ${porCliente}"><td th:text="${e.key}"></td><td class="text-end" th:text="${#numbers.formatCurrency(e.value)}"></td></tr></tbody></table></div></div>
        <div class="col-md-4"><div class="table-card"><h6 class="p-3 mb-0">Ventas por día</h6><table class="table table-sm"><thead><tr><th>Día</th><th class="text-end">€</th></tr></thead><tbody><tr th:each="e : ${porDia}"><td th:text="${e.key}"></td><td class="text-end" th:text="${e.value.compareTo(java.math.BigDecimal.ZERO) > 0 ? #numbers.formatCurrency(e.value) : '-'}"></td></tr></tbody></table></div></div>
    </div>
</div>
