<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Ventas del mes</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/reportes}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="stat-card"><div class="stat-label">Total facturado</div><div class="stat-value" th:text="${totalVentas != null ? #numbers.formatCurrency(totalVentas) : '0,00 €'}">0 €</div><div class="stat-sub" th:text="${mes}"></div></div></div>
        <div class="col-md-3"><div class="stat-card"><div class="stat-label">Nº facturas</div><div class="stat-value" th:text="${numFacturas}">0</div><div class="stat-sub">emitidas este mes</div></div></div>
        <div class="col-md-3"><div class="stat-card"><div class="stat-label">Ticket medio</div><div class="stat-value" th:text="${ticketMedio != null ? #numbers.formatCurrency(ticketMedio) : '0,00 €'}"></div><div class="stat-sub">por factura</div></div></div>
        <div class="col-md-3"><div class="stat-card"><div class="stat-label">Media diaria</div><div class="stat-value" th:text="${mediaDiaria != null ? #numbers.formatCurrency(mediaDiaria) : '0,00 €'}"></div><div class="stat-sub">facturación por día</div></div></div>
    </div>
    <div class="row g-3">
        <div class="col-md-8"><div class="table-card"><h6 class="p-3 mb-0">Top 10 clientes</h6><div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Cliente</th><th class="text-end">Facturado</th></tr></thead><tbody><tr th:each="e : ${porCliente}"><td th:text="${e.key}"></td><td class="text-end" th:text="${e.value != null ? #numbers.formatCurrency(e.value) : '—'}"></td></tr></tbody></table></div></div></div>
        <div class="col-md-4"><div class="table-card"><h6 class="p-3 mb-0">Ventas por día</h6><div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Día</th><th class="text-end">€</th></tr></thead><tbody><tr th:each="e : ${porDia}"><td th:text="${e.key}"></td><td class="text-end" th:text="${e.value != null and e.value.signum() > 0 ? #numbers.formatCurrency(e.value) : '-'}"></td></tr></tbody></table></div></div></div>
    </div>
</div>
