<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/400.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/600.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/700.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/tema.js}"></script>
    <title>Acceso denegado | ERP Tahona</title>
</head>
<body>
    <main class="status-page">
        <div class="status-card">
            <div class="status-icon" aria-hidden="true">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h1 class="status-title">Acceso denegado</h1>
            <p class="status-text">
                No tienes permiso para realizar esta acción.<br>
                Contacta con el administrador si crees que es un error.
            </p>
            <div class="status-actions">
                <a th:href="@{/web/dashboard}" class="btn btn-primary">
                    <i class="bi bi-house me-1" aria-hidden="true"></i>Volver al inicio
                </a>
            </div>
        </div>
    </main>
</body>
</html>
