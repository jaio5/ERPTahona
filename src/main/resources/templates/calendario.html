<div th:fragment="content" x-data="calendarioApp" x-cloak>
    <div class="page-header">
        <div class="page-header-title">
            <h1>Calendario semanal</h1>
            <p>Pedidos y producción de la semana del <span x-text="rangoTexto"></span></p>
        </div>
        <div class="page-header-actions">
            <button type="button" class="btn btn-ghost btn-sm btn-icon" @click="cambiarSemana(-1)"
                    aria-label="Semana anterior" title="Semana anterior">
                <i class="bi bi-chevron-left" aria-hidden="true"></i>
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" @click="irHoy()">Hoy</button>
            <button type="button" class="btn btn-ghost btn-sm btn-icon" @click="cambiarSemana(1)"
                    aria-label="Semana siguiente" title="Semana siguiente">
                <i class="bi bi-chevron-right" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- Leyenda: el tipo se distingue por icono además de por color -->
    <p class="small text-muted mb-3">
        <i class="bi bi-bag me-1" aria-hidden="true"></i>Pedido
        <i class="bi bi-gear ms-3 me-1" aria-hidden="true"></i>Producción
    </p>

    <!-- 7 columnas en escritorio, 2 en tablet vertical, 1 en móvil -->
    <div class="row g-2">
        <template x-for="dia in dias" :key="dia.fecha">
            <div class="col-12 col-sm-6 col-lg">
                <section class="card h-100" :class="{'border-primary': dia.esHoy}"
                         :aria-label="dia.nombreDia + ' ' + dia.numero + (dia.esHoy ? ', hoy' : '')">
                    <div class="card-header text-center py-2" :class="{'bg-primary text-white': dia.esHoy}">
                        <div class="small text-uppercase" x-text="dia.nombreDia"></div>
                        <div class="fw-bold" x-text="dia.numero"></div>
                    </div>
                    <div class="card-body p-2 d-grid gap-1 align-content-start cal-dia-body">
                        <template x-for="ev in dia.eventos" :key="ev.id + ev.tipo">
                            <button type="button" class="btn cal-evento"
                                    :class="ev.tipo === 'PEDIDO' ? 'bg-info-subtle text-info-emphasis' : 'bg-warning-subtle text-warning-emphasis'"
                                    @click="abrirEvento(ev)">
                                <span class="d-block fw-semibold small">
                                    <i class="bi me-1" :class="ev.tipo === 'PEDIDO' ? 'bi-bag' : 'bi-gear'" aria-hidden="true"></i><span x-text="ev.tipo === 'PEDIDO' ? 'Pedido' : 'Producción'"></span>
                                </span>
                                <span class="d-block small text-break" x-text="ev.titulo"></span>
                                <span class="badge-status mt-1" :data-status="ev.estado" x-text="ev.estado" x-show="ev.estado"></span>
                            </button>
                        </template>
                        <div x-show="dia.eventos.length === 0" class="text-muted text-center small py-3">Sin eventos</div>
                    </div>
                </section>
            </div>
        </template>
    </div>

    <script th:attr="nonce=${cspNonce}">
        document.addEventListener('alpine:init', function () {
            Alpine.data('calendarioApp', function () {
                return {
                inicioSemana: null,
                dias: [],
                rangoTexto: '',
                init() { this.irHoy(); },
                irHoy() {
                    const hoy = new Date();
                    const diaSemana = hoy.getDay(); // 0=domingo
                    const diff = hoy.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
                    this.inicioSemana = new Date(hoy.setDate(diff));
                    this.cargar();
                },
                cambiarSemana(delta) {
                    this.inicioSemana.setDate(this.inicioSemana.getDate() + delta * 7);
                    this.cargar();
                },
                abrirEvento(evento) {
                    window.location.assign(evento.url);
                },
                // AAAA-MM-DD -> DD/MM/AAAA para mostrar
                fechaEs(iso) {
                    const p = iso.split('-');
                    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
                },
                cargar() {
                    const inicioStr = this.inicioSemana.toISOString().split('T')[0];
                    const fin = new Date(this.inicioSemana);
                    fin.setDate(fin.getDate() + 6);
                    const finStr = fin.toISOString().split('T')[0];
                    this.rangoTexto = `${this.fechaEs(inicioStr)} al ${this.fechaEs(finStr)}`;

                    fetch(`/api/web/calendario?inicio=${inicioStr}&fin=${finStr}`)
                        .then(r => r.json())
                        .then(eventos => {
                            const nombres = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
                            this.dias = [];
                            const hoyStr = new Date().toISOString().split('T')[0];
                            for (let i = 0; i < 7; i++) {
                                const d = new Date(this.inicioSemana);
                                d.setDate(d.getDate() + i);
                                const fechaStr = d.toISOString().split('T')[0];
                                this.dias.push({
                                    fecha: fechaStr,
                                    nombreDia: nombres[i],
                                    numero: d.getDate(),
                                    esHoy: fechaStr === hoyStr,
                                    eventos: eventos.filter(e => e.fecha === fechaStr)
                                });
                            }
                        });
                }
                };
            });
        });
    </script>
</div>
