<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Artículos</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/articulos/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nuevo artículo
            </a>
        </div>
    </div>

    <form class="filter-bar mb-3" method="get" th:action="@{/web/articulos}">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="dir"  th:value="${dir}">
        <div class="filter-bar-search">
            <label for="articulos-search" class="visually-hidden">Buscar artículos</label>
            <i class="bi bi-search"></i>
            <input id="articulos-search" type="search" name="q" class="form-control form-control-sm"
                   placeholder="Nombre o código..." th:value="${q}" autocomplete="off">
        </div>
        <div class="filter-bar-actions">
            <button class="btn btn-outline-primary btn-sm">
                <i class="bi bi-funnel me-1"></i>Filtrar
            </button>
            <a th:href="@{/web/articulos}" class="btn btn-ghost btn-sm">Limpiar</a>
            <span class="text-muted small" th:if="${page != null}">
                <span th:text="${page.totalElements}">0</span> artículos
            </span>
        </div>
    </form>

    <div class="table-card">
        <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>
                        <a th:href="@{/web/articulos(q=${q},sort='nombre',dir=${sort == 'nombre' and dir == 'asc' ? 'desc' : 'asc'})}"
                           class="text-decoration-none text-body d-flex align-items-center gap-1">
                            Nombre
                            <i class="bi" th:classappend="${sort == 'nombre'} ? (${dir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up opacity-25'"></i>
                        </a>
                    </th>
                    <th>IVA</th>
                    <th class="text-end">
                        <a th:href="@{/web/articulos(q=${q},sort='pvp',dir=${sort == 'pvp' and dir == 'asc' ? 'desc' : 'asc'})}"
                           class="text-decoration-none text-body d-flex align-items-center justify-content-end gap-1">
                            PVP
                            <i class="bi" th:classappend="${sort == 'pvp'} ? (${dir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up opacity-25'"></i>
                        </a>
                    </th>
                    <th class="text-end">Stock</th>
                    <th>Alérgenos</th>
                    <th style="width:80px;"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(articulos)}">
                    <td colspan="7" class="empty-state">
                        <i class="bi bi-box-seam"></i>
                        <div>No hay artículos</div>
                        <small th:if="${q != null and !q.isEmpty()}">Prueba con otros términos de búsqueda</small>
                    </td>
                </tr>
                <tr th:each="a : ${articulos}">
                    <td class="text-muted small" th:text="${a.codigo}"></td>
                    <td><a th:href="@{/web/articulos/{id}(id=${a.id})}" class="fw-medium text-decoration-none" th:text="${a.nombre}"></a></td>
                    <td class="text-muted small" th:text="${a.iva} + '%'"></td>
                    <td class="text-end fw-medium" th:text="${a.pvp != null ? #numbers.formatCurrency(a.pvp) : '-'}"></td>
                    <td class="text-end" th:text="${a.stock}"></td>
                    <td class="text-muted small" th:text="${a.alergenos}"></td>
                    <td class="text-end">
                        <div class="d-flex gap-1 justify-content-end">
                            <a th:href="@{/web/articulos/{id}(id=${a.id})}" class="btn btn-ghost btn-sm"
                               th:attr="aria-label='Ver artículo ' + ${a.nombre}" title="Ver">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/web/articulos/{id}/editar(id=${a.id})}" class="btn btn-ghost btn-sm"
                               th:attr="aria-label='Editar artículo ' + ${a.nombre}" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/articulos')}"></div>
</div>
