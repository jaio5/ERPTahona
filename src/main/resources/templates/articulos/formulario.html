<div th:fragment="content">
    <div class="topbar"><h4 th:text="${titulo}"></h4><a th:href="@{/web/articulos}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <div class="form-card" style="max-width:600px;">
        <form th:action="@{/web/articulos}" method="post">
            <input type="hidden" name="id" th:value="${articulo?.id}">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Código *</label><input type="text" name="codigo" class="form-control" th:value="${articulo?.codigo}" required></div>
                <div class="col-md-6"><label class="form-label">Nombre *</label><input type="text" name="nombre" class="form-control" th:value="${articulo?.nombre}" required></div>
                <div class="col-md-6"><label class="form-label">Categoría</label><input type="text" name="categoria" class="form-control" th:value="${articulo?.categoria}"></div>
                <div class="col-md-3"><label class="form-label">PVP</label><input type="number" step="0.01" name="pvp" class="form-control" th:value="${articulo?.pvp}"></div>
                <div class="col-md-3"><label class="form-label">IVA (%)</label><input type="number" step="0.01" name="iva" class="form-control" th:value="${articulo?.iva}"></div>
                <div class="col-md-6"><label class="form-label">Stock</label><input type="number" step="0.01" name="stock" class="form-control" th:value="${articulo?.stock}"></div>
                <div class="col-md-6"><label class="form-label">Alérgenos</label><input type="text" name="alergenos" class="form-control" th:value="${articulo?.alergenos}" placeholder="Gluten, Leche, Huevos..."></div>
            </div>
            <div class="mt-4"><button type="submit" class="btn btn-primary">Guardar</button><a th:href="@{/web/articulos}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
        </form>
    </div>
</div>
