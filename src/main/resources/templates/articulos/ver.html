<div th:fragment="content">
    <div class="topbar"><h4 th:text="${articulo.nombre}"></h4><a th:href="@{/web/articulos}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <div class="form-card" style="max-width:600px;">
        <div class="row g-3">
            <div class="col-md-4"><small class="text-muted">Código</small><h6 th:text="${articulo.codigo}"></h6></div>
            <div class="col-md-4"><small class="text-muted">Categoría</small><h6 th:text="${articulo.categoria} ?: '-'"></h6></div>
            <div class="col-md-4"><small class="text-muted">Unidad</small><h6 th:text="${articulo.unidad} ?: '-'"></h6></div>
            <div class="col-md-4"><small class="text-muted">PVP</small><h6 th:text="${articulo.pvp != null ? #numbers.formatCurrency(articulo.pvp) : '-'}"></h6></div>
            <div class="col-md-4"><small class="text-muted">IVA</small><h6 th:text="${articulo.iva != null ? articulo.iva + '%' : '-'}"></h6></div>
            <div class="col-md-4"><small class="text-muted">Stock</small><h6 th:text="${articulo.stock} ?: '0'"></h6></div>
            <div class="col-12"><small class="text-muted">Alérgenos</small><h6 th:text="${articulo.alergenos} ?: 'No declarados'" class="text-danger"></h6></div>
        </div>
    </div>
</div>
