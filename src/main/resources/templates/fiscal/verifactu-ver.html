<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title"><h4 th:text="${titulo}">Evidencia VERI*FACTU</h4></div>
        <div class="page-header-actions"><a th:href="@{/web/verifactu}" class="btn btn-ghost btn-sm">Volver</a></div>
    </div>
    <div class="form-card mb-3"><div class="row g-3">
        <div class="col-md-3"><small class="text-muted">Factura</small><h6 th:text="${evidencia.facturaId}"></h6></div>
        <div class="col-md-3"><small class="text-muted">Serie / número</small><h6 th:text="${(evidencia.serie ?: '—') + ' / ' + (evidencia.numero ?: '—')}"></h6></div>
        <div class="col-md-3"><small class="text-muted">Estado</small><h6><span class="badge-status" th:attr="data-status=${evidencia.estado?.toLowerCase()}" th:text="${evidencia.estado ?: '—'}"></span></h6></div>
        <div class="col-md-3"><small class="text-muted">Cadena</small><h6 th:class="${cadenaValida ? 'text-success' : 'text-danger'}" th:text="${cadenaValida ? 'Íntegra' : 'No validada'}"></h6></div>
        <div class="col-md-4"><small class="text-muted">Tipo registro</small><h6 th:text="${evidencia.tipoRegistro ?: '—'}"></h6></div>
        <div class="col-md-4"><small class="text-muted">Código AEAT</small><h6 th:text="${evidencia.codigoRespuestaAEAT ?: '—'}"></h6></div>
        <div class="col-md-4"><small class="text-muted">Envío</small><h6 th:text="${evidencia.fechaEnvio != null ? #temporals.format(evidencia.fechaEnvio, 'dd/MM/yyyy HH:mm') : '—'}"></h6></div>
        <div class="col-12"><small class="text-muted">Hash</small><code class="d-block text-break" th:text="${evidencia.hash}"></code></div>
        <div class="col-12"><small class="text-muted">Hash anterior</small><code class="d-block text-break" th:text="${evidencia.hashAnterior ?: '—'}"></code></div>
        <div class="col-12" th:if="${evidencia.errorMessage}"><div class="alert alert-danger mb-0" th:text="${evidencia.errorMessage}"></div></div>
    </div></div>
    <div class="d-flex gap-2">
        <form th:action="@{/web/verifactu/{id}/reenviar(id=${evidencia.id})}" method="post"><button class="btn btn-outline-primary btn-sm">Reenviar</button></form>
        <form th:action="@{/web/verifactu/{id}/verificar(id=${evidencia.id})}" method="post"><button class="btn btn-primary btn-sm">Verificar estado</button></form>
    </div>
</div>
