<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title"><h4 th:text="${titulo}">Evidencias VERI*FACTU</h4></div>
        <div class="page-header-actions">
            <span class="badge text-bg-warning" th:text="${pendientes} + ' pendientes'"></span>
            <span class="badge text-bg-danger" th:text="${erroresCount} + ' errores'"></span>
        </div>
    </div>
    <form method="get" th:action="@{/web/verifactu}" class="filter-bar mb-3">
        <div class="filter-bar-search"><i class="bi bi-search"></i><input type="search" name="q" class="form-control form-control-sm" placeholder="Serie, número o factura..." th:value="${q}"></div>
        <div class="filter-bar-filters"><select name="estado" class="form-select form-select-sm">
            <option value="">Todos los estados</option>
            <option value="PENDIENTE" th:selected="${estado == 'PENDIENTE'}">Pendiente</option>
            <option value="ENVIADO" th:selected="${estado == 'ENVIADO'}">Enviado</option>
            <option value="VERIFICADO" th:selected="${estado == 'VERIFICADO'}">Verificado</option>
            <option value="ERROR" th:selected="${estado == 'ERROR'}">Error</option>
        </select></div>
        <div class="filter-bar-actions"><button class="btn btn-outline-primary btn-sm">Filtrar</button><a th:href="@{/web/verifactu}" class="btn btn-ghost btn-sm">Limpiar</a></div>
    </form>
    <div class="table-card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>Factura</th><th>Serie / número</th><th>Generación</th><th>Estado</th><th>Código AEAT</th><th></th></tr></thead>
        <tbody>
        <tr th:if="${evidencias.empty}"><td colspan="6" class="empty-state"><i class="bi bi-shield-check"></i><div>No hay evidencias</div></td></tr>
        <tr th:each="e : ${evidencias.content}">
            <td th:text="${e.facturaId}"></td>
            <td><span th:text="${e.serie ?: '—'}"></span> / <span th:text="${e.numero ?: '—'}"></span></td>
            <td class="small text-muted" th:text="${e.fechaGeneracionRegistro != null ? #temporals.format(e.fechaGeneracionRegistro, 'dd/MM/yyyy HH:mm') : '—'}"></td>
            <td><span class="badge-status" th:attr="data-status=${e.estado?.toLowerCase()}" th:text="${e.estado ?: '—'}"></span></td>
            <td th:text="${e.codigoRespuestaAEAT ?: '—'}"></td>
            <td class="text-end"><a th:href="@{/web/verifactu/{id}(id=${e.id})}" class="btn btn-ghost btn-sm"><i class="bi bi-eye"></i></a></td>
        </tr>
        </tbody>
    </table></div></div>
    <div th:replace="~{fragments/pagination :: paginacion(${evidencias}, '/web/verifactu')}"></div>
</div>
