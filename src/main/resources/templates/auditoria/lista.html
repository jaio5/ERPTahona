<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Auditoría</h1>
            <p>Últimas acciones registradas por usuario y módulo</p>
        </div>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th class="d-none d-lg-table-cell">Módulo</th>
                        <th>Acción</th>
                        <th>Resultado</th>
                        <th class="d-none d-md-table-cell">Descripción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="6" class="empty-state">
                            <i class="bi bi-shield-check" aria-hidden="true"></i>
                            <div class="empty-state-title">No hay registros de auditoría</div>
                            <small class="empty-state-hint">Aquí aparecen accesos, cambios e impresiones de documentos.</small>
                        </td>
                    </tr>
                    <tr th:each="r : ${registros}">
                        <td class="text-muted" th:text="${r.fecha != null ? #temporals.format(r.fecha, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                        <td th:text="${r.usuarioNombre}"></td>
                        <td class="text-muted d-none d-lg-table-cell" th:text="${r.modulo ?: (r.entidadTipo ?: '—')}"></td>
                        <td th:text="${r.tipoAccion}"></td>
                        <!-- EXITO y ERROR tienen familia propia en la guía; el resto, neutro -->
                        <td><span class="badge-status"
                                  th:attr="data-status=${r.resultado == 'EXITO' or r.resultado == 'ERROR' ? r.resultado : 'borrador'}"
                                  th:text="${r.resultado}"></span></td>
                        <td class="td-wrap d-none d-md-table-cell" th:text="${r.descripcion}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/auditoria')}"></div>
</div>
