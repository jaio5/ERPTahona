<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Presupuesto</h4>
        </div>
        <div class="page-header-actions">
            <a th:if="${presupuesto.estado == 'BORRADOR'}"
               th:href="@{/web/presupuestos/{id}/editar(id=${presupuesto.id})}"
               class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil me-1"></i>Editar
            </a>
            <form th:if="${presupuesto.estado == 'ENVIADO' or presupuesto.estado == 'BORRADOR'}"
                  th:action="@{/web/presupuestos/{id}/aprobar(id=${presupuesto.id})}" method="post" class="d-inline">
                <button class="btn btn-success btn-sm" data-no-double-click>
                    <i class="bi bi-check-lg me-1"></i>Aprobar
                </button>
            </form>
            <a th:href="@{/web/presupuestos}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="form-card" style="max-width:640px;">
        <div class="row g-3">
            <div class="col-md-4"><small class="text-muted">Número</small><h6 th:text="${presupuesto.numero} ?: '-'"></h6></div>
            <div class="col-md-4"><small class="text-muted">Fecha</small><h6 th:text="${presupuesto.fecha != null ? #temporals.format(presupuesto.fecha, 'dd/MM/yyyy') : '-'}"></h6></div>
            <div class="col-md-4"><small class="text-muted">Estado</small>
                <h6><span class="badge-status" th:attr="data-status=${presupuesto.estado?.toLowerCase()}" th:text="${presupuesto.estado}"></span></h6>
            </div>
            <div class="col-md-6"><small class="text-muted">Cliente</small><h6 th:text="${presupuesto.cliente?.nombre} ?: '-'"></h6></div>
            <div class="col-md-6"><small class="text-muted">Total</small>
                <h4 class="text-primary" th:text="${presupuesto.total != null ? #numbers.formatDecimal(presupuesto.total,1,2) + ' €' : '-'}"></h4>
            </div>
            <div class="col-md-6"><small class="text-muted">Válido hasta</small><h6 th:text="${presupuesto.fechaValidez != null ? #temporals.format(presupuesto.fechaValidez, 'dd/MM/yyyy') : '-'}"></h6></div>
            <div class="col-md-6" th:if="${presupuesto.factura != null}"><small class="text-muted">Factura generada</small>
                <h6><a th:href="@{/web/facturas/{id}(id=${presupuesto.factura.id})}" th:text="${presupuesto.factura.numero}"></a></h6>
            </div>
            <div class="col-12" th:if="${presupuesto.observaciones}"><small class="text-muted">Observaciones</small><p th:text="${presupuesto.observaciones}"></p></div>
        </div>
        <div th:if="${!#lists.isEmpty(presupuesto.lineas)}" class="mt-3">
            <h6 class="mb-2">Líneas</h6>
            <table class="table table-sm">
                <thead><tr><th>Artículo</th><th>Cantidad</th><th>Precio</th></tr></thead>
                <tbody>
                    <tr th:each="l : ${presupuesto.lineas}">
                        <td th:text="${l.articulo?.nombre} ?: '-'"></td>
                        <td th:text="${l.cantidad}"></td>
                        <td th:text="${l.precioUnitario != null ? #numbers.formatDecimal(l.precioUnitario,1,2) + ' €' : '-'}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
