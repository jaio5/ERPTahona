<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Presupuesto</h4>
        </div>
        <div class="page-header-actions">
            <a th:if="${presupuesto.estado == 'BORRADOR'}"
               th:href="@{/web/presupuestos/{id}/editar(id=${presupuesto.id})}"
               class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil me-1"></i>Editar
            </a>
            <form th:if="${presupuesto.estado == 'ENVIADO' or presupuesto.estado == 'BORRADOR'}"
                  th:action="@{/web/presupuestos/{id}/aprobar(id=${presupuesto.id})}" method="post" class="d-inline">
                <button class="btn btn-success btn-sm" data-no-double-click>
                    <i class="bi bi-check-lg me-1"></i>Aprobar
                </button>
            </form>
            <a th:href="@{/web/presupuestos}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="form-card" style="max-width:640px;">
        <div class="doc-fields">
            <table class="doc-table">
            <tr>
                <th scope="row">Número</th>
                <td th:text="${presupuesto.numero} ?: '—'">—</td>
            </tr>
            <tr>
                <th scope="row">Fecha</th>
                <td th:text="${presupuesto.fecha != null ? #temporals.format(presupuesto.fecha, 'dd/MM/yyyy') : '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Cliente</th>
                <td th:text="${presupuesto.cliente?.nombre} ?: '—'">—</td>
            </tr>
            <tr>
                <th scope="row">Total</th>
                <td class="fw-bold" style="font-size:1.25rem;color:var(--brand-color);"
                     th:text="${presupuesto.total != null ? #numbers.formatDecimal(presupuesto.total,1,2) + ' €' : '—'}">—</td>
            </tr>
            <tr>
                <th scope="row">Válido hasta</th>
                <td th:text="${presupuesto.fechaValidez != null ? #temporals.format(presupuesto.fechaValidez, 'dd/MM/yyyy') : '—'}">—</td>
            </tr>
            <tr th:if="${presupuesto.factura != null}">
                <th scope="row">Factura generada</th>
                <td><a th:href="@{/web/facturas/{id}(id=${presupuesto.factura.id})}" th:text="${presupuesto.factura.numero}">—</a></td>
            </tr>
            <tr th:if="${presupuesto.observaciones}">
                <th scope="row">Observaciones</th>
                <td class="text-muted" th:text="${presupuesto.observaciones}">—</td>
            </tr>
            <tr>
                <th scope="row">Estado</th>
                <td>
                    <span class="badge-status" th:attr="data-status=${presupuesto.estado?.toLowerCase()}"
                          th:text="${presupuesto.estado}">—</span>
                </td>
            </tr>
            </table>
        </div>
        <div th:if="${!#lists.isEmpty(presupuesto.lineas)}" class="mt-3">
            <div class="form-section-title mb-2">
                <i class="bi bi-list-ul"></i> Líneas
            </div>
            <div class="table-responsive">
                <table class="table table-sm mb-0">
                    <thead><tr><th>Artículo</th><th>Cantidad</th><th>Precio</th></tr></thead>
                    <tbody>
                        <tr th:each="l : ${presupuesto.lineas}">
                            <td th:text="${l.articulo?.nombre} ?: '—'"></td>
                            <td th:text="${l.cantidad}"></td>
                            <td th:text="${l.precioUnitario != null ? #numbers.formatDecimal(l.precioUnitario,1,2) + ' €' : '—'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
