<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Presupuesto</h4>
        </div>
        <div class="page-header-actions">
            <a th:if="${presupuesto.estado == 'BORRADOR'}"
               th:href="@{/web/presupuestos/{id}/editar(id=${presupuesto.id})}"
               class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil me-1"></i>Editar
            </a>
            <form th:if="${presupuesto.estado == 'ENVIADO' or presupuesto.estado == 'BORRADOR'}"
                  th:action="@{/web/presupuestos/{id}/aprobar(id=${presupuesto.id})}" method="post" class="d-inline">
                <button class="btn btn-success btn-sm" data-no-double-click>
                    <i class="bi bi-check-lg me-1"></i>Aprobar
                </button>
            </form>
            <a th:href="@{/web/presupuestos}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>
    <div class="form-card" style="max-width:640px;">
        <div class="row g-3">
            <div class="col-md-4">
                <span class="doc-field-label">Número</span>
                <div class="doc-field-value" th:text="${presupuesto.numero} ?: '—'">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Fecha</span>
                <div class="doc-field-value" th:text="${presupuesto.fecha != null ? #temporals.format(presupuesto.fecha, 'dd/MM/yyyy') : '—'}">—</div>
            </div>
            <div class="col-md-4">
                <span class="doc-field-label">Estado</span>
                <div class="doc-field-value">
                    <span class="badge-status" th:attr="data-status=${presupuesto.estado?.toLowerCase()}"
                          th:text="${presupuesto.estado}">—</span>
                </div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Cliente</span>
                <div class="doc-field-value" th:text="${presupuesto.cliente?.nombre} ?: '—'">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Total</span>
                <div class="doc-field-value fw-bold" style="font-size:1.25rem;color:var(--brand-color);"
                     th:text="${presupuesto.total != null ? #numbers.formatDecimal(presupuesto.total,1,2) + ' €' : '—'}">—</div>
            </div>
            <div class="col-md-6">
                <span class="doc-field-label">Válido hasta</span>
                <div class="doc-field-value" th:text="${presupuesto.fechaValidez != null ? #temporals.format(presupuesto.fechaValidez, 'dd/MM/yyyy') : '—'}">—</div>
            </div>
            <div class="col-md-6" th:if="${presupuesto.factura != null}">
                <span class="doc-field-label">Factura generada</span>
                <div class="doc-field-value">
                    <a th:href="@{/web/facturas/{id}(id=${presupuesto.factura.id})}" th:text="${presupuesto.factura.numero}">—</a>
                </div>
            </div>
            <div class="col-12" th:if="${presupuesto.observaciones}">
                <span class="doc-field-label">Observaciones</span>
                <div class="doc-field-value text-muted" th:text="${presupuesto.observaciones}">—</div>
            </div>
        </div>
        <div th:if="${!#lists.isEmpty(presupuesto.lineas)}" class="mt-3">
            <div class="form-section-title mb-2">
                <i class="bi bi-list-ul"></i> Líneas
            </div>
            <div class="table-responsive">
                <table class="table table-sm mb-0">
                    <thead><tr><th>Artículo</th><th>Cantidad</th><th>Precio</th></tr></thead>
                    <tbody>
                        <tr th:each="l : ${presupuesto.lineas}">
                            <td th:text="${l.articulo?.nombre} ?: '—'"></td>
                            <td th:text="${l.cantidad}"></td>
                            <td th:text="${l.precioUnitario != null ? #numbers.formatDecimal(l.precioUnitario,1,2) + ' €' : '—'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
