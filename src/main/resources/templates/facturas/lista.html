<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Facturas</h4>
        </div>
        <div class="page-header-actions">
            <button type="button" id="btnLoteFacturas" class="btn btn-outline-primary btn-sm" disabled>
                <i class="bi bi-printer me-1"></i>Imprimir seleccionadas (<span id="loteCountFacturas">0</span>)
            </button>
            <a th:href="@{/web/facturas/nueva}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Nueva factura
            </a>
        </div>
    </div>

    <form class="filter-bar mb-3" method="get" th:action="@{/web/facturas}">
        <div class="filter-bar-search">
            <label for="facturas-search" class="visually-hidden">Buscar facturas</label>
            <i class="bi bi-search"></i>
            <input id="facturas-search" type="search" name="q" class="form-control form-control-sm"
                   placeholder="Número o cliente..." th:value="${q}" autocomplete="off">
        </div>
        <div class="filter-bar-filters">
            <label for="facturas-desde" class="visually-hidden">Fecha desde</label>
            <input id="facturas-desde" type="date" name="fechaDesde" class="form-control form-control-sm" style="width:150px;"
                   th:value="${fechaDesde}" title="Desde" aria-label="Fecha desde">
            <label for="facturas-hasta" class="visually-hidden">Fecha hasta</label>
            <input id="facturas-hasta" type="date" name="fechaHasta" class="form-control form-control-sm" style="width:150px;"
                   th:value="${fechaHasta}" title="Hasta" aria-label="Fecha hasta">
            <select name="estado" class="form-select form-select-sm" style="width:150px;" aria-label="Estado">
                <option value="">Todos los estados</option>
                <option value="BORRADOR"       th:selected="${estado == 'BORRADOR'}">Borrador</option>
                <option value="REVISION"       th:selected="${estado == 'REVISION'}">Revisión</option>
                <option value="EMITIDA"        th:selected="${estado == 'EMITIDA'}">Emitida</option>
                <option value="PAGADA"         th:selected="${estado == 'PAGADA'}">Pagada</option>
                <option value="VENCIDA"        th:selected="${estado == 'VENCIDA'}">Vencida</option>
                <option value="ANULADA"        th:selected="${estado == 'ANULADA'}">Anulada</option>
                <option value="RECTIFICADA"    th:selected="${estado == 'RECTIFICADA'}">Rectificada</option>
            </select>
            <select name="sort" class="form-select form-select-sm" style="width:120px;" aria-label="Ordenar por">
                <option value="fecha"  th:selected="${sort == 'fecha'}">Fecha</option>
                <option value="numero" th:selected="${sort == 'numero'}">Número</option>
                <option value="total"  th:selected="${sort == 'total'}">Importe</option>
            </select>
            <select name="dir" class="form-select form-select-sm" style="width:195px;" aria-label="Sentido del orden">
                <option value="desc" th:selected="${dir == 'desc'}">Más recientes primero</option>
                <option value="asc"  th:selected="${dir == 'asc'}">Más antiguos primero</option>
            </select>
        </div>
        <div class="filter-bar-actions">
            <button class="btn btn-outline-primary btn-sm">
                <i class="bi bi-funnel me-1"></i>Filtrar
            </button>
            <a th:href="@{/web/facturas}" class="btn btn-ghost btn-sm">Limpiar</a>
            <span class="text-muted small" th:if="${page != null}">
                <span th:text="${page.totalElements}">0</span> facturas
            </span>
        </div>
    </form>

    <div class="table-card">
        <div class="table-responsive">
        <table class="table table-hover mb-0" style="min-width:800px;">
            <thead>
                <tr>
                    <th style="width:36px;">
                        <input type="checkbox" id="selAllFacturas" class="form-check-input" aria-label="Seleccionar todo">
                    </th>
                    <th style="min-width:130px;">
                        <a th:href="@{/web/facturas(q=${q},estado=${estado},fechaDesde=${fechaDesde},fechaHasta=${fechaHasta},sort='numero',dir=${sort == 'numero' and dir == 'asc' ? 'desc' : 'asc'})}"
                           class="text-decoration-none text-body d-flex align-items-center gap-1">
                            Número
                            <i class="bi" th:classappend="${sort == 'numero'} ? (${dir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up opacity-25'"></i>
                        </a>
                    </th>
                    <th style="min-width:100px;">
                        <a th:href="@{/web/facturas(q=${q},estado=${estado},fechaDesde=${fechaDesde},fechaHasta=${fechaHasta},sort='fecha',dir=${sort == 'fecha' and dir == 'asc' ? 'desc' : 'asc'})}"
                           class="text-decoration-none text-body d-flex align-items-center gap-1">
                            Fecha
                            <i class="bi" th:classappend="${sort == 'fecha'} ? (${dir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up opacity-25'"></i>
                        </a>
                    </th>
                    <th style="min-width:160px;">Cliente</th>
                    <th class="text-end" style="min-width:100px;">
                        <a th:href="@{/web/facturas(q=${q},estado=${estado},fechaDesde=${fechaDesde},fechaHasta=${fechaHasta},sort='total',dir=${sort == 'total' and dir == 'asc' ? 'desc' : 'asc'})}"
                           class="text-decoration-none text-body d-flex align-items-center justify-content-end gap-1">
                            Total
                            <i class="bi" th:classappend="${sort == 'total'} ? (${dir == 'asc'} ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up opacity-25'"></i>
                        </a>
                    </th>
                    <th style="min-width:100px;">Estado</th>
                    <th style="width:120px;"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(facturas)}">
                    <td colspan="7" class="empty-state">
                        <i class="bi bi-receipt"></i>
                        <div>No hay facturas</div>
                        <small th:if="${q != null and !q.isEmpty()}">Prueba con otros términos de búsqueda</small>
                    </td>
                </tr>
                <tr th:each="f : ${facturas}">
                    <td><input type="checkbox" class="form-check-input lote-check" th:value="${f.id}"
                               th:attr="aria-label='Seleccionar factura ' + ${f.numero}"></td>
                    <td><a th:href="@{/web/facturas/{id}(id=${f.id})}" class="fw-medium text-decoration-none" th:text="${f.numero}"></a></td>
                    <td class="text-muted small" th:text="${f.fecha != null ? #temporals.format(f.fecha, 'dd/MM/yyyy') : '-'}"></td>
                    <td th:text="${f.cliente?.nombre}"></td>
                    <td class="text-end fw-medium" th:text="${f.total != null ? #numbers.formatCurrency(f.total) : '0,00 €'}"></td>
                    <td>
                        <span class="badge-status" th:attr="data-status=${f.estado?.toLowerCase()}" th:text="${f.estado}">-</span>
                    </td>
                    <td>
                        <div class="d-flex gap-1 justify-content-end">
                            <a th:href="@{/web/facturas/{id}(id=${f.id})}" class="btn btn-ghost btn-sm"
                               th:attr="aria-label='Ver factura ' + ${f.numero}" title="Ver">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:if="${f.estado == 'BORRADOR' or f.estado == 'REVISION'}"
                               th:href="@{/web/facturas/{id}/editar(id=${f.id})}" class="btn btn-ghost btn-sm"
                               th:attr="aria-label='Editar factura ' + ${f.numero}" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:if="${f.estado == 'BORRADOR'}"
                                  th:action="@{/web/facturas/{id}/revision(id=${f.id})}" method="post" class="d-inline">
                                <button class="btn btn-ghost btn-sm text-warning" data-no-double-click
                                        th:attr="aria-label='Enviar a revisión factura ' + ${f.numero}" title="Enviar a revisión">
                                    <i class="bi bi-eye-fill"></i>
                                </button>
                            </form>
                            <form th:if="${f.estado == 'REVISION'}"
                                  th:action="@{/web/facturas/{id}/emitir(id=${f.id})}" method="post" class="d-inline">
                                <button class="btn btn-ghost btn-sm text-success" data-no-double-click
                                        th:attr="aria-label='Emitir factura ' + ${f.numero}" title="Emitir">
                                    <i class="bi bi-send-check"></i>
                                </button>
                            </form>
                            <form th:if="${f.estado != null and f.estado != 'ANULADA' and f.estado != 'RECTIFICADA'}"
                                  th:action="@{/web/facturas/{id}/anular(id=${f.id})}" method="post" class="d-inline">
                                <button class="btn btn-ghost btn-sm text-danger" data-no-double-click
                                        data-confirm="¿Anular esta factura?"
                                        th:attr="aria-label='Anular factura ' + ${f.numero}" title="Anular">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/facturas')}"></div>

    <!-- Form oculto para la impresión por lotes (evita anidar formularios en la tabla) -->
    <form id="loteFormFacturas" method="post" th:action="@{/web/facturas/imprimir-lote}" style="display:none"></form>

    <script th:attr="nonce=${cspNonce}">
        (function() {
            const selAll = document.getElementById('selAllFacturas');
            const btn    = document.getElementById('btnLoteFacturas');
            const count  = document.getElementById('loteCountFacturas');
            const form   = document.getElementById('loteFormFacturas');
            if (!btn || !form) return;
            const checks = function() { return Array.prototype.slice.call(document.querySelectorAll('.lote-check')); };

            function refresh() {
                const sel = checks().filter(function(c) { return c.checked; });
                if (count) count.textContent = sel.length;
                btn.disabled = sel.length === 0;
                if (selAll) {
                    const all = checks();
                    selAll.checked = all.length > 0 && sel.length === all.length;
                    selAll.indeterminate = sel.length > 0 && sel.length < all.length;
                }
            }
            if (selAll) selAll.addEventListener('change', function() {
                checks().forEach(function(c) { c.checked = selAll.checked; });
                refresh();
            });
            document.addEventListener('change', function(e) {
                if (e.target && e.target.classList.contains('lote-check')) refresh();
            });
            btn.addEventListener('click', function() {
                const sel = checks().filter(function(c) { return c.checked; });
                if (!sel.length) return;
                // Reconstruye los ids (conserva el token CSRF que inyecta Thymeleaf)
                form.querySelectorAll('input[name="ids"]').forEach(function(i) { i.remove(); });
                sel.forEach(function(c) {
                    const hidden = document.createElement('input');
                    hidden.type = 'hidden'; hidden.name = 'ids'; hidden.value = c.value;
                    form.appendChild(hidden);
                });
                form.submit();
            });
            refresh();
        })();
    </script>
</div>
