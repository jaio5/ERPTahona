<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4>Nueva factura rectificativa</h4>
            <p class="text-muted">Sobre la factura <strong th:text="${facturaOriginal.numero}"></strong></p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/facturas/{id}(id=${facturaOriginal.id})}" class="btn btn-ghost btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </div>

    <div class="row g-4">
        <!-- Factura original -->
        <div class="col-lg-5">
            <div class="form-card h-100">
                <div class="form-section-title">
                    <i class="bi bi-receipt"></i> Factura original
                </div>
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="doc-header-icon warning">
                        <i class="bi bi-receipt"></i>
                    </div>
                    <div>
                        <div class="fw-bold fs-5" th:text="${facturaOriginal.numero}">—</div>
                        <div class="text-muted small"
                             th:text="${facturaOriginal.fecha != null ? #temporals.format(facturaOriginal.fecha,'dd/MM/yyyy') : ''}"></div>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <span class="doc-field-label">Cliente</span>
                        <div class="doc-field-value" th:text="${facturaOriginal.cliente?.nombre ?: '—'}">—</div>
                    </div>
                    <div class="col-sm-6">
                        <span class="doc-field-label">Total</span>
                        <div class="doc-field-value" style="color:var(--brand-color);"
                             th:text="${facturaOriginal.total != null ? #numbers.formatCurrency(facturaOriginal.total) : '—'}">—</div>
                    </div>
                </div>

                <div class="alert alert-warning d-flex align-items-start gap-2 mt-4 mb-0">
                    <i class="bi bi-exclamation-triangle flex-shrink-0 mt-1"></i>
                    <div class="small">
                        Se creará una factura <strong>R-...</strong> con las líneas de la original en negativo.
                        La factura original quedará <strong>anulada</strong> automáticamente.
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario rectificativa -->
        <div class="col-lg-7">
            <div class="form-card">
                <div class="form-section-title">
                    <i class="bi bi-arrow-counterclockwise"></i> Datos de la rectificativa
                </div>
                <form th:action="@{/web/facturas/{id}/rectificar(id=${facturaOriginal.id})}" method="post"
                      class="needs-validation" novalidate
                      onsubmit="return confirm('¿Crear factura rectificativa? La factura original quedará anulada.')">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="fecha">Fecha rectificativa *</label>
                            <input type="date" id="fecha" name="fecha" class="form-control"
                                   th:value="${fechaHoy}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="tipoRectificacion">Tipo de rectificación</label>
                            <select id="tipoRectificacion" name="tipoRectificacion" class="form-select">
                                <option value="SUSTITUCION">Sustitución (total)</option>
                                <option value="DIFERENCIAS">Diferencias (parcial)</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="motivoRectificacion">Motivo de la rectificación *</label>
                            <textarea id="motivoRectificacion" name="motivoRectificacion" class="form-control" rows="4" required
                                      placeholder="Describe el motivo de la rectificativa..."></textarea>
                            <div class="invalid-feedback">El motivo es obligatorio.</div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-warning" data-no-double-click>
                            <i class="bi bi-arrow-counterclockwise me-1"></i>Crear rectificativa
                        </button>
                        <a th:href="@{/web/facturas/{id}(id=${facturaOriginal.id})}"
                           class="btn btn-ghost">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
