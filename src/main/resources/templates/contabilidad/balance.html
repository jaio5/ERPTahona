<div th:fragment="content" x-data="balanceApp" x-cloak>
    <div class="page-header">
        <div class="page-header-title">
            <h1>Balance y cierre contable</h1>
            <p>Sumas del mes y cierre del ejercicio anual</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/contabilidad/balance-pgc}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-file-earmark-spreadsheet me-1" aria-hidden="true"></i>Balance PGC
            </a>
        </div>
    </div>

    <!-- Pestañas: el estado activo lo pinta tabClass() ('active' sobre nav-link) -->
    <nav class="nav nav-pills gap-1 mb-3" aria-label="Secciones del balance">
        <button type="button" class="nav-link" @click="setTab('balance')" :class="tabClass('balance')" :aria-pressed="isTab('balance')">
            <i class="bi bi-bar-chart me-1" aria-hidden="true"></i>Balance
        </button>
        <button type="button" class="nav-link" @click="setTab('cierre')" :class="tabClass('cierre')" :aria-pressed="isTab('cierre')">
            <i class="bi bi-lock me-1" aria-hidden="true"></i>Cierre ejercicio
        </button>
    </nav>

    <!-- Balance -->
    <div x-show="isTab('balance')">
        <div class="filter-bar mb-3">
            <div class="filter-bar-filters">
                <label class="form-label mb-0" for="balance-mes">Mes</label>
                <input type="month" id="balance-mes" x-model="mes" class="form-control form-control-sm">
                <button type="button" class="btn btn-sm btn-primary" @click="cargarBalance()">
                    <i class="bi bi-arrow-repeat me-1" aria-hidden="true"></i>Ver balance
                </button>
            </div>
        </div>
        <div x-show="!balance" class="form-card empty-state empty-state-compact">
            <i class="bi bi-hourglass-split" aria-hidden="true"></i>
            <div class="empty-state-title">Calculando balance…</div>
        </div>
        <div x-show="balance">
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <div class="stat-card h-100">
                        <div class="stat-label"><i class="bi bi-box-arrow-in-down" aria-hidden="true"></i>Total Debe</div>
                        <div class="stat-value" x-text="money(balanceValue('totalDebe'))"></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card h-100">
                        <div class="stat-label"><i class="bi bi-box-arrow-up" aria-hidden="true"></i>Total Haber</div>
                        <div class="stat-value" x-text="money(balanceValue('totalHaber'))"></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card h-100">
                        <div class="stat-label"><i class="bi bi-arrow-left-right" aria-hidden="true"></i>Diferencia</div>
                        <div class="stat-value" :class="isBalanced() ? 'text-success' : 'text-danger'" x-text="money(balanceValue('diferencia'))"></div>
                        <div class="stat-sub d-flex flex-wrap align-items-center gap-2">
                            <!-- El estado no se comunica solo con color: badge con texto -->
                            <span class="badge-estado" :class="isBalanced() ? 'badge-estado-ok' : 'badge-estado-peligro'"
                                  x-text="isBalanced() ? 'Cuadra' : 'Descuadre'"></span>
                            <span x-text="balanceCountText()"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cierre ejercicio -->
    <div x-show="isTab('cierre')">
        <div class="row">
            <div class="col-lg-7 col-xl-6">
                <div class="form-card">
                    <section class="form-section">
                        <h2 class="form-section-title"><i class="bi bi-lock" aria-hidden="true"></i>Cierre de ejercicio anual</h2>
                        <p class="form-section-hint">Genera el asiento de cierre del año indicado. Revisa antes el balance.</p>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label" for="cierre-anio">Año a cerrar</label>
                                <input type="number" id="cierre-anio" class="form-control text-end" x-model="anioCierre" min="2020" :max="maxAnio" inputmode="numeric">
                            </div>
                        </div>
                    </section>
                    <div class="form-actions">
                        <button type="button" class="btn btn-warning" @click="ejecutarCierre()">
                            <i class="bi bi-lock-fill me-1" aria-hidden="true"></i>Ejecutar cierre
                        </button>
                    </div>
                    <div x-show="cierreResult" class="mt-3 alert alert-info" role="status">
                        <p class="fw-semibold mb-2" x-text="resultValue('mensaje')"></p>
                        <div class="doc-fields">
                            <table class="doc-table">
                                <tr><th>Debe</th><td x-text="money(resultValue('totalDebe'))"></td></tr>
                                <tr><th>Haber</th><td x-text="money(resultValue('totalHaber'))"></td></tr>
                                <tr><th>Asiento de cierre</th><td x-text="resultValue('asientoCierreId')"></td></tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:attr="nonce=${cspNonce}">
        document.addEventListener('alpine:init', function () {
            Alpine.data('balanceApp', function () {
                return {
                tab: 'balance',
                mes: '',
                balance: null,
                anioCierre: new Date().getFullYear(),
                maxAnio: new Date().getFullYear(),
                cierreResult: null,
                money(value) {
                    return formatMoneyEs(value);
                },
                balanceValue(field) {
                    return this.balance ? this.balance[field] : null;
                },
                isBalanced() {
                    return this.balance != null && this.balance.diferencia === 0;
                },
                balanceCountText() {
                    return (this.balance ? this.balance.asientos : 0) + ' asientos contables';
                },
                resultValue(field) {
                    return this.cierreResult ? this.cierreResult[field] : '';
                },
                isTab(name) { return this.tab === name; },
                setTab(name) { this.tab = name; },
                tabClass(name) { return this.tab === name ? 'active' : ''; },
                init() {
                    const now = new Date();
                    this.mes = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2, '0');
                    this.cargarBalance();
                },
                cargarBalance() {
                    const [year, month] = this.mes.split('-');
                    const fecha = `${year}-${month}-28`;
                    fetch(`/api/web/contabilidad/balance?fecha=${fecha}`)
                        .then(r => r.json())
                        .then(data => this.balance = data);
                },
                async ejecutarCierre() {
                    if (!confirm(`¿Cerrar el ejercicio ${this.anioCierre}?`)) return;
                    const resp = await fetch(`/api/web/contabilidad/cierre?anio=${this.anioCierre}`, {method:'POST'});
                    this.cierreResult = await resp.json();
                }
                };
            });
        });
    </script>
</div>
