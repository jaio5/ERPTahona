<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Contabilidad</h4>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/contabilidad/balance}" class="btn btn-ghost btn-sm">
                <i class="bi bi-bar-chart me-1"></i>Balance
            </a>
        </div>
    </div>
    <div class="table-card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>Fecha</th><th>Número</th><th>Concepto</th><th class="text-end">Debe</th><th class="text-end">Haber</th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(asientos)}"><td colspan="5" class="empty-state"><i class="bi bi-calculator"></i><div>No hay asientos contables</div></td></tr>
            <tr th:each="a : ${asientos}">
                <td th:text="${a.fecha}"></td><td th:text="${a.numero}"></td><td th:text="${a.concepto}"></td>
                <td class="text-end" th:text="${a.debe}"></td><td class="text-end" th:text="${a.haber}"></td>
            </tr>
        </tbody>
    </table></div></div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/contabilidad')}"></div>
</div>
