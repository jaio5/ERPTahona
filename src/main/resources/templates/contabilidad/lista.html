<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h1 th:text="${titulo}">Contabilidad</h1>
            <p>Libro diario del mes en curso</p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/web/contabilidad/mayor}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-journal-text me-1" aria-hidden="true"></i>Libro mayor
            </a>
            <a th:href="@{/web/contabilidad/balance}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-bar-chart me-1" aria-hidden="true"></i>Balance
            </a>
        </div>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Número</th>
                        <th>Concepto</th>
                        <th class="cifra">Debe</th>
                        <th class="cifra">Haber</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(asientos)}">
                        <td colspan="5" class="empty-state">
                            <i class="bi bi-calculator" aria-hidden="true"></i>
                            <div class="empty-state-title">No hay asientos este mes</div>
                            <small class="empty-state-hint">Consulta meses anteriores en el libro mayor.</small>
                            <a th:href="@{/web/contabilidad/mayor}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-journal-text me-1" aria-hidden="true"></i>Abrir libro mayor
                            </a>
                        </td>
                    </tr>
                    <tr th:each="a : ${asientos}">
                        <td class="text-muted" th:text="${#temporals.format(a.fecha,'dd/MM/yyyy')}"></td>
                        <td th:text="${a.numero}"></td>
                        <td class="td-wrap" th:text="${a.concepto}"></td>
                        <td class="cifra" th:text="${#numbers.formatCurrency(a.debe)}"></td>
                        <td class="cifra" th:text="${#numbers.formatCurrency(a.haber)}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginacion(${page}, '/web/contabilidad')}"></div>
</div>
