<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Libro mayor</h4>
        </div>
    </div>

    <form method="get" th:action="@{/web/contabilidad/mayor}" class="table-card p-3 mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label" for="cuenta">Cuenta (código PGC)</label>
                <input type="text" id="cuenta" name="cuenta" class="form-control" th:value="${cuenta}" placeholder="430" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="desde">Desde</label>
                <input type="date" id="desde" name="desde" class="form-control" th:value="${desde}">
            </div>
            <div class="col-md-3">
                <label class="form-label" for="hasta">Hasta</label>
                <input type="date" id="hasta" name="hasta" class="form-control" th:value="${hasta}">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1"></i>Consultar</button>
            </div>
        </div>
    </form>

    <div class="table-card"><div class="table-responsive"><table class="table table-hover table-sm mb-0">
        <thead><tr><th>Fecha</th><th>Asiento</th><th>Concepto</th><th class="text-end">Debe</th><th class="text-end">Haber</th><th class="text-end">Saldo</th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(movimientos)}"><td colspan="6" class="empty-state"><i class="bi bi-journal"></i><div th:text="${cuenta != null and !#strings.isEmpty(cuenta)} ? 'Sin movimientos de la cuenta en el periodo' : 'Indica una cuenta para consultar su mayor'"></div></td></tr>
            <tr th:each="mov : ${movimientos}">
                <td th:text="${#temporals.format(mov.fecha,'dd/MM/yyyy')}"></td>
                <td th:text="${mov.numeroAsiento}"></td>
                <td th:text="${mov.concepto}"></td>
                <td class="text-end" th:text="${#numbers.formatCurrency(mov.debe)}"></td>
                <td class="text-end" th:text="${#numbers.formatCurrency(mov.haber)}"></td>
                <td class="text-end fw-medium" th:text="${#numbers.formatCurrency(mov.saldo)}"></td>
            </tr>
        </tbody>
    </table></div></div>
</div>
