<div th:fragment="content">
    <div class="page-header">
        <div class="page-header-title">
            <h4 th:text="${titulo}">Tesorería</h4>
        </div>
        <div class="page-header-actions">
            <button type="button" class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#modalMovCaja" data-tipo="INGRESO">
                <i class="bi bi-plus-lg me-1"></i>Ingreso caja
            </button>
            <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalMovCaja" data-tipo="GASTO">
                <i class="bi bi-dash-lg me-1"></i>Gasto caja
            </button>
        </div>
    </div>

    <h6 class="mb-2 mt-3">Caja</h6>
    <div class="table-card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th class="text-end">Importe</th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(caja)}"><td colspan="4" class="empty-state"><i class="bi bi-wallet2"></i><div>No hay movimientos de caja</div></td></tr>
            <tr th:each="m : ${caja}">
                <td th:text="${m.fecha}"></td>
                <td th:text="${m.concepto}"></td>
                <td><span class="badge-status" th:attr="data-status=${m.tipo?.toLowerCase()}" th:text="${m.tipo}"></span></td>
                <td class="text-end fw-medium"
                    th:classappend="${m.tipo == 'GASTO'} ? 'text-danger' : 'text-success'"
                    th:text="${m.importe != null ? #numbers.formatCurrency(m.importe) : '-'}"></td>
            </tr>
        </tbody>
    </table></div></div>

    <h6 class="mb-2 mt-4">Banco</h6>
    <div class="table-card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th class="text-end">Importe</th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(banco)}"><td colspan="4" class="empty-state"><i class="bi bi-bank"></i><div>No hay movimientos de banco</div></td></tr>
            <tr th:each="m : ${banco}">
                <td th:text="${m.fecha}"></td>
                <td th:text="${m.concepto}"></td>
                <td th:text="${m.tipo}"></td>
                <td class="text-end fw-medium" th:text="${m.importe != null ? #numbers.formatCurrency(m.importe) : '-'}"></td>
            </tr>
        </tbody>
    </table></div></div>

    <!-- Modal nuevo movimiento caja -->
    <div class="modal fade" id="modalMovCaja" tabindex="-1" aria-labelledby="modalMovCajaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/web/tesoreria/caja}" method="post" class="needs-validation" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalMovCajaLabel">Nuevo movimiento de caja</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="tipo" id="movTipo" value="INGRESO">
                        <div class="mb-3">
                            <label class="form-label" for="movConcepto">Concepto *</label>
                            <input type="text" id="movConcepto" name="concepto" class="form-control" required maxlength="200">
                            <div class="invalid-feedback">El concepto es obligatorio.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="movImporte">Importe (€) *</label>
                            <input type="number" id="movImporte" name="importe" class="form-control" step="0.01" min="0.01" required>
                            <div class="invalid-feedback">Introduce un importe válido.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="movCategoria">Categoría</label>
                            <input type="text" id="movCategoria" name="categoria" class="form-control" maxlength="100" placeholder="Ej: Ventas, Suministros...">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" data-no-double-click id="movSubmitBtn">Registrar ingreso</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:attr="nonce=${cspNonce}" th:inline="javascript">
        document.getElementById('modalMovCaja').addEventListener('show.bs.modal', function(e) {
            var tipo = e.relatedTarget?.getAttribute('data-tipo') || 'INGRESO';
            document.getElementById('movTipo').value = tipo;
            var esGasto = tipo === 'GASTO';
            document.getElementById('modalMovCajaLabel').textContent = esGasto ? 'Nuevo gasto de caja' : 'Nuevo ingreso de caja';
            document.getElementById('movSubmitBtn').textContent = esGasto ? 'Registrar gasto' : 'Registrar ingreso';
            document.getElementById('movSubmitBtn').className = 'btn ' + (esGasto ? 'btn-danger' : 'btn-success');
        });
    </script>
</div>
