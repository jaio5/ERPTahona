<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="csrf-header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <title th:text="${titulo} + ' | ERP Tahona'">ERP Tahona</title>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar" id="mainSidebar" th:replace="~{fragments/menu :: menu}"></nav>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <main class="main-content">
            <header class="topbar-global">
                <button class="sidebar-toggle-btn" id="sidebarToggle" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
                <nav aria-label="breadcrumb" th:if="${breadcrumb != null and !breadcrumb.isEmpty()}">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item" th:each="crumb, stat : ${breadcrumb}"
                            th:classappend="${stat.last ? 'active' : ''}">
                            <a th:if="${!stat.last and crumb.url != null}"
                               th:href="${crumb.url}" th:text="${crumb.label}"></a>
                            <span th:if="${stat.last}" th:text="${crumb.label}"></span>
                            <span th:if="${!stat.last and crumb.url == null}" th:text="${crumb.label}"></span>
                        </li>
                    </ol>
                </nav>
                <div class="ms-auto d-flex align-items-center gap-2">
                    <a th:href="@{/web/dashboard}" class="btn btn-ghost btn-sm" style="font-size:11px;">
                        <i class="bi bi-grid-1x2"></i>
                    </a>
                    <form th:action="@{/web/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-ghost btn-sm" style="font-size:11px;" title="Cerrar sesión">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </header>
            <div th:insert="~{${content}}"></div>
        </main>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container">
        <div th:if="${exito}" class="toast align-items-center text-bg-success border-0 show" role="alert">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${exito}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
        <div th:if="${error}" class="toast align-items-center text-bg-danger border-0 show" role="alert">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span th:text="${error}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script th:attr="nonce=${cspNonce}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:attr="nonce=${cspNonce}" src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script th:attr="nonce=${cspNonce}" defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}"></script>
</body>
</html>
