<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="csrf-header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
    <meta name="color-scheme" content="light dark">
    <!-- Fija el tema claro/oscuro antes de pintar (sin defer a propósito) -->
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/tema.js}"></script>
    <link th:href="@{/webjars/fontsource__inter/5.2.8/400.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/500.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/600.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/700.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/webjars/tom-select/2.6.1/dist/css/tom-select.bootstrap5.min.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <title th:text="${titulo} + ' | ERP Tahona'">ERP Tahona</title>
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="app-layout">
        <nav class="sidebar" id="mainSidebar" th:replace="~{fragments/menu :: menu}"></nav>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <main class="main-content" id="contenido" tabindex="-1">
            <header class="topbar-global">
                <button class="sidebar-toggle-btn" id="sidebarToggle" type="button" aria-label="Abrir menú"
                        aria-controls="mainSidebar" aria-expanded="false">
                    <i class="bi bi-list"></i>
                </button>
                <nav aria-label="breadcrumb" th:if="${breadcrumb != null and !breadcrumb.isEmpty()}">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item" th:each="crumb, stat : ${breadcrumb}"
                            th:classappend="${stat.last ? 'active' : ''}">
                            <a th:if="${!stat.last and crumb.url != null}"
                               th:href="${crumb.url}" th:text="${crumb.label}"></a>
                            <span th:if="${stat.last}" th:text="${crumb.label}"></span>
                            <span th:if="${!stat.last and crumb.url == null}" th:text="${crumb.label}"></span>
                        </li>
                    </ol>
                </nav>
                <!-- Breadcrumb por defecto: si la vista no fija uno, se deriva del título (Inicio / Título) -->
                <nav aria-label="breadcrumb"
                     th:if="${(breadcrumb == null or breadcrumb.isEmpty()) and titulo != null and !titulo.isEmpty()}">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/web/dashboard}">Inicio</a></li>
                        <li class="breadcrumb-item active" th:text="${titulo}"></li>
                    </ol>
                </nav>
                <div class="topbar-tools">
                    <!-- El rótulo lo actualiza app.js según el tema activo (dice la acción, sin aria-pressed) -->
                    <button type="button" class="btn btn-ghost btn-sm btn-icon theme-toggle" id="temaToggle"
                            aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
                        <i class="bi bi-moon-stars tema-icono-oscuro" aria-hidden="true"></i>
                        <i class="bi bi-sun tema-icono-claro" aria-hidden="true"></i>
                    </button>
                    <a th:href="@{/web/dashboard}" class="btn btn-ghost btn-sm btn-icon"
                       aria-label="Panel de trabajo" title="Panel de trabajo">
                        <i class="bi bi-grid-1x2" aria-hidden="true"></i>
                    </a>
                    <form th:action="@{/web/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-ghost btn-sm btn-icon" title="Cerrar sesión"
                                aria-label="Cerrar sesión" data-no-double-click>
                            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
            </header>
            <div th:insert="~{${content}}"></div>
        </main>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" aria-live="polite">
        <div th:if="${exito}" class="toast align-items-center text-bg-success border-0 show"
             role="status" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                    <span th:text="${exito}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
        <!-- Los errores no se ocultan solos: el usuario debe poder leerlos y cerrarlos -->
        <div th:if="${error}" class="toast align-items-center text-bg-danger border-0 show"
             role="alert" aria-atomic="true" data-bs-autohide="false">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                    <span th:text="${error}"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
    </div>

    <script th:attr="nonce=${cspNonce}" th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:attr="nonce=${cspNonce}" th:src="@{/webjars/tom-select/2.6.1/dist/js/tom-select.complete.min.js}"></script>
    <script th:attr="nonce=${cspNonce}" defer th:src="@{/webjars/alpinejs/3.15.12/dist/cdn.min.js}"></script>
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}"></script>
</body>
</html>
