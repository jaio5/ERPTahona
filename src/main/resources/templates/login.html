<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/400.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/500.css}" rel="stylesheet">
    <link th:href="@{/webjars/fontsource__inter/5.2.8/600.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <!-- Tema claro/oscuro guardado en el panel (o el del sistema) -->
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/tema.js}"></script>
    <title>Iniciar Sesión | ERP Tahona</title>
</head>
<body>
    <main class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <i class="bi bi-fire login-brand-icon" aria-hidden="true"></i>
                <h1>ERP Tahona</h1>
                <p class="login-sub">Gestión de panadería y obrador</p>
            </div>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                <span th:text="${error}">Error</span>
            </div>
            <div th:if="${mensaje}" class="alert alert-success" role="status">
                <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                <span th:text="${mensaje}">OK</span>
            </div>

            <form th:action="@{/web/login}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label" for="username">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </form>
            <p class="login-foot">Obrador · Tienda · Reparto</p>
        </div>
    </main>
</body>
</html>
