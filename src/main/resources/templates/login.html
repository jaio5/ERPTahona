<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <title>Iniciar Sesión | ERP Tahona</title>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h3>ERP Tahona</h3>
            <p>Gestión de panadería y obrador</p>

            <div th:if="${error}" class="alert alert-danger">
                <strong>⚠ </strong><span th:text="${error}">Error</span>
            </div>
            <div th:if="${mensaje}" class="alert alert-success">
                <strong>✓ </strong><span th:text="${mensaje}">OK</span>
            </div>

            <form th:action="@{/web/login}" method="post" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="username">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
