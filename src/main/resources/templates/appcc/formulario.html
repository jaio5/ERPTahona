<section>
    <div class="topbar"><h4 th:text="${titulo}">Nuevo control APPCC</h4><a th:href="@{/web/appcc}" class="btn btn-outline-secondary btn-sm">Volver</a></div>
    <form th:action="@{/web/appcc}" method="post" class="card p-3">
        <div class="row g-3">
            <div class="col-md-5"><label class="form-label">Punto critico</label><input name="puntoCritico" class="form-control" required></div>
            <div class="col-md-3"><label class="form-label">Temperatura</label><input name="temperatura" type="number" step="0.01" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Limite</label><input name="limite" type="number" step="0.01" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Resultado</label><input name="resultado" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Responsable</label><input name="responsable" class="form-control"></div>
            <div class="col-12"><label class="form-label">Accion correctiva</label><textarea name="accion" class="form-control"></textarea></div>
        </div>
        <div class="mt-4"><button class="btn btn-primary" type="submit">Guardar</button><a th:href="@{/web/appcc}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
    </form>
</section>
