# ===================================================================
# DATABASE (MySQL)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tahona?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=Iirne322*
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# ===================================================================
# ENCODING & CHARSET
# ===================================================================
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================================================================
# JACKSON (JSON Handling)
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# LOGGING
# ===================================================================
logging.level.org.springframework=warn
logging.level.alicanteweb=info
logging.level.org.hibernate.SQL=debug

# ===================================================================
# VERIFACTU - Configuracion completa
# ===================================================================

# -----------------------------------------------
# 1. HABILITACION DEL SERVICIO
# -----------------------------------------------
# false = Solo guardar evidencias locales (sin enviar a AEAT)
# true = Enviar facturas a la AEAT (requiere certificado valido)
verifactu.aeat.enabled=false

# -----------------------------------------------
# 2. ENDPOINT DE LA AEAT
# -----------------------------------------------
# PREPRODUCCION (para pruebas y desarrollo)
verifactu.aeat.endpoint=https://prewww2.aeat.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu

# PRODUCCION (descomentar cuando estes listo para produccion)
#verifactu.aeat.endpoint=https://www2.agenciatributaria.gob.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu

# -----------------------------------------------
# 3. CERTIFICADO DIGITAL
# -----------------------------------------------
# Ruta al certificado .p12 (relativa a resources o absoluta)
verifactu.keystore.path=/certs/mi_certificado.p12

# Contrasena del certificado
verifactu.keystore.password=changeit

# Alias del certificado (normalmente el CIF en minusculas)
# Para GRUPO BABO: f54059985
verifactu.key.alias=mi_certificado

# Contrasena de la clave privada (si es diferente a la del keystore)
verifactu.key.password=${verifactu.keystore.password}

# -----------------------------------------------
# 4. CONFIGURACION AVANZADA
# -----------------------------------------------
# Timeout de conexion (milisegundos)
verifactu.aeat.timeout=90000

# Numero maximo de reintentos en caso de error temporal
verifactu.aeat.max-retries=3

# Tiempo de espera entre reintentos (milisegundos)
verifactu.aeat.retry-delay=5000

# -----------------------------------------------
# NOTAS IMPORTANTES:
# -----------------------------------------------
# 1. Para obtener certificado: https://www.sede.fnmt.gob.es/certificados
# 2. Para pruebas, usa PREPRODUCCION
# 3. Para produccion, necesitas certificado valido de la FNMT
# 4. Ejecuta scripts/configurar_verifactu.bat para ayuda
# -----------------------------------------------

# Configuracion antigua (mantener por compatibilidad)
verifactu.cert.path=/certs/mi_certificado.p12
verifactu.cert.password=changeit

# ===================================================================
# BACKUP AUTOMÁTICO
# ===================================================================
# Habilitar backups automáticos
backup.enabled=true

# Directorio donde se guardan los backups (relativo o absoluto)
backup.directory=backups

# Retención de backups en días
backup.retention.days=30

# Programación del backup automático (2:00 AM cada día)
backup.cron=0 0 2 * * ?

# ===================================================================
# NOTIFICACIONES Y ALERTAS
# ===================================================================
# Verificar presupuestos por caducar (9:00 AM cada día)
notificaciones.presupuestos.cron=0 0 9 * * ?

# Verificar stock bajo (10:00 AM cada día)
notificaciones.stock.cron=0 0 10 * * ?

# Verificar facturas pendientes (9:00 AM cada lunes)
notificaciones.pagos.cron=0 0 9 * * MON

# Resumen semanal (8:00 AM cada lunes)
notificaciones.resumen.cron=0 0 8 * * MON

