# ===================================================================
# DATABASE (MySQL)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tahona?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=Iirne322*
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# ===================================================================
# ENCODING & CHARSET
# ===================================================================
spring.messages.encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ===================================================================
# JACKSON (JSON Handling)
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# LOGGING
# ===================================================================
logging.level.org.springframework=warn
logging.level.alicanteweb=info
logging.level.org.hibernate.SQL=debug

# ===================================================================
# VERIFACTU - Configuraci?n completa
# ===================================================================

# -----------------------------------------------
# 1. HABILITACI?N DEL SERVICIO
# -----------------------------------------------
# false = Solo guardar evidencias locales (sin enviar a AEAT)
# true = Enviar facturas a la AEAT (requiere certificado v?lido)
verifactu.aeat.enabled=false

# -----------------------------------------------
# 2. ENDPOINT DE LA AEAT
# -----------------------------------------------
# PREPRODUCCI?N (para pruebas y desarrollo)
verifactu.aeat.endpoint=https://prewww2.aeat.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu

# PRODUCCI?N (descomentar cuando est?s listo para producci?n)
#verifactu.aeat.endpoint=https://www2.agenciatributaria.gob.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu

# -----------------------------------------------
# 3. CERTIFICADO DIGITAL
# -----------------------------------------------
# Ruta al certificado .p12 (relativa a resources o absoluta)
verifactu.keystore.path=/certs/mi_certificado.p12

# Contrase?a del certificado
verifactu.keystore.password=changeit

# Alias del certificado (normalmente el CIF en min?sculas)
# Para GRUPO BABO: f54059985
verifactu.key.alias=mi_certificado

# Contrase?a de la clave privada (si es diferente a la del keystore)
verifactu.key.password=${verifactu.keystore.password}

# -----------------------------------------------
# 4. CONFIGURACI?N AVANZADA
# -----------------------------------------------
# Timeout de conexi?n (milisegundos)
verifactu.aeat.timeout=90000

# N?mero m?ximo de reintentos en caso de error temporal
verifactu.aeat.max-retries=3

# Tiempo de espera entre reintentos (milisegundos)
verifactu.aeat.retry-delay=5000

# -----------------------------------------------
# NOTAS IMPORTANTES:
# -----------------------------------------------
# 1. Para obtener certificado: https://www.sede.fnmt.gob.es/certificados
# 2. Para pruebas, usa PREPRODUCCI?N
# 3. Para producci?n, necesitas certificado v?lido de la FNMT
# 4. Ejecuta scripts/configurar_verifactu.bat para ayuda
# -----------------------------------------------

# Configuraci?n antigua (mantener por compatibilidad)
verifactu.cert.path=/certs/mi_certificado.p12
verifactu.cert.password=changeit
