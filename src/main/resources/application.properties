# ===================================================================
# DATABASE (H2)
# ===================================================================
spring.datasource.url=jdbc:h2:./data/erp-alicante;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# JACKSON (JSON Handling)
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# LOGGING
# ===================================================================
logging.level.org.springframework=warn
logging.level.alicanteweb=info

# ===================================================================
# VERIFACTU CONFIGURATION
# ===================================================================

# --- Interruptor Global para Envío a la AEAT ---
# Define si la aplicación envía registros a la AEAT. 
# true: Modo PRODUCCIÓN. Los registros de facturas se envían a la AEAT.
# false: Modo PRUEBA. Los registros se procesan localmente pero NO se envían a la AEAT.
verifactu.aeat.enabled=false

# --- Configuración del Certificado Digital (Keystore) ---
# Usado por VerifactuService para firmar las evidencias localmente.
verifactu.keystore.path=/keystore/certificate.p12
verifactu.keystore.password=YourKeystorePassword
verifactu.key.alias=your_key_alias
verifactu.key.password=YourKeyPassword

# --- Configuración de la Conexión con la AEAT ---
# Usado por VerifactuAEATService para enviar las evidencias.
verifactu.aeat.endpoint=https://www2.agenciatributaria.gob.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu

# --- Configuración del Certificado para la Conexión con AEAT ---
# Necesario para la autenticación TLS mutua (mTLS).
verifactu.cert.path=/keystore/certificate.p12
verifactu.cert.password=YourKeystorePassword
