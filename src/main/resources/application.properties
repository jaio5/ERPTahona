# Application common properties (non-sensitive)

# Por defecto usamos el perfil 'dev' local para el desarrollo.
# Cambia esto a 'prod' para ejecutar con la configuración de producción, o
# usa la variable de entorno SPRING_PROFILES_ACTIVE=prod al arrancar.
spring.profiles.active=dev

# Mensajes y encoding
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.org.springframework=warn
logging.level.alicanteweb=info
logging.level.org.hibernate.SQL=debug

# VERIFACTU - deshabilitado por defecto
verifactu.aeat.enabled=false
verifactu.aeat.endpoint=https://prewww2.aeat.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu
verifactu.keystore.path=${VERIFACTU_CERT_PATH:/certs/mi_certificado.p12}
verifactu.keystore.password=${VERIFACTU_CERT_PASSWORD:changeit}
verifactu.key.alias=mi_certificado
verifactu.key.password=${VERIFACTU_KEY_PASSWORD:}

# Flyway (controlar por perfil)
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Backup defaults
backup.enabled=true
backup.directory=backups
backup.retention.days=30
backup.cron=0 0 2 * * ?

# Notificaciones
notificaciones.presupuestos.cron=0 0 9 * * ?
notificaciones.stock.cron=0 0 10 * * ?
notificaciones.pagos.cron=0 0 9 * * MON
notificaciones.resumen.cron=0 0 8 * * MON

