# ===================================================================
# DATABASE (MySQL)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tahonaerp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Iirne322*
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# ===================================================================
# JACKSON (JSON Handling)
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# LOGGING
# ===================================================================
logging.level.org.springframework=warn
logging.level.alicanteweb=info

# ===================================================================
# ===================================================================
# CONFIGURACI?N VERIFACTU - GRUPO BABO
# ===================================================================

# --- MODO DE OPERACI?N ---
# Define si las facturas se env?an realmente a la Agencia Tributaria
#
# false (MODO PRUEBAS - ACTUAL):
#   - Las facturas se procesan normalmente
#   - Se genera el XML correcto con datos de GRUPO BABO
#   - Se guarda la evidencia localmente
#   - Se firma digitalmente (si hay certificado)
#   - NO se env?a a la AEAT
#   - Ideal para: desarrollo, pruebas, verificar el XML generado
#
# true (MODO PRODUCCI?N):
#   - Todo lo anterior M?S
#   - Se env?a el XML a la AEAT mediante HTTPS
#   - Se registra la respuesta de la AEAT
#   - Requiere: certificado v?lido + endpoint configurado
#   - ATENCI?N: Los env?os son reales y tienen efectos fiscales
#
verifactu.aeat.enabled=false

# --- CERTIFICADO DIGITAL (OBLIGATORIO para producci?n) ---
# Certificado PKCS12 de GRUPO BABO para firmar las facturas
# Obtener de: https://www.sede.fnmt.gob.es/
# Para: GRUPO BABO, S.Coop.V.L. (CIF: F54059985)
verifactu.keystore.path=/certs/mi_certificado.p12
verifactu.keystore.password=changeit
verifactu.key.alias=mi_certificado
verifactu.key.password=changeit

# --- ENDPOINT DE LA AEAT ---
# URL oficial del servicio Verifactu de la Agencia Tributaria
# Producci?n: https://www2.agenciatributaria.gob.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu
# Pruebas: https://prewww1.aeat.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu
verifactu.aeat.endpoint=https://www2.agenciatributaria.gob.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu

# --- RESUMEN DEL FLUJO ---
# 1. Usuario crea factura (estado: BORRADOR)
# 2. Usuario env?a a revisi?n (estado: REVISION)
# 3. Supervisor aprueba (estado: EMITIDA)
# 4. Sistema genera XML con datos de GRUPO BABO:
#    - CIF: F54059985
#    - Nombre: GRUPO BABO, S.Coop.V.L.
#    - Sistema: ERP Tahona v1.0.0
# 5. Sistema firma el XML (si hay certificado)
# 6. Sistema guarda evidencia en BD local
# 7. SI verifactu.aeat.enabled=true:
#    ? Env?a XML a la AEAT por HTTPS
#    ? Guarda respuesta de la AEAT
# 8. Factura queda registrada

# ===================================================================
# VERIFACTU - Configuración
# ===================================================================
verifactu.cert.path=certs/mi_certificado.p12
verifactu.cert.password=changeit
verifactu.aeat.endpoint=https://www2.agenciatributaria.gob.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu
verifactu.aeat.enabled=false
