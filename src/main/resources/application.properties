# Application common properties (non-sensitive)

# Perfil por defecto para trabajo local.
# En despliegue usa SPRING_PROFILES_ACTIVE=prod y evita fijar el perfil desde el codigo.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Mensajes y encoding
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Puerto del servidor web (0 = aleatorio, 8080 = fijo)
server.port=${SERVER_PORT:8080}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Evita consultas perezosas durante renderizado de vistas; cargar datos en servicios/controladores.
spring.jpa.open-in-view=false

# Esquema gestionado por Flyway: Hibernate solo valida, nunca crea ni altera tablas
# (evita drift). Los perfiles dev/prod lo reafirman; DatabaseStartupChecker bloquea
# el arranque si se fuerza un ddl-auto que mute el esquema con Flyway activo.
spring.jpa.hibernate.ddl-auto=validate

# Sesión: 15 minutos de inactividad
server.servlet.session.timeout=15m

# Actuator: salud (pública sin detalles, para el healthcheck de docker compose)
# y métricas (JVM, HTTP, Hikari...). Todo lo que no sea /actuator/health exige
# rol ADMIN en SecurityConfig; los detalles de health también.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN,ADMINISTRADOR

# Logging
logging.level.org.springframework=warn
logging.level.alicanteweb=info
logging.level.org.hibernate.SQL=warn

# VERIFACTU - deshabilitado por defecto
verifactu.aeat.enabled=false
verifactu.aeat.endpoint=https://prewww2.aeat.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu
verifactu.keystore.path=${VERIFACTU_CERT_PATH:}
verifactu.keystore.password=${VERIFACTU_CERT_PASSWORD:}
verifactu.key.alias=${VERIFACTU_KEY_ALIAS:mi_certificado}
verifactu.key.password=${VERIFACTU_KEY_PASSWORD:}

# QR tributario (Orden HAC/1177/2024): URL base de cotejo. Producción por defecto.
verifactu.qr.base-url=${VERIFACTU_QR_BASE_URL:https://www2.agenciatributaria.gob.es/wlpl/TIKE-CONT/ValidarQR}

# Bloque SistemaInformatico (art. 9 RRSIF). Vacío = se usan los datos fiscales de la empresa
# (caso de software de desarrollo propio, donde productor y obligado coinciden).
verifactu.sistema.nombre-productor=${VERIFACTU_SISTEMA_NOMBRE_PRODUCTOR:}
verifactu.sistema.nif-productor=${VERIFACTU_SISTEMA_NIF_PRODUCTOR:}
verifactu.sistema.id=${VERIFACTU_SISTEMA_ID:01}
verifactu.sistema.numero-instalacion=${VERIFACTU_SISTEMA_NUMERO_INSTALACION:1}
verifactu.sistema.solo-verifactu=${VERIFACTU_SISTEMA_SOLO_VERIFACTU:S}

# Flyway (habilitado por defecto; prod lo sobreescribe con baseline-on-migrate=false)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.ignore-migration-patterns=*:ignored

# Hibernate batch inserts/updates para reducir roundtrips en operaciones masivas
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Batch loading de asociaciones lazy: evita N+1 queries en listados genéricos
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Backup defaults
backup.enabled=true
backup.directory=backups
backup.retention.days=30
backup.cron=0 0 2 * * ?
# Ruta completa a mysqldump (vacío = usar el del PATH del sistema, p.ej. en Docker)
backup.mysqldump-path=${BACKUP_MYSQLDUMP_PATH:}
# Ruta completa al cliente mysql para restauraciones (vacío = usar el del PATH)
backup.mysql-path=${BACKUP_MYSQL_PATH:}

# Notificaciones
notificaciones.presupuestos.cron=0 0 9 * * ?
notificaciones.stock.cron=0 0 10 * * ?
notificaciones.pagos.cron=0 0 9 * * MON
notificaciones.resumen.cron=0 0 8 * * MON

# Autocompletado de clientes desde API externa (APIEmpresas.es por defecto)
clientes.autocompletar.enabled=true
clientes.autocompletar.endpoint=${CLIENTES_AUTOCOMPLETAR_ENDPOINT:https://apiempresas.es/api/v1/companies}
clientes.autocompletar.api-key=${CLIENTES_AUTOCOMPLETAR_API_KEY:}
clientes.autocompletar.timeout-seconds=${CLIENTES_AUTOCOMPLETAR_TIMEOUT_SECONDS:8}
clientes.autocompletar.cif-param=${CLIENTES_AUTOCOMPLETAR_CIF_PARAM:cif}
clientes.autocompletar.nombre-param=${CLIENTES_AUTOCOMPLETAR_NOMBRE_PARAM:q}

