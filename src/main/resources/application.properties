spring.application.name=ERP
# Base de datos MySQL (esquema definitivo)
# Anadimos parametros utiles: timezone, uso de UTF8mb4, allowPublicKeyRetrieval (si usas autenticacion por contrasena publica)
spring.datasource.url=jdbc:mysql://localhost:3306/tahona?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
# Preferible externalizar credenciales en variables de entorno; se mantienen valores por defecto para desarrollo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Iirne322*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
# En produccion considera cambiar a 'validate' o 'none' para evitar modificaciones automaticas del esquema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Usar dialecto MySQL8 para MySQL 8.x
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.properties.hibernate.default_schema=tahona
# Evitar open-in-view para reducir problemas de sesiones abiertas en vistas (recomendado)
spring.jpa.open-in-view=false
# Mantener nombres de columnas tal como estan definidos en @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
# Hikari - ajustes de pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=2000
# Test simple para validar conexiones
spring.datasource.hikari.connection-test-query=SELECT 1
# NOTA: Para produccion, mueve credenciales fuera del repositorio y ajusta ddl-auto, show-sql y otros parametros segun tu politica de despliegue.
# Lanzar cliente JavaFX al iniciar (solo para entornos de desarrollo local)
erp.launch-ui-on-start=true
