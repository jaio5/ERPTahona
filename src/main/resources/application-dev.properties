# Development profile
# MySQL es la base de datos por defecto en desarrollo.
# H2 solo se usa si se activa explicitamente ERP_FALLBACK_H2_ENABLED=true.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tahona?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Contraseña sin valor por defecto. Configúrala en application-local.properties o mediante la variable de entorno SPRING_DATASOURCE_PASSWORD
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Enable flyway in dev only when you explicitly want to validate migrations locally
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# Verifactu en dev: certificado autofirmado local para firma de evidencias.
# El fichero certs/dev-verifactu.p12 NO se commitea (certs/ está en .gitignore); se genera con:
#   keytool -genkeypair -alias mi_certificado -keyalg RSA -storetype PKCS12 \
#     -keystore certs/dev-verifactu.p12 -storepass devpass123 -validity 1095 \
#     -dname "CN=Panaderia Tahona DEV, O=Panaderia Tahona SL, C=ES"
# La remisión real a AEAT sigue deshabilitada (verifactu.aeat.enabled=false).
verifactu.keystore.path=${VERIFACTU_CERT_PATH:certs/dev-verifactu.p12}
verifactu.keystore.password=${VERIFACTU_CERT_PASSWORD:devpass123}
verifactu.key.alias=${VERIFACTU_KEY_ALIAS:mi_certificado}
verifactu.key.password=${VERIFACTU_KEY_PASSWORD:devpass123}
verifactu.aeat.enabled=${VERIFACTU_AEAT_ENABLED:false}
verifactu.aeat.endpoint=${VERIFACTU_AEAT_ENDPOINT:https://prewww2.aeat.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu}
# QR tributario: en dev se apunta al entorno de pruebas de AEAT
verifactu.qr.base-url=${VERIFACTU_QR_BASE_URL:https://prewww2.aeat.es/wlpl/TIKE-CONT/ValidarQR}

# Contraseña por defecto del usuario admin en dev/test
admin.default.password=${ADMIN_DEFAULT_PASSWORD:admin}

# Fallback H2 deshabilitado — app local con MySQL siempre disponible
erp.fallback-h2.enabled=false

# mysqldump/mysql locales de Windows en desarrollo (en Docker/produccion se resuelven del PATH)
backup.mysqldump-path=${BACKUP_MYSQLDUMP_PATH:C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe}
backup.mysql-path=${BACKUP_MYSQL_PATH:C:/Program Files/MySQL/MySQL Server 8.0/bin/mysql.exe}

# Templates recargables en desarrollo (sin reiniciar servidor al editar HTML)
spring.thymeleaf.cache=false

# Mostrar stacktrace completo en errores HTTP (solo dev)
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true
logging.file.name=logs/dev-runtime.log
