# Development profile - MySQL local by default (fallback to H2 if env vars set)
# Si quieres utilizar otra base en el perfil dev, exporta las variables
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD

# Por simplicidad escribimos aqu? los valores por defecto para MySQL local.
# Sustituye `tahona` / `root` / `Iirne322*` por los valores reales si tu entorno es distinto.
# A?adimos allowPublicKeyRetrieval=true para evitar el error de conexi?n con MySQL 8+.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tahona?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Iirne322*}
spring.datasource.hikari.maximum-pool-size=5

# Usamos dialecto MySQL para Hibernate en dev
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable flyway in dev if you want migrations (disabled by default)
spring.flyway.enabled=false

# Verifactu (deshabilitado por defecto en dev). Cuando dispongas del .p12, copialo a src/main/resources/certs/mi_certificado.p12
# y ajusta las propiedades o establece SPRING_APPLICATION_JSON / variables de entorno en producción.
verifactu.keystore.path=/certs/mi_certificado.p12
verifactu.keystore.password=changeit
verifactu.key.alias=mi_certificado
# No enviar a AEAT en dev salvo que explícitamente lo habilites y tengas un certificado válido
verifactu.aeat.enabled=false
verifactu.aeat.endpoint=https://prewww2.aeat.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu
