# Development profile - MySQL local by default (fallback to H2 if env vars set)
# Si quieres utilizar otra base en el perfil dev, exporta las variables
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD

# Por simplicidad escribimos aquí los valores por defecto para MySQL local.
# Sustituye `erpdb` / `root` / `root` por los valores reales si tu entorno es distinto.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tahona?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Iirne322*}
spring.datasource.hikari.maximum-pool-size=5

# Usamos dialecto MySQL para Hibernate en dev
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable flyway in dev if you want migrations (disabled by default)
spring.flyway.enabled=false
