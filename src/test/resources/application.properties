# Test profile configuration - H2 in-memory database for unit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Verifactu disabled for tests by default
verifactu.aeat.enabled=false
verifactu.aeat.endpoint=https://prewww2.aeat.es/wlpl/AVAC-FACT/ws/fe/SiiVerifactu
verifactu.keystore.path=
verifactu.keystore.password=
verifactu.key.alias=
verifactu.key.password=

# Compatibilidad: propiedades antiguas usadas por VerifactuAEATService
verifactu.cert.path=
verifactu.cert.password=
