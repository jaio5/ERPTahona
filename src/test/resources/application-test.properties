# Configuración para tests con h2 en memoria
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:erpdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# Usar update para evitar fallos por orden de creación de FK en algunos entornos de tests
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Evitar inicialización inmediata de datasource si hay scripts externos
spring.jpa.defer-datasource-initialization=true
